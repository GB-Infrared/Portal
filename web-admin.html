<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENEROPS OS · Web admin</title>
<link rel="icon" href="logo/favicon.png">
<style>
/* THE CUSTOMER PANEL'S STYLESHEET. Everything up to the WEB ADMIN block below is
   settings.html's own rules, copied without its notes, so the internal panel and
   the customer panel are one design: same tokens, same light and dark, same
   tables, dialogs and pickers. Change a shared rule in settings.html first, then
   here. The reasoning behind each rule is written up there. */
:root{

  --bg:#f1f4f8;
  --panel:#ffffff;
  --panel-2:#f5f8fb;
  --line:#dde4ec;
  --line-soft:#e9eef4;
  --line-hi:#b5c2d1;
  --text:#152234;
  --muted:#5a6b7f;
  --faint:#8494a6;
  --dim:#aab6c4;
  --elev:#ffffff;
  --sel:#e8f0fb;
  --hover:rgba(11,99,206,.07);
  --hover-soft:rgba(11,99,206,.045);

  --row-hover:rgba(11,99,206,.10);
  --shadow:rgba(19,38,63,.16);
  --on-accent:#ffffff;

  --topbar:var(--panel);
  --topbar-fg:var(--text);
  --topbar-fg-2:var(--muted);
  --topbar-tab:var(--muted);
  --topbar-hover:var(--hover);
  --topbar-active:var(--green-soft);
  --green:#12a150;
  --green-rgb:18,161,80;
  --green-soft:rgba(18,161,80,.12);
  --green-deep:#0b7a3c;
  --blue:#1a73c8;
  --blue-soft:rgba(26,115,200,.12);
  --red:#d92d20;
  --crit:#8c1109;
  --red-soft:rgba(217,45,32,.1);
  --amber:#dc7a06;
  --amber-soft:rgba(220,122,6,.12);
  --brand:#a87b0f;
  --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,'Helvetica Neue',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --r-lg:14px; --r-md:10px; --r-sm:8px;
}

html[data-theme="dark"]{

  color-scheme:dark;
  accent-color:#3ad998;
  --bg:#070c14;
  --panel:rgba(9,16,28,.74);
  --panel-2:rgba(9,16,28,.62);
  --line:rgba(150,180,220,.16);
  --line-soft:rgba(150,180,220,.10);
  --line-hi:rgba(140,175,215,.30);
  --text:#e9f1fb;
  --muted:#8ba0bb;
  --faint:#7d92ad;
  --dim:#5d6e83;

  --elev:#0d1624;
  --sel:rgba(127,178,238,.14);
  --hover:rgba(150,180,220,.07);
  --hover-soft:rgba(150,180,220,.045);
  --row-hover:rgba(150,180,220,.09);
  --shadow:rgba(0,0,0,.62);
  --scrim:rgba(3,7,13,.70);
  --grid-v:rgba(150,180,220,.07);

  --on-accent:#07121b;
  --green:#3ad998;
  --green-rgb:58,217,152;
  --green-soft:rgba(58,217,152,.14);
  --green-deep:#3ad998;
  --blue:#7fb2ee;
  --blue-soft:rgba(127,178,238,.16);
  --red:#ff6b5e;
  --red-soft:rgba(255,107,94,.14);
  --crit:#ff9d94;
  --amber:#f0b74a;
  --amber-soft:rgba(240,183,74,.15);
  --brand:#f0b74a;
  --brand-soft:rgba(240,183,74,.14);
  --brand-line:rgba(240,183,74,.34);

  --s1:#3ad998; --s2:#7fb2ee; --s3:#f0b74a; --s4:#b39cff;
  --s5:#ff8ac0; --s6:#4fd3dd; --s7:#e9a03c; --s8:#9a92ff;
  --s9:#4fd0bd; --s10:#e3c05a; --s11:#ff8ac0; --s12:#5cc0f5;
  --k1:#6aa8ff; --k2:#f7b955; --k3:#3ad998; --k4:#ff8ac0;
  --k5:#a99bff; --k6:#4fd3dd;
}

.themebtn{width:30px;height:30px;display:grid;place-items:center;flex:none;
  border-radius:8px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--topbar-fg-2,var(--muted));transition:background .12s,border-color .12s,color .12s}
.themebtn:hover{border-color:var(--line-hi);background:var(--topbar-hover,var(--hover));
  color:var(--topbar-fg,var(--text))}
.themebtn svg{display:block}

.themebtn .moon{display:none}
html[data-theme="dark"] .themebtn .moon{display:block}
html[data-theme="dark"] .themebtn .sun{display:none}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:var(--line-hi) transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;
     -webkit-font-smoothing:antialiased}

html[data-theme="dark"]{
  background:

    radial-gradient(circle 46vmax at 80% -8%,
      rgba(255,216,146,.085) 0%, rgba(240,178,73,.032) 32%, transparent 64%),

    radial-gradient(ellipse 155% 125% at 80% -8%,
      rgba(126,158,214,.115) 0%, rgba(90,120,180,.05) 46%, transparent 80%),

    radial-gradient(ellipse 130% 105% at 50% 62%,
      rgba(2,6,14,.34) 0%, rgba(0,1,5,.5) 100%),
    var(--bg);
}
html[data-theme="dark"] body{background:transparent}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line-hi);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:20px;
  height:58px;padding:0 22px;border-bottom:1px solid var(--line);
  background:var(--topbar);color:var(--topbar-fg)}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;border-radius:9px;padding:3px 8px;margin-left:-12px;
  cursor:pointer}
.brand .logo{height:34px;width:auto;display:block;flex:none}
.brand .btext{display:flex;flex-direction:column;justify-content:center;gap:1px}
.brand .word{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--brand);
  letter-spacing:.2px;line-height:1.05}
.brand .sub{font-size:9px;letter-spacing:.16em;color:var(--topbar-fg-2);text-transform:uppercase;
  font-weight:600;line-height:1}
@media (max-width:820px){ .brand .sub{display:none} }
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;
  background:transparent;border:1px solid transparent;color:var(--muted)}
.iconbtn:hover{color:var(--text);background:var(--hover);border-color:var(--line)}

.acct{position:relative;display:flex}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--text);
  border:1px solid var(--line);padding:0}
.avatar:hover,.acct.open .avatar{border-color:var(--line-hi);background:var(--hover)}
.acctmenu{position:absolute;top:calc(100% + 8px);right:0;z-index:90;width:224px;
  background:var(--elev);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:0 18px 44px -16px var(--shadow);padding:6px;display:none}
.acct.open .acctmenu{display:block}
.acctwho{padding:9px 10px 10px}
.acctwho .nm{font-size:13px;font-weight:700;color:var(--text);line-height:1.3}
.acctwho .em{font-size:11.5px;color:var(--muted);line-height:1.35;word-break:break-all}
.acctdiv{height:1px;background:var(--line-soft);margin:4px}
.acctitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
  font-size:12.5px;font-weight:600;color:var(--text);width:100%;
  border:none;background:transparent;text-align:left;font-family:inherit}
.acctitem:hover{background:var(--hover)}
.acctitem svg{flex:none;color:var(--faint)}
.acctitem:hover svg{color:var(--muted)}
.acctitem.out:hover{background:var(--red-soft);color:var(--red)}
.acctitem.out:hover svg{color:var(--red)}

.shell{display:grid;grid-template-columns:250px 1fr;align-items:start;
  min-height:calc(calc(100vh / var(--z,1)) - 58px)}

.side{position:sticky;top:58px;align-self:start;height:calc(calc(100vh / var(--z,1)) - 58px);overflow-y:auto;
  border-right:1px solid var(--line);background:var(--panel);padding:0 0 24px}
.sidehead{display:flex;align-items:center;justify-content:center;gap:10px;
  height:76px;border-bottom:1px solid var(--line-soft);color:var(--text)}
.sidehead .t{font-size:19px;font-weight:600;letter-spacing:-.01em}
.sidehead svg{color:var(--green)}

.grp{padding:6px 10px 0}
.grpbtn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;
  border:none;background:transparent;color:var(--text);font-family:inherit;
  font-size:13px;font-weight:600;text-align:left}
.grpbtn:hover{background:var(--hover)}
.grpbtn svg.gi{flex:none;color:var(--green)}

.grpbtn .chev{margin-left:auto;flex:none;color:var(--faint);transition:transform .16s ease}
.grp.shut .chev{transform:rotate(180deg)}
.grpitems{display:flex;flex-direction:column;gap:1px;padding:2px 0 4px 12px}
.grp.shut .grpitems{display:none}

.grp[hidden],.item[hidden]{display:none}

.item{display:block;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:500;
  color:var(--muted);width:100%;border:none;background:transparent;text-align:left;font-family:inherit}
.item:hover{color:var(--text);background:var(--hover)}

.item.on{color:var(--text);font-weight:700;background:var(--green-soft);
  box-shadow:inset 2px 0 0 var(--green)}

.main{padding:22px clamp(16px,calc(2vw / var(--z,1)),30px) 40px;min-width:0}
.pagehead{font-size:20px;font-weight:600;letter-spacing:-.01em;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.card .chead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:15px 20px 13px;
  border-bottom:1px solid var(--line-soft)}
.chead .title{font-size:14.5px;font-weight:700}
.chead .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;
  letter-spacing:.04em;background:transparent;border:1px solid var(--line);color:var(--muted);font-family:inherit}
.tbtn:hover:not(:disabled){color:var(--text);border-color:var(--line-hi);background:var(--hover)}

.panel{display:none}
.panel.on{display:block}

.who{display:flex;align-items:center;gap:18px;padding:24px 20px 22px}
.who .big{width:78px;height:78px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:700;color:var(--muted);flex:none}
.who .nm{font-size:20px;font-weight:700;letter-spacing:-.01em}
.who .ro{font-size:12px;color:var(--muted);margin-top:2px}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 32px;
  padding:4px 20px 24px}
@media (max-width:760px){ .fields{grid-template-columns:1fr} }
.f .k{display:block;font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:3px}
.f .v{font-size:13px;color:var(--muted);word-break:break-word}
.f .v.none{color:var(--dim);font-style:italic}

.cfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:15px 20px;border-top:1px solid var(--line-soft)}
.cfoot .k{font-size:12.5px;font-weight:700}
.cfoot .sp{margin-left:auto}
.linkbtn{border:none;background:transparent;font-family:inherit;
  font-size:12.5px;font-weight:600;color:var(--green-deep);padding:2px 0}
.linkbtn:hover{text-decoration:underline}

.sitepin{display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.sitepin svg{color:var(--green);flex:none}
.sitepin .n{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.02em}
.chead .count{font-size:11.5px;color:var(--faint)}
select{appearance:none;background:var(--panel-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%238d99a6" stroke-width="1.6" stroke-linecap="round"/></svg>') no-repeat right 10px center;
  border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);
  padding:0 28px 0 11px;font-size:13px;font-family:inherit;outline:none}
select:hover,select:focus{border-color:var(--line-hi);background-color:var(--hover)}

.mbtn{display:flex;align-items:center;width:100%;min-width:150px;height:34px;
  padding:0 28px 0 11px;border-radius:var(--r-sm);border:1px solid var(--line);
  color:var(--text);font-family:inherit;font-size:13px;font-weight:600;text-align:left;
  background:var(--panel-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%238d99a6" stroke-width="1.6" stroke-linecap="round"/></svg>') no-repeat right 10px center}
.mbtn:hover,.mbtn[aria-expanded=true]{border-color:var(--line-hi);background-color:var(--hover)}
.mbtn:focus-visible{outline:none;border-color:var(--line-hi);box-shadow:0 0 0 3px var(--hover-soft)}
.mbtn .mlab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mbtn .mlab.any{color:var(--muted);font-weight:600}
.fld.bad .mbtn{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}

.mbtn.mini{width:auto;min-width:158px;height:30px;font-size:12.5px;
  padding:0 26px 0 9px;background-position:right 9px center}

.mbtn.mini.perbtn{min-width:70px;font-family:var(--mono);font-size:12px;
  justify-content:space-between}

.colpanel{position:fixed;z-index:200;display:none;flex-direction:column;
  background:var(--elev);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 18px 44px -16px var(--shadow);padding:8px;overflow-y:auto}
.colpanel.on{display:flex}
.colhead{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:4px 8px 8px}
.colrow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;
  font-size:12.5px;font-weight:600;cursor:pointer;width:100%;background:transparent;
  border:none;color:var(--text);text-align:left}
.colrow:hover{background:var(--hover)}
.colrow input{width:14px;height:14px;min-width:0;accent-color:var(--green);flex:none}
.mpanel{min-width:212px}

.colrow.here{background:var(--row-hover)}
.colrow .t{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.colrow .s{flex:none;font-size:11px;font-weight:600;color:var(--faint)}
.colrow.none .t{color:var(--muted)}
.colnone{padding:9px;font-size:12px;color:var(--faint)}

.tablewrap{overflow-x:auto}
table{width:100%;min-width:820px;border-collapse:separate;border-spacing:0}
thead th{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:9px 14px;border-bottom:1px solid var(--line-soft);text-align:left;white-space:nowrap}

tbody td{padding:9px 14px;font-size:12.5px;border-bottom:1px solid var(--line-soft);
  color:var(--muted);white-space:nowrap}

tbody td.nm{font-weight:700;color:var(--text)}
tbody td.mono{font-family:var(--mono);font-weight:600}

tbody td.dim{color:var(--dim)}
tbody tr{transition:background-color .12s ease,box-shadow .12s ease}
tbody tr:hover{background:var(--row-hover);position:relative;z-index:1;
  box-shadow:inset 0 0 0 1px var(--line-hi),0 10px 22px -12px var(--shadow),0 2px 6px -4px var(--shadow)}
tbody tr:hover td:not(.dim){color:var(--text)}

tbody tr.gone td{color:var(--dim)}
tbody tr.gone td.nm{color:var(--muted)}
.empty-note{display:flex;align-items:center;justify-content:center;min-height:170px;
  color:var(--faint);font-size:12.5px}

.rowacts{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.rowbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border-radius:7px;border:1px solid transparent;background:transparent;color:var(--faint)}
.rowbtn:hover{color:var(--text);border-color:var(--line);background:var(--panel-2)}
.rowbtn.warn:hover{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}

.tfoot{display:flex;align-items:center;gap:14px;padding:11px 20px;font-size:12px;
  color:var(--muted);flex-wrap:wrap;border-top:1px solid var(--line-soft)}
.tfoot select{height:30px;min-width:0;font-size:12px;padding:0 26px 0 9px}
.tfoot .sp{margin-left:auto}
.tfoot .range{font-family:var(--mono)}
.pgbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);
  background:transparent;color:var(--muted)}
.pgbtn:hover:not(:disabled){color:var(--text);border-color:var(--line-hi)}
.pgbtn:disabled{opacity:.35;cursor:default}

.mwho{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:var(--r-sm);
  background:var(--panel-2);border:1px solid var(--line-soft)}
.mwho .r{display:flex;gap:8px;font-size:12px}
.mwho .r b{font-weight:700;color:var(--text);min-width:74px}
.mwho .r span{color:var(--muted);font-family:var(--mono);font-weight:600}
.mtext{font-size:12px;color:var(--muted);line-height:1.55}
.mtext b{color:var(--text);font-weight:700}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--on-accent)}
.btn.danger:hover{filter:brightness(.93)}
.pill.gone{color:var(--faint);background:var(--panel-2)}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;
  color:var(--muted);background:var(--panel-2);border:1px solid var(--line)}
.chip.all{color:var(--green-deep);background:var(--green-soft);border-color:transparent}

tbody td.pad{padding-top:6px;padding-bottom:6px}
#p-access-role table{min-width:660px}
#p-access-user table{min-width:820px}
#p-access-ctl table{min-width:700px}

.subdot{display:inline-block;width:10px;height:10px;border-radius:50%}
.subdot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-hi)}
.subdot.on.critical{background:var(--crit)}
.subdot.on.alarm{background:var(--red)}
.subdot.on.warn{background:var(--amber)}
.subdot.on.event{background:var(--faint)}
thead th.sev-h{text-align:center}
tbody td.sev-c{text-align:center}

thead th.sev-h.critical{color:var(--crit)}
thead th.sev-h.alarm{color:var(--red)}
thead th.sev-h.warn{color:var(--amber)}
#p-alarms-config table{min-width:800px}
.subrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.subbox{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.subbox input{width:15px;height:15px;accent-color:var(--green);flex:none}

tbody td.why{white-space:normal;min-width:230px;font-size:12px}
#p-energy-offset table{min-width:980px}

.who.co{padding-bottom:18px}
.cfoot .n{font-size:11.5px;color:var(--faint);line-height:1.45}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
  font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.live{color:var(--green-deep);background:var(--green-soft)}

.pill.held{color:var(--red);background:var(--red-soft)}

thead th .u{font-weight:600;letter-spacing:.03em;text-transform:none;color:var(--faint)}

.f .in{display:none}
.card.editing .f .v{display:none}
.card.editing .f .in{display:block}
.card.editing .tbtn.edit{display:none}
.in input{width:100%;padding:8px 11px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);font-family:inherit;font-size:13px}
.in input:hover{border-color:var(--line-hi)}

.in input:focus{outline:none;border-color:var(--line-hi);background-color:var(--hover);
  box-shadow:0 0 0 3px var(--hover-soft)}

.in .hint{font-size:11.5px;color:var(--faint);margin-top:4px;line-height:1.4}
.in .err{display:none;font-size:11.5px;font-weight:600;color:var(--red);margin-top:4px;line-height:1.4}
.f.bad .in input{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.f.bad .in .err{display:block}
.f.bad .in .hint{display:none}

.editing-tag{display:none;font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--green-deep);background:var(--green-soft);padding:3px 8px;border-radius:5px}

<script>
/* the theme, applied before the first paint - the same script and the same key
   as the customer panel, so a choice made in one is kept in the other */
(function(){
  var KEY='enerops-theme', root=document.documentElement;
  try{ if(localStorage.getItem(KEY)==='dark') root.setAttribute('data-theme','dark'); }catch(e){}
  function say(){
    var b=document.getElementById('themebtn');
    if(!b) return;
    /* the button names WHAT IT WILL DO, not where you are */
    var t = root.getAttribute('data-theme')==='dark' ? 'Switch to light' : 'Switch to dark';
    b.title=t; b.setAttribute('aria-label',t);
  }
  window.toggleTheme=function(){
    var dark = root.getAttribute('data-theme')==='dark';
    if(dark) root.removeAttribute('data-theme'); else root.setAttribute('data-theme','dark');
    try{ localStorage.setItem(KEY, dark?'light':'dark'); }catch(e){}
    say();
  };
  document.addEventListener('DOMContentLoaded', say);
})();
</script>
<script>
/* ===================== SCREEN SIZE: BIG SCREENS =====================
   The portal is laid out for a screen of about 1600 x 900. On a bigger screen
   - a 1920 x 1080 monitor or projector, a 2560 x 1440 monitor, a 4K screen or
   TV - the whole page is drawn larger by one factor, so it looks like the
   design, only bigger, instead of a small page in a sea of margin:
   1920 x 1080 -> 1.2x, 2560 x 1440 -> 1.6x, 3840 x 2160 -> 2.4x.
   The factor is the smaller of width / 1600 and height / 900, so a wide but
   short screen is never scaled past its height, and under 1.1x nothing is
   scaled at all. Screens smaller than the design are never shrunk: tablets and
   phones get the narrow layouts instead.

   How: CSS zoom on the page. Two things have to know about it.
   - Lengths written in vw / vh in the stylesheet are divided by --z, because
     zoom would otherwise multiply them too (100vh would be 2.4 screens tall).
   - The browser reports the mouse and the boxes on screen in screen pixels,
     but sizes set from code are page pixels. Code that does sums with both
     converts first: cssRect(el), cssX(e), cssY(e), viewW(), viewH(). A canvas
     draws at devicePixelRatio x zoom, so it stays sharp. */
(function(){
  var root=document.documentElement;
  function fit(){
    var z=Math.min(innerWidth/1600, innerHeight/900);
    z = z<1.1 ? 1 : Math.min(4, Math.round(z*20)/20);
    window.pageZoom=z;
    root.style.setProperty('--z', String(z));
    root.style.zoom = z===1 ? '' : String(z);
  }
  window.pageZoomNow=function(){ return window.pageZoom||1; };
  window.cssRect=function(el){
    var r=el.getBoundingClientRect(), z=window.pageZoom||1;
    return { left:r.left/z, top:r.top/z, right:r.right/z, bottom:r.bottom/z,
             width:r.width/z, height:r.height/z, x:r.left/z, y:r.top/z };
  };
  window.cssX=function(e){ return e.clientX/(window.pageZoom||1); };
  window.cssY=function(e){ return e.clientY/(window.pageZoom||1); };
  window.viewW=function(){ return innerWidth/(window.pageZoom||1); };
  window.viewH=function(){ return innerHeight/(window.pageZoom||1); };
  fit();
  addEventListener('resize', fit);
})();
</script>

window.ask=function(o){
  $('ask-title').textContent=o.title;
  $('ask-who').innerHTML=o.rows.map(function(r){ return '<div class="r"><b>'+r[0]+'</b><span>'+esc(r[1])+'</span></div>'; }).join('');
  $('ask-text').innerHTML=o.text;
  $('ask-go').textContent=o.go;
  askThen=o.then;
  scrimOn('askdlg');
  requestAnimationFrame(function(){ $('ask-go').focus(); });
};
window.askShut=function(){ scrimOff('askdlg'); askThen=null; };
window.askYes=function(){ const f=askThen; askShut(); if(f) f(); };

/* ======================= ONE-OF-MANY =======================
   The customer panel's picker, unchanged: a .mbtn carrying data-ss, one panel
   lent to whichever button is open, radios for one-of-many. */
const SSK={};
let ssPan=null, ssBtn=null, ssRows=[], ssHere=-1, ssTyped='', ssTypeAt=0;
function ssKind(btn){ return btn&&btn.dataset ? SSK[btn.dataset.ss] : null; }
function ssPanel(){
  if(ssPan) return ssPan;
  ssPan=document.createElement('div');
  ssPan.className='colpanel mpanel'; ssPan.id='sspanel';
  document.body.appendChild(ssPan);
  ssPan.addEventListener('mousedown',function(e){ e.preventDefault(); });
  ssPan.addEventListener('change',function(e){
    const r=e.target; if(!r) return;
    if(r.type==='radio') ssPick(+r.dataset.i);
    else if(r.type==='checkbox') ssToggle(+r.dataset.i,r.checked);
  });
  ssPan.addEventListener('mousemove',function(e){ const r=e.target.closest('.colrow'); if(r) ssMark(+r.dataset.i,false); });
  return ssPan;
}
function ssShow(btn,o){
  const lab=btn.querySelector('.mlab');
  btn.value = o ? String(o.v) : '';
  lab.textContent = o ? o.t : (btn.dataset.any||'Choose');
  lab.classList.toggle('any', !o || o.v==='');
}
function ssOpen(btn){
  const k=ssKind(btn); if(!k) return;
  const pan=ssPanel();
  ssBtn=btn; ssRows=k.list(btn); ssTyped='';
  const rows=ssRows.map(function(o,i){
    const on=k.multi ? k.on(btn,o.v) : String(o.v)===String(btn.value);
    return '<label class="colrow'+(o.none?' none':'')+'" id="ssrow'+i+'" data-i="'+i+'">'
      +'<input type="'+(k.multi?'checkbox':'radio')+'" name="ss-'+btn.dataset.ss+'" data-i="'+i+'"'+(on?' checked':'')+'>'
      +'<span class="t">'+esc(o.t)+'</span>'+(o.s?'<span class="s">'+esc(o.s)+'</span>':'')+'</label>';
  }).join('');
  pan.innerHTML='<div class="colhead">'+esc(k.label?k.label(btn):'Options')+'</div>'
    +(rows || '<div class="colnone">'+esc(k.empty||'Nothing to choose from')+'</div>');
  pan.classList.add('on');
  btn.setAttribute('aria-expanded','true');
  ssPlace();
  let at=-1;
  ssRows.forEach(function(o,i){ if(at<0 && String(o.v)===String(btn.value)) at=i; });
  ssMark(at,true);
}
function ssPlace(){
  if(!ssBtn) return;
  const r=cssRect(ssBtn), gap=6, edge=10;
  ssPan.style.minWidth=Math.max(r.width,150)+'px';
  ssPan.style.maxWidth=Math.max(r.width,320)+'px';
  ssPan.style.maxHeight='none';
  const want=ssPan.offsetHeight, under=viewH()-r.bottom-edge, over=r.top-edge;
  const up = want>under && over>under;
  ssPan.style.maxHeight=Math.max(96,(up?over:under)-gap)+'px';
  const h=ssPan.offsetHeight, w=ssPan.offsetWidth;
  ssPan.style.top=(up ? Math.max(edge, r.top-gap-h) : r.bottom+gap)+'px';
  ssPan.style.left=Math.max(edge, Math.min(r.left, viewW()-edge-w))+'px';
}
function ssClose(back){
  if(!ssBtn) return;
  const btn=ssBtn;
  ssPan.classList.remove('on');
  btn.setAttribute('aria-expanded','false');
  btn.removeAttribute('aria-activedescendant');
  ssBtn=null; ssRows=[]; ssHere=-1;
  if(back && btn.isConnected) btn.focus();
}
function ssMark(i,scroll){
  if(!ssPan) return;
  [].slice.call(ssPan.querySelectorAll('.colrow.here')).forEach(function(el){ el.classList.remove('here'); });
  ssHere=(i==null||i<0)?-1:i;
  const el=ssHere>=0 ? ssPan.querySelector('#ssrow'+ssHere) : null;
  if(!el){ if(ssBtn) ssBtn.removeAttribute('aria-activedescendant'); return; }
  el.classList.add('here');
  if(ssBtn) ssBtn.setAttribute('aria-activedescendant',el.id);
  if(scroll!==false) el.scrollIntoView({block:'nearest'});
}
function ssStep(dir){ const i=(ssHere<0?(dir>0?-1:ssRows.length):ssHere)+dir; if(i>=0&&i<ssRows.length) ssMark(i,true); }
function ssToggle(i,on){
  const o=ssRows[i], k=ssKind(ssBtn); if(!o||!k) return;
  k.toggle(ssBtn,o.v,on);
}
function ssPick(i){
  const o=ssRows[i]; if(!o) return;
  const btn=ssBtn, k=ssKind(btn);
  if(k && k.multi){
    const cb=ssPan.querySelector('#ssrow'+i+' input');
    if(cb){ cb.checked=!cb.checked; ssToggle(i,cb.checked); }
    return;
  }
  ssShow(btn,o); ssClose(true);
  if(k&&k.pick) k.pick(btn,o.v,o);
}
function ssType(ch){
  const now=Date.now();
  ssTyped=((now-ssTypeAt<900?ssTyped:'')+ch).toLowerCase(); ssTypeAt=now;
  const n=ssRows.length, from=(ssHere<0?0:ssHere)+(ssTyped.length>1?0:1);
  for(let hop=0;hop<n;hop++){ const i=((from+hop)%n+n)%n; if(String(ssRows[i].t).toLowerCase().indexOf(ssTyped)===0){ ssMark(i,true); return; } }
}
document.addEventListener('click',function(e){
  const b=e.target.closest ? e.target.closest('.mbtn') : null;
  if(!b) return;
  e.stopPropagation();
  if(ssBtn===b) ssClose(true); else ssOpen(b);
});
document.addEventListener('mousedown',function(e){
  if(!ssBtn) return;
  if(ssPan && ssPan.contains(e.target)) return;
  if(e.target.closest && e.target.closest('.mbtn')===ssBtn) return;
  ssClose(false);
},true);
document.addEventListener('keydown',function(e){
  const f=document.activeElement;
  const btn=ssBtn || (f && f.classList && f.classList.contains('mbtn') ? f : null);
  if(!btn){
    if(e.key==='Escape'){
      if($('fdlg').classList.contains('on')) fShut();
      else if($('askdlg').classList.contains('on')) askShut();
      else $('acct').classList.remove('open');
    }
    return;
  }
  if(!ssBtn){ if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter'||e.key===' '){ e.preventDefault(); ssOpen(btn); } return; }
  if(e.key==='Escape'||e.key==='Tab'){ if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); } ssClose(e.key==='Escape'); return; }
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); ssPick(ssHere); return; }
  if(e.key==='ArrowDown'){ e.preventDefault(); ssStep(1); return; }
  if(e.key==='ArrowUp'){ e.preventDefault(); ssStep(-1); return; }
  if(e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); ssType(e.key); }
},true);
window.addEventListener('resize',function(){ if(ssBtn) ssPlace(); });
window.addEventListener('scroll',function(){ if(ssBtn) ssPlace(); },true);

function mbtn(id,kind,value,text,extra){
  return '<button class="mbtn" type="button" id="'+id+'" data-ss="'+kind+'" value="'+esc(value)+'"'
    +(extra||'')+' aria-haspopup="true" aria-expanded="false"><span class="mlab'+(value===''?' any':'')+'">'+esc(text)+'</span></button>';
}

/* ======================= TABLES =======================
   One table drawer for every list on the page: columns, rows, row actions,
   and the same pager the customer panel uses. */
const PG={};
SSK.per={label:()=>'Rows per page',list:()=>[25,50,100].map(n=>({v:n,t:String(n)})),
  pick:function(btn,v){ PG[btn.dataset.t].per=+v; PG[btn.dataset.t].pg=0; DRAW[btn.dataset.page](); }};
const I_PEN='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
const I_BIN='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
function rowBtns(edit,del){
  return '<div class="rowacts">'
    +(edit?'<button class="rowbtn" type="button" title="Edit" aria-label="Edit" onclick="'+edit+'">'+I_PEN+'</button>':'')
    +(del?'<button class="rowbtn warn" type="button" title="Delete" aria-label="Delete" onclick="'+del+'">'+I_BIN+'</button>':'')
    +'</div>';
}
function grid(t,page,cols,rows,cell,empty){
  if(!PG[t]) PG[t]={pg:0,per:25};
  const st=PG[t], per=st.per, pages=Math.max(1,Math.ceil(rows.length/per));
  if(st.pg>=pages) st.pg=pages-1;
  const from=st.pg*per, slice=rows.slice(from,from+per);
  $(t+'-head').innerHTML='<tr>'+cols.map(function(c){ return '<th'+(c.num?' class="num"':(c.t===''?' class="acts"':''))+'>'+c.t+'</th>'; }).join('')+'</tr>';
  $(t+'-body').innerHTML = slice.length ? slice.map(function(r){ return cell(r); }).join('')
    : '<tr><td colspan="'+cols.length+'"><div class="empty-note">'+esc(empty)+'</div></td></tr>';
  $(t+'-foot').innerHTML='<span>Rows per page</span>'
    +'<button class="mbtn mini perbtn" type="button" data-ss="per" data-t="'+t+'" data-page="'+page+'" value="'+per+'" aria-haspopup="true" aria-expanded="false"><span class="mlab">'+per+'</span></button>'
    +'<span class="sp"></span><span class="range">'+(rows.length?(from+1)+'-'+Math.min(from+per,rows.length)+' of '+rows.length:'0-0 of 0')+'</span>'
    +'<button class="pgbtn" type="button"'+(st.pg<=0?' disabled':'')+' onclick="pgGo(\''+t+'\',\''+page+'\',-1)">&lsaquo;</button>'
    +'<button class="pgbtn" type="button"'+(st.pg>=pages-1?' disabled':'')+' onclick="pgGo(\''+t+'\',\''+page+'\',1)">&rsaquo;</button>';
}
window.pgGo=function(t,page,n){ PG[t].pg+=n; DRAW[page](); };
const count=(n,one,many)=>n+' '+(n===1?one:(many||one+'s'));

/* ======================= FILTERS =======================
   Customer, plant and logger are chosen once and shared by the three pages
   that need them, so moving from Assets to Loggers keeps the customer in view. */
const F={cust:'48210375',asset:'52807316',logger:'46283917',sdev:'DV-INV-350'};
function fixFilters(){
  const mc=myCustomers(); if(!mc.some(c=>c.id===F.cust)) F.cust=mc.length?mc[0].id:'';
  const as=assetsOf(F.cust); if(!as.some(a=>a.id===F.asset)) F.asset=as.length?as[0].id:'';
  const ls=loggersOf(F.asset); if(!ls.some(l=>l.id===F.logger)) F.logger=ls.length?ls[0].id:'';
  if(!catOf(F.sdev)) F.sdev=CATALOG.length?CATALOG[0].id:'';
}
SSK.filt={
  label:btn=>({cust:'Customer',asset:'Plant',logger:'Logger',sdev:'Device'})[btn.dataset.f],
  empty:'Nothing here yet',
  list:function(btn){
    const f=btn.dataset.f;
    if(f==='cust') return myCustomers().map(c=>({v:c.id,t:c.name,s:c.id}));
    if(f==='asset') return assetsOf(F.cust).map(a=>({v:a.id,t:a.name,s:a.id}));
    if(f==='logger') return loggersOf(F.asset).map(l=>({v:l.id,t:l.name,s:l.id}));
    return CATALOG.map(d=>({v:d.id,t:d.name,s:catName(d.cat)}));
  },
  pick:function(btn,v){ F[btn.dataset.f]=v; fixFilters(); DRAW[btn.dataset.page](); }
};
function filters(box,page,which){
  fixFilters();
  const name={cust:c=>custOf(c),asset:a=>assetOf(a),logger:l=>loggerOf(l),sdev:d=>catOf(d)};
  const lab={cust:'Customer',asset:'Plant',logger:'Logger',sdev:'Device'};
  $(box).innerHTML=which.map(function(f){
    const r=name[f](F[f]);
    return '<div class="filt"><span class="fl">'+lab[f]+'</span>'
      +mbtn('fl-'+page+'-'+f,'filt',F[f],r?r.name:'None',' data-f="'+f+'" data-page="'+page+'" data-any="None"')+'</div>';
  }).join('');
}

/* ======================= ONE FORM DIALOG =======================
   A form is a list of fields. Types: text, email, tel, number, date, password,
   area, select (a .mbtn), checks (several of a list) and choice (one of a few,
   as radios). A field can depend on others: opts and show are worked out from
   the values so far, and picking a value redraws the form. */
let FS=null, FV={};
SSK.fsel={
  label:btn=>fieldOf(btn.dataset.k).label,
  empty:'Nothing to choose from',
  list:btn=>optsOf(fieldOf(btn.dataset.k)),
  pick:function(btn,v){ FV[btn.dataset.k]=v; fRender(); }
};
function fieldOf(k){ return FS.fields.filter(f=>f.k===k)[0]; }
function anyOf(f){ return typeof f.any==='function' ? f.any(FV) : (f.any||'Choose'); }
/* what a several-of-many button says: the names chosen, All when every one
   is, and the field's own empty word when none are */
function multiText(f){
  const sel=(FV[f.k]||[]).map(String), o=optsOf(f);
  if(!o.length) return f.none||'Nothing to choose from';
  if(!sel.length) return anyOf(f);
  return o.filter(x=>sel.indexOf(String(x.v))>=0).map(x=>x.t).join(', ');
}
SSK.fmulti={
  multi:true,
  label:btn=>fieldOf(btn.dataset.k).label,
  empty:'Nothing to choose from',
  list:btn=>optsOf(fieldOf(btn.dataset.k)),
  on:(btn,v)=>(FV[btn.dataset.k]||[]).map(String).indexOf(String(v))>=0,
  toggle:function(btn,v,on){
    const k=btn.dataset.k, f=fieldOf(k);
    const a=(FV[k]||[]).map(String).filter(x=>x!==String(v));
    if(on) a.push(String(v));
    const order=optsOf(f).map(x=>String(x.v));
    FV[k]=a.sort((p,q)=>order.indexOf(p)-order.indexOf(q));
    const lab=btn.querySelector('.mlab');
    lab.textContent=multiText(f); lab.classList.toggle('any',!FV[k].length);
    btn.value=FV[k].length?'x':'';
  }
};
function optsOf(f){ const o=typeof f.opts==='function'?f.opts(FV):f.opts; return (o||[]).map(x=>typeof x==='string'?{v:x,t:x}:x); }
function fOpen(spec,values){
  FS=spec; FV=Object.assign({},values||{});
  spec.fields.forEach(function(f){
    if(!f.k || FV[f.k]!==undefined) return;
    FV[f.k]=f.def!==undefined ? (Array.isArray(f.def)?f.def.slice():f.def) : (f.type==='checks'?[]:'');
  });
  $('f-title').textContent=spec.title;
  $('f-go').textContent=spec.go||'Save';
  $('f-modal').className='modal'+(spec.wide?' '+spec.wide:'');
  $('f-grid').innerHTML='';
  $('f-grid').style.setProperty('--cols',spec.cols||2);
  const who=$('f-who');
  who.hidden=!spec.who;
  who.innerHTML=(spec.who||[]).map(r=>'<div class="r"><b>'+r[0]+'</b><span>'+esc(r[1])+'</span></div>').join('');
  fRender();
  scrimOn('fdlg');
  requestAnimationFrame(function(){ const i=$('f-grid').querySelector('input:not([type=checkbox]):not([type=radio]):not([readonly]),textarea,.mbtn'); if(i) i.focus(); });
}
window.fShut=function(){ scrimOff('fdlg'); FS=null; };
function fRead(){
  if(!FS) return;
  FS.fields.forEach(function(f){
    if(!f.k || !$('f-grid').querySelector('.fld[data-k="'+f.k+'"]')) return;
    if(f.type==='checks') FV[f.k]=[].slice.call(document.querySelectorAll('[name="ff-'+f.k+'"]:checked')).map(x=>x.value);
    else if(f.type==='choice'){ const c=document.querySelector('[name="ff-'+f.k+'"]:checked'); if(c) FV[f.k]=c.value; }
    else if(f.type!=='select' && f.type!=='multi' && f.type!=='ro'){ const el=$('ff-'+f.k); if(el) FV[f.k]=el.value; }
  });
}
function fRender(){
  fRead();
  $('f-grid').innerHTML=FS.fields.map(function(f){
    if(f.sec) return '<div class="msec">'+esc(f.sec)+'</div>';
    const on=!f.show || f.show(FV);
    if(!on && f.hide) return '';
    const id='ff-'+f.k, v=FV[f.k];
    const lab='<label class="lab"'+(f.type==='checks'||f.type==='choice'||f.type==='select'||f.type==='multi'?'':' for="'+id+'"')+'>'+esc(f.label)
      +(f.opt?'<span class="opt">optional</span>':'')+'</label>';
    let ctl;
    if(f.type==='ro'){
      ctl='<input id="'+id+'" type="text" value="'+esc(v)+'" readonly tabindex="-1">';
    } else if(f.type==='multi'){
      ctl=mbtn(id,'fmulti',(v||[]).length?'x':'',multiText(f),' data-k="'+f.k+'" data-any="'+esc(anyOf(f))+'"');
    } else if(f.type==='select'){
      const o=optsOf(f).filter(x=>String(x.v)===String(v))[0];
      ctl=mbtn(id,'fsel',o?o.v:'',o?o.t:anyOf(f),' data-k="'+f.k+'" data-any="'+esc(anyOf(f))+'"');
    } else if(f.type==='checks'){
      const o=optsOf(f);
      ctl='<div class="subrow checks">'+(o.length?o.map(function(x){
        return '<label class="subbox"><input type="checkbox" name="'+id+'" value="'+esc(x.v)+'"'+((v||[]).indexOf(String(x.v))>=0||(v||[]).indexOf(x.v)>=0?' checked':'')+'>'+esc(x.t)+'</label>';
      }).join(''):'<span class="mtext">'+esc(f.none||'Nothing to choose from')+'</span>')+'</div>';
    } else if(f.type==='choice'){
      ctl='<div class="subrow">'+optsOf(f).map(function(x){
        return '<label class="subbox"><input type="radio" name="'+id+'" value="'+esc(x.v)+'"'+(String(v)===String(x.v)?' checked':'')+' onchange="fRender()">'+esc(x.t)+'</label>';
      }).join('')+'</div>';
    } else if(f.type==='area'){
      ctl='<textarea id="'+id+'" maxlength="'+(f.max||300)+'">'+esc(v)+'</textarea>';
    } else {
      ctl='<input id="'+id+'" type="'+(f.type||'text')+'" value="'+esc(v)+'"'
        +(f.type==='number'?' step="any" inputmode="decimal"':'')+' autocomplete="off" spellcheck="false" maxlength="'+(f.max||120)+'">';
    }
    const place=(f.newRow||f.w)?' style="grid-column:'+(f.newRow?'1':'auto')+' / span '+(f.w||1)+'"':'';
    return '<div class="fld'+(f.span?' span':'')+(on?'':' off')+'" data-k="'+f.k+'"'+place+'>'+lab+ctl
      +(f.hint?'<div class="hint">'+f.hint+'</div>':'')+'<div class="err"></div></div>';
  }).join('');
}
function fErr(k,msg){
  const el=$('f-grid').querySelector('.fld[data-k="'+k+'"]'); if(!el) return;
  el.classList.toggle('bad',!!msg); el.querySelector('.err').textContent=msg||'';
}
window.fSave=function(e){
  e.preventDefault();
  fRead();
  let bad=null;
  FS.fields.forEach(function(f){
    if(!f.k) return;
    fErr(f.k,'');
    if(f.show && !f.show(FV)) return;
    const v=FV[f.k], empty=Array.isArray(v)?!v.length:String(v==null?'':v).trim()==='';
    let msg='';
    if(!f.opt && empty) msg=f.type==='checks'?'Choose at least one.':(f.type==='select'||f.type==='choice'?'Choose one.':'Required.');
    else if(!empty && f.type==='email' && !EMAIL.test(String(v).trim())) msg='That does not look like an email address.';
    else if(!empty && f.type==='number' && !isFinite(+v)) msg='A number, please.';
    else if(!empty && f.type==='number' && f.min!==undefined && +v<f.min) msg='At least '+f.min+'.';
    else if(!empty && f.type==='tel' && String(v).replace(/\D/g,'').length<7) msg='That does not look like a phone number.';
    if(msg){ fErr(f.k,msg); bad=bad||f.k; }
  });
  if(!bad && FS.check){ const r=FS.check(FV); if(r){ fErr(r[0],r[1]); bad=r[0]; } }
  if(bad){ const el=$('f-grid').querySelector('.fld[data-k="'+bad+'"] input,.fld[data-k="'+bad+'"] textarea,.fld[data-k="'+bad+'"] .mbtn'); if(el) el.focus(); return false; }
  const out={}; Object.keys(FV).forEach(k=>{ out[k]=typeof FV[k]==='string'?FV[k].trim():FV[k]; });
  const msg=FS.save(out);
  fShut();
  if(msg) T(msg);
  return false;
};

/* ======================= CUSTOMERS ======================= */
/* Every ID a person would otherwise type - customer, plant, logger and the
   customer's device - is made here instead: eight random digits, never
   starting with 0, and never one already in use anywhere on the panel. It
   stays the same for the life of the record, so no form offers to edit it. */
function newId(){
  const used=id=>custOf(id)||assetOf(id)||loggerOf(id)||CDEV.some(d=>d.cid===id);
  let id;
  do{ id=String(Math.floor(10000000+Math.random()*90000000)); }while(used(id));
  return id;
}
const CU_FIELDS=[
  {sec:'Customer admin'},
  {k:'first',label:'First name'},{k:'last',label:'Last name'},
  {k:'amail',label:'Admin email',type:'email',span:1,hint:'They sign in to the customer admin panel with this.'},
  {sec:'Company'},
  {k:'name',label:'Name',hint:'What the customer panel calls them.'},{k:'legal',label:'Legal name'},
  {k:'cmail',label:'Company email',type:'email'},{k:'phone',label:'Contact number',type:'tel'},
  {k:'addr',label:'Address',type:'area',span:1}
];
DRAW.customers=function(){
  grid('cu','customers',[{t:'Id'},{t:'Name'},{t:'Legal name'},{t:'Company email'},{t:'Contact number'},{t:'Admin email'},{t:'Address'},{t:'Plants',num:1},{t:''}],
    CUSTOMERS,function(c){
      const n=assetsOf(c.id).length;
      return '<tr><td class="mono">'+c.id+'</td><td class="nm">'+esc(c.name)+'</td><td>'+esc(c.legal)+'</td><td>'+esc(c.cmail)+'</td>'

/* A delete always runs, and says first what goes with the record: a
   customer takes its plants, a plant its loggers, a logger its devices. */
function also(plants,loggers,devices){
  const p=[];
  if(plants) p.push(count(plants,'plant'));
  if(loggers) p.push(count(loggers,'logger'));
  if(devices) p.push(count(devices,'device'));
  if(!p.length) return '';
  return ' Its '+(p.length>1?p.slice(0,-1).join(', ')+' and '+p[p.length-1]:p[0])+' are removed with it.';
}
function dropLogger(l){ CDEV.filter(d=>d.logger===l.id).forEach(d=>CDEV.splice(CDEV.indexOf(d),1)); LOGGERS.splice(LOGGERS.indexOf(l),1); }
function dropAsset(a){ loggersOf(a.id).forEach(dropLogger); ASSETS.splice(ASSETS.indexOf(a),1); }
window.cuDel=function(id){
  const c=custOf(id), as=assetsOf(id), ls=LOGGERS.filter(l=>as.some(a=>a.id===l.asset));
  const ds=CDEV.filter(d=>ls.some(l=>l.id===d.logger));
  ask({title:'Delete customer',rows:[['Customer',c.name],['Admin',c.amail]],
    text:'The customer and their admin account are removed. Their admin can no longer sign in to the customer admin panel.'+also(as.length,ls.length,ds.length),
    go:'Delete customer',then:function(){
      as.forEach(dropAsset);
      ROLES.forEach(r=>{ r.cust=r.cust.filter(x=>x!==c.id); });
      CUSTOMERS.splice(CUSTOMERS.indexOf(c),1); fixFilters(); DRAW.customers(); T(c.name+' deleted');
    }});
};

  return CDEV.filter(d=>ls.indexOf(d.logger)>=0 && (catOf(d.dev)||{}).cat==='MFM').map(d=>({v:d.name,t:d.name,s:d.cid}));
};
const wmsOpts=function(v){

  return CDEV.filter(d=>ls.indexOf(d.logger)>=0 && (catOf(d.dev)||{}).cat==='WMS').map(d=>({v:d.name,t:d.name}));

const TIMEZONES=[['Asia/Kolkata','Asia/Kolkata (UTC+05:30)'],['Asia/Dubai','Asia/Dubai (UTC+04:00)'],
  ['Asia/Singapore','Asia/Singapore (UTC+08:00)'],['Africa/Nairobi','Africa/Nairobi (UTC+03:00)'],
  ['Europe/London','Europe/London (UTC+00:00)'],['America/New_York','America/New_York (UTC-05:00)'],
  ['Australia/Sydney','Australia/Sydney (UTC+10:00)']];
const YESNO=[{v:'no',t:'No'},{v:'yes',t:'Yes'}];
const KPI_OPTS=METRICS.map(m=>({v:m[0],t:m[1]}));
const meterWord=v=>meterOpts(v).length?'Select':'No meters found';
/* HOME PAGE DATA SOURCE: where three things on the customer Home page read
   from - inverters (the default, as today) or one meter of this plant. */
const HPDS=[['power','Plant Power source','Plant Power graph and the Plant Power value in Plant Details.'],
  ['energy','Plant Energy source','Plant Energy value in Plant Details.'],
  ['gen','Energy Generation source','Plant Energy Generation graph (daily e-diff).']];
/* The live panel's plant form, field for field and in its order: the customer
   on its own row, then the plant four to a row, then where its energy and each
   KPI are counted from, then how its KPIs are shown. The three settings under
   Configure KPI belong to whichever KPI is picked there - each KPI keeps its
   own. */
function asFields(){
  const f=[
    {k:'cust',label:'Select Customer',type:'select',any:'Select',opts:()=>myCustomers().map(c=>({v:c.id,t:c.name,s:c.id}))},
    {k:'name',label:'Name',newRow:1},
    {k:'id',label:'Asset ID',type:'ro',hint:'Made automatically.'},
    {k:'area',label:'Area'},{k:'city',label:'City'},
    {k:'state',label:'State'},{k:'country',label:'Country',def:'India'},{k:'zip',label:'Zip'},
    {k:'lat',label:'Latitude',type:'number'},
    {k:'lng',label:'Longitude',type:'number'},{k:'addr',label:'Address'},
    {k:'desc',label:'Asset Description',opt:1},
    {k:'ac',label:'AC Capacity (kW)',type:'number',min:0},
    {k:'dc',label:'DC Capacity (kWp)',type:'number',min:0},
    {k:'pstc',label:'PSTC (kWp)',type:'number',min:0},
    {k:'mod',label:'Modules Power Rating (Wp)',type:'number',min:0},
    {k:'minIrr',label:'Minimum Irradiance (W/m\u00b2)',type:'number',min:0},
    {k:'inst',label:'Installation Date',type:'date'},
    {k:'sensors',label:'Irradiation Sensor',type:'multi',opts:wmsOpts,opt:1,any:'Select',none:'No weather station on this plant'},
    {k:'pages',label:'Page Access',type:'multi',opts:CHOICE_PAGES,def:CHOICE_PAGES.slice(),any:'None',opt:1,
     hint:'Home, Monitoring and Alarms are always on.'},
    {k:'irr',label:'Irradiance',type:'select',def:'inclined',opts:[{v:'inclined',t:'Inclined (POA)'},{v:'horizontal',t:'Horizontal (GHI)'}]},
    {k:'tz',label:'Select Timezone',type:'select',def:'Asia/Kolkata',opts:TIMEZONES.map(t=>({v:t[0],t:t[1]})),w:2},
    {sec:'Home Page Data Source'}
  ];
  HPDS.forEach(function(h){
    f.push({k:'hs_'+h[0],label:h[1],type:'select',def:'inverter',opts:sourceOpts,hint:h[2]},
      {k:'hm_'+h[0],label:'Meter',type:'select',opts:meterOpts,any:meterWord,show:v=>v['hs_'+h[0]]==='meter',
       hint:'One meter of this plant.'});
  });
  f.push(
    {sec:'Energy Source Selection For Metrics'},
    {k:'src',label:'Energy Source',type:'select',def:'inverter',opts:sourceOpts},
    {k:'meter',label:'Meter',type:'select',opts:meterOpts,any:meterWord,show:v=>v.src==='meter'}
  );
  METRICS.forEach(function(m){ f.push({k:'m_'+m[0],label:m[1],type:'select',opts:meterOpts,any:meterWord,opt:1}); });
  f.push({sec:'KPI Configuration'},
    {k:'kpiHome',label:'Default Home Page KPI',type:'select',def:'pr',opts:KPI_OPTS},
    {k:'ckpi',label:'Configure KPI',type:'select',def:'pr',opts:KPI_OPTS,newRow:1});
  METRICS.forEach(function(m){
    const mine=v=>v.ckpi===m[0];
    f.push({k:'kb_'+m[0],label:'Show Barchart',type:'select',def:'no',opts:YESNO,show:mine,hide:1},
      {k:'ka_'+m[0],label:'Auxiliary Supply Meter Available',type:'select',def:'no',opts:YESNO,show:mine,hide:1},
      {k:'kp_'+m[0],label:'Energy at POI Meter Available',type:'select',def:'no',opts:YESNO,show:mine,hide:1});
  });
  return f;
}
function asValues(a){
  const v=Object.assign({},a); delete v.metrics; delete v.kcfg;
  METRICS.forEach(function(m){
    v['m_'+m[0]]=a.metrics[m[0]];
    v['kb_'+m[0]]=a.kcfg[m[0]].bar; v['ka_'+m[0]]=a.kcfg[m[0]].aux; v['kp_'+m[0]]=a.kcfg[m[0]].poi;
  });
  v.ckpi=a.kpiHome;
  HPDS.forEach(function(h){ v['hs_'+h[0]]=a.hp[h[0]].src; v['hm_'+h[0]]=a.hp[h[0]].meter; });
  v.pages=(a.pages||[]).filter(p=>CHOICE_PAGES.indexOf(p)>=0);
  return v;
}
function asStore(a,v){
  const metrics={}, kcfg={};
  METRICS.forEach(function(m){
    metrics[m[0]]=v['m_'+m[0]]||'';
    kcfg[m[0]]={bar:v['kb_'+m[0]],aux:v['ka_'+m[0]],poi:v['kp_'+m[0]]};
    delete v['m_'+m[0]]; delete v['kb_'+m[0]]; delete v['ka_'+m[0]]; delete v['kp_'+m[0]];
  });
  delete v.ckpi;
  const hp={};
  HPDS.forEach(function(h){
    const src=v['hs_'+h[0]];
    hp[h[0]]={src:src, meter:src==='meter'?v['hm_'+h[0]]:''};
    delete v['hs_'+h[0]]; delete v['hm_'+h[0]];
  });
  v.hp=hp;
  v.pages=FIXED_PAGES.concat(CHOICE_PAGES.filter(p=>(v.pages||[]).indexOf(p)>=0));
  if(v.src!=='meter') v.meter='';
  Object.assign(a,v,{metrics:metrics,kcfg:kcfg});
}

    then:function(){ held.forEach(o=>{ o.role=null; }); ROLES.splice(ROLES.indexOf(r),1); DRAW.roles(); T(r.name+' deleted'); }});
};

/* ---------- access control ---------- */
SSK.orole={label:()=>'Role',
  list:()=>[{v:'',t:'No role',none:true}].concat(ROLES.map(r=>({v:r.id,t:r.name}))),
  pick:function(btn,v){
    const o=byId(OPERATORS,btn.dataset.o); o.role=v||null; DRAW.assign();
    T(v?opName(o)+' now holds '+roleOf(v).name:opName(o)+' no longer holds a role');
  }};
DRAW.assign=function(){
  grid('ra','assign',[{t:'User'},{t:'Email'},{t:'Role level'},{t:'Role'},{t:'Customers they reach'}],team(),function(o){
    const r=roleOf(o.role);
    return '<tr><td class="nm">'+esc(opName(o))+'</td><td>'+esc(o.email)+'</td><td>'+LEVELS[o.level]+'</td>'
      +(CAN.manageRoles
        ? '<td class="pad"><button class="mbtn mini" type="button" data-ss="orole" data-o="'+o.id+'" value="'+(o.role||'')+'" data-any="No role" aria-haspopup="true" aria-expanded="false">'
          +'<span class="mlab'+(r?'':' any')+'">'+esc(r?r.name:'No role')+'</span></button></td>'
        : '<td>'+(r?esc(r.name):'<span class="none-t">No role</span>')+'</td>')
      +'<td class="wrap">'+(r?reach(r.cust):'<span class="none-t">None</span>')+'</td></tr>';
  },'No users yet');
};

/* ======================= MY PROFILE ======================= */
const ME_FIELDS=[['first','First name','text'],['last','Last name','text'],['company','Company name','text'],['address','Address','text'],['email','Email','email'],['phone','Contact number','tel']];
function meDraw(){
  $('me-fields').innerHTML=ME_FIELDS.map(function(f){
    return '<div class="f" data-k="'+f[0]+'"><label class="k" for="me-'+f[0]+'">'+f[1]+'</label>'
      +'<div class="v'+(ME[f[0]]?'':' none')+'">'+esc(dash(ME[f[0]]))+'</div>'
      +'<div class="in"><input id="me-'+f[0]+'" type="'+f[2]+'" autocomplete="off"><div class="err"></div></div></div>';
  }).join('');
  const nm=(ME.first+' '+ME.last).trim(), ini=(ME.first||ME.email||'?').charAt(0).toUpperCase();
  $('me-nm').textContent=nm; $('me-big').textContent=ini; $('me-ro').textContent=LEVELS[LEVEL];
  $('acct-nm').textContent=nm; $('acct-em').textContent=ME.email; $('acctbtn').textContent=ini;
}
window.startEdit=function(){
  ME_FIELDS.forEach(function(f){ $('me-'+f[0]).value=ME[f[0]]||''; });
  $('p-profile').classList.add('editing'); $('me-first').focus();
};
window.cancelEdit=function(){ $('p-profile').classList.remove('editing'); meErrs({}); };
function meErrs(errs){
  ME_FIELDS.forEach(function(f){
    const c=document.querySelector('#me-fields .f[data-k="'+f[0]+'"]');
    c.classList.toggle('bad',!!errs[f[0]]); c.querySelector('.err').textContent=errs[f[0]]||'';
  });
}
window.saveProfile=function(e){
  e.preventDefault();
  const v={}; ME_FIELDS.forEach(function(f){ v[f[0]]=$('me-'+f[0]).value.trim(); });
  const errs={};
  if(!v.first) errs.first='A first name is required.';
  if(!v.last) errs.last='A last name is required.';
  if(!v.email) errs.email='An email address is required — it is how you sign in.';
  else if(!EMAIL.test(v.email)) errs.email='That does not look like an email address.';
  if(v.phone && v.phone.replace(/\D/g,'').length<7) errs.phone='That does not look like a phone number.';
  meErrs(errs);
  const bad=Object.keys(errs)[0]; if(bad){ $('me-'+bad).focus(); return false; }
  v.email=v.email.toLowerCase();
  Object.assign(ME,v); writeSeat(); meDraw(); $('p-profile').classList.remove('editing'); T('Profile updated');
  return false;
};
window.pwOpen=function(){
  fOpen({title:'Change password',go:'Change password',fields:[
    {k:'cur',label:'Current password',type:'password',span:1},
    {k:'nw',label:'New password',type:'password',span:1,hint:'At least 8 characters.'},
    {k:'again',label:'New password again',type:'password',span:1}],
    check:function(v){
      if(v.nw.length<8) return ['nw','At least 8 characters.'];
      if(v.nw===v.cur) return ['nw','Choose a password you are not using now.'];
      if(v.again!==v.nw) return ['again','The two new passwords do not match.'];
      return null;
    },
    save:()=>'Password changed'});
};
DRAW.profile=function(){};

meDraw();
$('cu-add').hidden=!CAN.addCustomer;
$('op-add').hidden=!CAN.manageUsers;
$('ro-add').hidden=!CAN.manageRoles;
$('g-ops').hidden=!CAN.account;
$('g-cat').hidden=!CAN.catalogue;
$('editbtn').hidden=!CAN.editProfile;
$('acct-lv').textContent=LEVELS[LEVEL];
show(location.hash.slice(1)||'profile',false);
arrived=true;
</script>
