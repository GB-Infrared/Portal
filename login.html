const STARS=(function(){
  const raw=atob(STAR_B64), out=[];
  for(let i=0;i+5<raw.length;i+=6){
    const ra =((raw.charCodeAt(i)<<8   | raw.charCodeAt(i+1))/65535)*360;
    const dec=((raw.charCodeAt(i+2)<<8 | raw.charCodeAt(i+3))/65535)*180-90;
    const mag=(raw.charCodeAt(i+4)/255)*9-2;
    const ci =(raw.charCodeAt(i+5)/255)*3-0.5;
    /* magnitude is a logarithmic scale running BACKWARDS - each step is 2.512x
       the flux, and brighter is smaller. Compressed hard for the screen, or
       Sirius would be a dinner plate next to a field of invisible sixes. */
    const f=Math.pow(2.512,(6.5-mag)/2.6)/Math.pow(2.512,8/2.6);
    out.push({ lng:((ra-GMST0)%360+540)%360-180, lat:dec, mag:mag,
               r:0.30+Math.pow(f,0.55)*2.60,
               a:0.10+Math.pow(f,0.62)*0.90,
               cb:ciBin(ci), ph:(i*0.7548)%6.283 });
  }
  return out;
})();

/* Batched by colour and brightness. 8,920 stars is nothing to draw and a great
   deal to RESTYLE: a fillStyle per star is half a million context writes a
   second, which is where a starfield of this size would otherwise go to die.
   Seven colours by five brightnesses is at most thirty-five style changes a
   frame, and every star in a bin joins one path. */
const ABIN=5;
const STAR_BATCH=(function(){
  const b={};
  STARS.forEach(function(s){
    const ai=Math.max(0,Math.min(ABIN-1,Math.round((s.a-0.26)/0.74*(ABIN-1))));
    const k=s.cb*ABIN+ai;
    if(!b[k]){
      const c=CBIN[s.cb];
      b[k]={ rgb:c, lvl:(ai+1)/ABIN, list:[] };
    }
    b[k].list.push(s);
  });
  return Object.keys(b).map(function(k){ return b[k]; });
})();
/* the few dozen that carry the constellations get drawn one at a time, with a
   halo - these are the stars a person can actually name */
const STAR_BRIGHT=STARS.filter(function(s){ return s.mag<2.6; });

/* ---- the camera ----
   Fixed, and it does not drift. The overview's sky turns because the reader
   turns the globe under it; nothing here is being turned, so a sky that moved
   on its own would be this screen claiming a gesture that is not happening.

   It is also what makes the field free: a static sky is painted ONCE, into the
   buffer below, and every frame after that is one blit. */
const LAM=18, PHI=16;
let W=0, H=0, CX=0, CY=0, SKYK=540, dpr=1;
const cosP=Math.cos(PHI*D2R), sinP=Math.sin(PHI*D2R);

function skyXY(lng,lat){
  const la=lat*D2R, dl=(lng-LAM)*D2R;
  const cl=Math.cos(la), sl=Math.sin(la), cd=Math.cos(dl);
  const x=cl*Math.sin(dl),
        y=cosP*sl - sinP*cl*cd,
        z=sinP*sl + cosP*cl*cd;
  /* beta measured from the point directly behind the reader */
  const b=Math.acos(Math.max(-1,Math.min(1,-z)));
  if(b>1.62) return null;               /* round behind us: dropped, not folded */
  const t=Math.hypot(x,y);
  if(t<1e-6) return [CX,CY];
  const r=SKYK*b;
  return [CX + (x/t)*r, CY - (y/t)*r];
}

/* THE FIELD IS A BUFFER. Eight thousand nine hundred stars is nothing to draw
   once and a great deal to draw again: at sixty frames a second it is half a
   million projections and as many arcs, burned every second on a page whose
   real job is a text field and whose sky is not moving. So the faint field is
   painted into an offscreen canvas whenever the window changes size, and never
   again - each frame blits it and then draws only the few dozen named stars,
   which are the only things on this screen that actually change. */
const buf=document.createElement('canvas');
const bx=buf.getContext('2d');

function size(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth; H=innerHeight;
  sky.width=Math.round(W*dpr); sky.height=Math.round(H*dpr);
  sky.style.width=W+'px'; sky.style.height=H+'px';
  ox.setTransform(dpr,0,0,dpr,0,0);
  buf.width=sky.width; buf.height=sky.height;
  if(bx) bx.setTransform(dpr,0,0,dpr,0,0);
  CX=W/2; CY=H/2;
  /* ninety degrees off the axis lands at the corner of the frame */
  SKYK=Math.hypot(W/2,H/2)/(Math.PI/2);
  paintField();
}

/* the faint field, batched by colour and brightness: a fillStyle per star would
   be half a million context writes, and every star in a bin joins one path */
function paintField(){
  if(!bx) return;
  bx.clearRect(0,0,W,H);
  STAR_BATCH.forEach(function(bk){
    const c=bk.rgb;
    bx.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(bk.lvl*0.92).toFixed(3)+')';
    bx.beginPath();
    const L=bk.list;
    for(let i=0;i<L.length;i++){
      const p=skyXY(L[i].lng,L[i].lat);
      if(!p) continue;
      bx.moveTo(p[0]+L[i].r,p[1]);
      bx.arc(p[0],p[1],L[i].r,0,6.283185);
    }
    bx.fill();
  });
}
addEventListener('resize',size);
size();

function draw(now){
  ox.clearRect(0,0,W,H);
  const tw = reduced ? 0 : now/1000;
  ox.drawImage(buf,0,0,W,H);
  /* and the few dozen a person can actually name, with the bloom a bright
     point actually has */
  STAR_BRIGHT.forEach(function(st){
    const p=skyXY(st.lng,st.lat);
    if(!p) return;
    const c=CBIN[st.cb];
    const fl=reduced?1:(0.80+0.20*Math.sin(tw*1.5+st.ph));
    const g=ox.createRadialGradient(p[0],p[1],0,p[0],p[1],st.r*4.6);
    g.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.50*fl).toFixed(3)+')');
    g.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
    ox.fillStyle=g;
    ox.beginPath(); ox.arc(p[0],p[1],st.r*4.6,0,6.283185); ox.fill();
  });
}

let last=0;
function frame(now){
  /* twenty a second, and only while the tab is actually being looked at. The
     one thing moving is a slow sine on fifty points; sixty frames a second of
     that is a laptop fan spun up to animate something nobody can see move. */
  if(!document.hidden && now-last>50){ last=now; draw(now); }
  requestAnimationFrame(frame);
}
if(reduced) draw(0); else requestAnimationFrame(frame);
})();
