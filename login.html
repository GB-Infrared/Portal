<!doctype html>
<!-- THE FRONT DOOR IS THE VOID, and it has no light.

     THIS NOTE SAID THE OPPOSITE UNTIL NOW, which is worse than saying nothing.
     It read "THE FRONT DOOR IS LIGHT NOW, and it has no dark", written when the
     page had been cut back to the portal's light palette because the site
     overview was briefly a daylit screen. The overview went back to being a
     night sky, this page followed it, and the note did not - so the first thing
     anybody read about this file was contradicted sixty lines further down by
     the second :root block, which overrides every token to the void's values.
     See THE VOID below; that block is the one that is true.

     The portal behind this door now opens DARK by default as well, so the
     arrival is one room the whole way through: sign-in, globe, portal. Light is
     still there, and it is what the switch in the portal header is for - but it
     is a choice somebody makes, not the state they land in. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENEROPS OS · Sign in</title>
<link rel="icon" href="logo/favicon.png">
<style>

:root{
  /* ---- LIGHT · UTILITY BLUE (default) · enterprise solar-portal palette ---- */
  --bg:#f1f4f8;            /* page background            */
  --panel:#ffffff;         /* card surface               */
  --panel-2:#f5f8fb;       /* nested surface / inputs    */
  --line:#dde4ec;          /* card borders               */
  --line-soft:#e9eef4;     /* gridlines, dividers        */
  --line-hi:#b5c2d1;       /* hover / active borders     */
  --text:#152234;          /* primary text               */
  --muted:#5a6b7f;         /* secondary text             */
  --faint:#8494a6;         /* tertiary text              */
  --dim:#aab6c4;           /* dead readouts (offline)    */
  --elev:#ffffff;          /* tooltips, toasts           */
  --sel:#e8f0fb;           /* selected card surface      */
  --hover:rgba(11,99,206,.07);
  --hover-soft:rgba(11,99,206,.045);
  /* the row under the pointer, and only that row */
  --row-hover:rgba(11,99,206,.10);
  --shadow:rgba(19,38,63,.16);
  --on-accent:#ffffff;     /* text on a filled accent    */
  /* header bar — same surface family as the cards */
  --topbar:var(--panel);
  --topbar-fg:var(--text);
  --topbar-fg-2:var(--muted);
  --topbar-tab:var(--muted);
  --topbar-hover:var(--hover);
  --topbar-active:var(--green-soft);
  --green:#12a150;         /* producing / healthy        */
  --green-rgb:18,161,80;   /* same green, for rgba() glows */
  --green-soft:rgba(18,161,80,.12);
  --green-deep:#0b7a3c;
  --blue:#1a73c8;
  --blue-soft:rgba(26,115,200,.12);
  --red:#d92d20;           /* offline / alarms           */
  --red-soft:rgba(217,45,32,.1);
  --amber:#dc7a06;         /* yield / deviations         */
  --amber-soft:rgba(220,122,6,.12);
  --brand:#a87b0f;         /* wordmark · gold            */
  --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,'Helvetica Neue',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --r-lg:14px; --r-md:10px; --r-sm:8px;
}
/* ============================ THE VOID ============================
   The front door stands in the same room the site overview does. That was
   always the intent - "same void, same stars, same aurora, same corner
   brackets", in the overview's own words - and for a while this page was a
   white one instead, which made signing in and arriving two different rooms
   with a door between them.

   NOT ONE RULE BELOW THIS BLOCK CHANGED. The portal's light tokens are kept
   exactly where they were and this overrides the VALUES, so every rule on the
   page - the boot log, the fields, the eye, the refusal line - goes dark by
   reading the same token names it always read. A page re-skinned by rewriting
   two hundred declarations is a page with two hundred chances to miss one.

   The colours mean here what they mean on the overview: WHITE a fixed fact,
   EMERALD live, GOLD what has been banked. ---------------------------- */
:root{
  --bg:#070c14;            /* the void itself            */
  --panel:rgba(9,16,28,.74);   /* the same glass the overview stands on */
  --panel-2:rgba(9,16,28,.62);
  --line:rgba(150,180,220,.16);
  --line-soft:rgba(150,180,220,.10);
  --line-hi:rgba(140,175,215,.30);
  --text:#e9f1fb;          /* white  - fixed facts, identity */
  --muted:#8ba0bb;
  --faint:#7d92ad;
  --dim:#5d6e83;           /* dead readouts, and they read dead on black */
  --elev:rgba(9,16,28,.88);
  --shadow:rgba(0,0,0,.62);
  --green:#3ad998;         /* emerald - live */
  --green-rgb:58,217,152;
  --green-soft:rgba(58,217,152,.12);
  --green-deep:#3ad998;
  --blue:#7fb2ee;
  --red:#ff6b5e;
  --amber:#f0b74a;
  --brand:#f0b74a;         /* gold - the wordmark, and what the day earns */
}
/* ---- DARK · same hues on navy. Only the base tokens are redefined; the
   header/brand tokens above reference them, so they follow automatically. ---- */
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:var(--line-hi) transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;
     -webkit-font-smoothing:antialiased}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line-hi);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

/* =====================================================================
   SIGN IN — Fleet Control's login, in this portal's colours.

   Fleet Control boots before it asks anything: a black field, a log typing
   itself out a line at a time, and only then OPERATOR / PASSKEY /
   AUTHENTICATE in letterspaced monospace. That is the screen, and this is the
   same screen — the earlier split-panel version was a conventional marketing
   login wearing a few of its parts.

   What is NOT copied is the palette. Fleet Control's --signal #6adcb6 and
   --solar #eec888 become this portal's green and gold, so the two read as one
   product family rather than one repainted as the other. Its type stack
   (Michroma / JetBrains Mono, from Google Fonts) becomes the portal's own
   --mono, because these mockups open straight off disk and have never needed
   a network.

   Every colour below is a TOKEN, and the tokens are now the portal's LIGHT
   ones. The void, the stars and the aurora have gone with the dark theme they
   belonged to - they were night, and the screen this door opens onto is a
   sunlit Earth. What is behind the panel instead is the same solar wash the
   site overview uses: warm from above, cool below. The front door and the app
   behind it still look like one product; the product simply moved into
   daylight.

   This used to be a second dark palette invented beside the portal's —
   near-black surfaces, cooler greys, and the LIGHT green #12a150 on the focus
   ring and the button, which was the one hue on the page that could not have
   come from the app it opens.

   The boot log is honest about what it is booting. Fleet Control counts up its
   broker uplink and its firmware vault; this counts up the three pages behind
   the sign-in. Not one line reports a plant: no site has been asked about yet,
   and a front door that opened with a megawatt figure would be inventing the
   very thing the portal exists to measure.
   ===================================================================== */
html,body{height:100%}
/* ---------- the field ----------
   The overview's own background, brought over unchanged in shape: a warm wash
   where the sun is, a wide cold one carrying the rest of the sky, and the deep
   field under both. There it is driven every frame by the subsolar point the
   terminator is drawn from. Here it is held at one hour of the day, by the
   three custom properties below - and the LIMB drawn across the foot of the
   screen is lit from the same --sun-x, so the wash overhead and the horizon
   under it are lit by one sun rather than by two that happen to agree.

   Note there is only one body background rule on this page, and this is it.
   There were briefly two, and the second silently won; a page with two
   backgrounds has one background and one piece of dead code. */
:root{ --sun-x:78%; --sun-y:10%; --day:.62 }
body{background:
    radial-gradient(circle 38vmax at var(--sun-x) var(--sun-y),
      rgba(255,216,146,calc(.26*var(--day))) 0%,
      rgba(240,178,73,calc(.09*var(--day))) 30%, transparent 62%),
    radial-gradient(ellipse 150% 130% at var(--sun-x) var(--sun-y),
      rgba(126,158,214,calc(.30*var(--day))) 0%,
      rgba(90,120,180,calc(.14*var(--day))) 45%, transparent 78%),
    radial-gradient(ellipse 120% 96% at 50% 48%,
      rgba(4,10,24,calc(.92*(1 - var(--day)))) 0%,
      rgba(0,1,5,calc(1 - var(--day))) 100%),
    #070c14;
  color:var(--muted);font-family:var(--mono);overflow:hidden}

/* ---------- and the stars are the real ones ----------
   The same 8,920 stars out of the HYG catalogue the overview draws, placed by
   right ascension and declination against sidereal time and coloured from their
   B-V index - so the constellations over this screen are the ones that are
   actually overhead, and they are the ones still overhead on the next screen.

   What is NOT brought over is the lensing. There, every star is bent around the
   planet it is being seen past; here there is no planet, so they stand where
   they stand. */
#sky{position:fixed;inset:0;z-index:0;display:block;pointer-events:none}

/* ---------- and the ground the fleet is on ----------
   THE FRONT DOOR OPENS INTO THE SAME ROOM IT LEADS TO. Signing in used to be a
   form on an empty star field, and the screen it handed you to was a sunlit
   Earth seen from orbit - so the door and the room behind it were lit by
   different suns, and arriving felt like changing buildings rather than walking
   through.

   This is that Earth, from further out and one moment earlier: the limb across
   the foot of the screen, its atmosphere catching the same light the wash
   overhead is coming from, the terminator running off to the left into night.
   It is a HORIZON, not a globe - nothing on it is a site, nothing on it can be
   clicked, and no figure is printed over it. The globe with the fleet on it is
   what you get once you are through the door; this is the edge of it, from the
   step outside.

   Its own layer, above the stars because a planet occludes what is behind it,
   and below the vignette and the grain because those close down the whole
   frame - the picture included. */
#limb{position:fixed;inset:0;z-index:1;display:block;pointer-events:none}

/* ---------- ambient ----------
   Both of these were re-tuned for a white page and are back over black, which
   is what they were drawn for: the vignette closes the corners down into the
   void instead of warming them, and the ruling is light ink again. A dark
   scanline on a dark field is not subtle, it is absent. */
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%, transparent 54%, rgba(0,2,8,.72) 100%)}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.035;
  background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(150,180,220,.9) 2px 3px)}

/* framing marks: they say "instrument" in two strokes and cost nothing */
.corner{position:fixed;width:26px;height:26px;z-index:3;pointer-events:none}
.corner.tl{top:16px;left:16px;border-top:1px solid rgba(var(--green-rgb),.42);border-left:1px solid rgba(var(--green-rgb),.42)}
.corner.br{bottom:16px;right:16px;border-bottom:1px solid rgba(var(--green-rgb),.42);border-right:1px solid rgba(var(--green-rgb),.42)}

/* ---------- boot ---------- */
/* the panel is lifted off dead centre, because the bottom of the frame is not
   empty any more - the limb is there, and a card sitting on the horizon reads
   as resting on it. The bottom padding is a floor, so a short window closes the
   gap rather than pushing the sign-in off the top. */
#boot{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:24px 24px max(24px,13vh)}
/* ---------- ONE PANEL, AND IT IS THE OVERVIEW'S OWN ----------
   The sign-in used to stand bare on the field: type on a background, with
   nothing bounding it. That is why it read as plain - not because anything was
   missing from it, but because nothing on the screen said where it ENDED. The
   overview solves the same problem with one material: glass, a hairline, a deep
   shadow, and everything that belongs together standing on one sheet of it. So
   this is that sheet, with the same blur, the same border and the same corner
   radius the rail and the site card use forty pages away. Brand, form and boot
   log are one object now, on one surface, in front of one picture. */
.stack{display:flex;flex-direction:column;
  padding:24px 30px 26px;border-radius:16px;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 34px 92px rgba(0,0,0,.66);
  -webkit-backdrop-filter:blur(18px) saturate(120%);
  backdrop-filter:blur(18px) saturate(120%)}

/* ---------- THE MARK IS BACK, AND IT IS SMALL ----------
   It was taken off this screen with the argument that the brand is on every
   page behind the door, so the door need not say it twice. That argument was
   right about the BANNER it removed - a wordmark in 17px letterspaced gold over
   a rule, pushing the sign-in into the lower half of the screen - and wrong
   about the mark itself. A sign-in box floating on a photograph of Earth with
   no name on it is not restrained, it is unidentified: it is the one screen a
   person reaches before they have any other way of knowing what they are
   signing into.

   So it returns at the size it has in the portal's own header - the same mark,
   the same serif wordmark, the same letterspaced caption under it - and it
   heads the panel rather than the screen. It names the box. It does not
   announce the product. */
.brand{display:flex;align-items:center;gap:12px;
  padding-bottom:18px;border-bottom:1px solid var(--line-soft)}
.brand img{height:32px;width:auto;display:block;flex:none}
.brand .word{display:block;font-family:var(--serif);font-weight:700;font-size:17px;
  color:var(--brand);letter-spacing:.2px;line-height:1.05}
.brand .sub{display:block;margin-top:4px;font-size:9px;letter-spacing:.28em;
  color:var(--faint);text-transform:uppercase}
/* the log is a footnote to the form now, so it steps back: quieter type, and
   separated by a rule rather than by the weight it used to carry */
.stack #bootlog{margin-top:18px;padding-top:18px;border-top:1px solid var(--line-soft)}
/* the log sets the scale for the whole screen — the box below is sized off it,
   so these two numbers are the only ones to touch to make the page read bigger */
/* THE LOG'S HEIGHT IS RESERVED, not discovered. Inside a bordered panel a log
   that types itself out one line at a time is a border that jumps four times on
   arrival - the boot theatre paid for in the one thing on the screen that
   should be still. Four lines of room are set aside from the first frame and
   the lines land into it. */
#bootlog{font-family:var(--mono);font-size:13.5px;line-height:1.9;color:var(--faint);
  min-width:520px;min-height:calc(4 * 1.9em);white-space:pre;margin:0}
#bootlog .bt{color:var(--brand);letter-spacing:.34em;font-size:17.5px;font-weight:700}
#bootlog .sub{color:var(--faint);letter-spacing:.16em}
#bootlog .rule{color:var(--line)}
#bootlog b{color:var(--green);font-weight:500}
#bootlog .warm{color:var(--brand)}
@media (max-width:620px){ #bootlog{min-width:0;font-size:12.5px;white-space:pre-wrap} }

/* =====================================================================
   OPENING — what the panel becomes once the operator is through.

   THIS REPLACED TWO MORE LINES OF LOG. Granting access used to type '[ auth ]
   access granted' and '> SELECT A SITE' into the boot log and then navigate.
   Both were the machine narrating: the first restated what pressing
   AUTHENTICATE had just done, and the second announced a screen that was about
   to arrive anyway. Neither said the one thing a reader wants in that gap —
   how long this is going to take.

   So the log stops and a LOADING STATE takes the panel. It keeps the terminal's
   voice, because the screen has not changed character; what changes is that it
   is now reporting progress rather than history. The operator address stays on
   screen — it is the fact that was just established, and it is the one thing
   worth confirming before the portal opens.

   THE PANEL DOES NOT RESIZE. The log reserved four lines of room from the first
   frame so the border would not jump while it typed; this stands in the same
   space for the same reason. Signing in should not make the box breathe. */
.load{min-width:520px;min-height:calc(4 * 1.9em);font-family:var(--mono);
  display:flex;flex-direction:column;justify-content:center;gap:11px;
  margin-top:18px;padding-top:18px;border-top:1px solid var(--line-soft)}
/* A CLASS THAT SETS display BEATS THE hidden ATTRIBUTE. `hidden` is only a UA
   rule - [hidden]{display:none} - so `display:flex` above outranks it and the
   panel stood on screen from the first frame, under the boot log, showing a
   dash and the word CONNECTING before anybody had signed in. Anything given a
   display here has to say what hidden means for it. */
.load[hidden]{display:none}
.load .lop{font-size:12.5px;letter-spacing:.14em;color:var(--green)}

/* ===================== THE LEDGER =====================
   WHAT REPLACED THE SINGLE WORD, AND WHY.

   The loading state said one word at a time - CONNECTING, then LOADING SITES,
   and so on - beside a count and a bar. It answered "how far" and nothing else.
   It could not say what had already finished, what was still to come, or what
   any of it had produced, and a word that is replaced leaves no trace: by the
   time the portal opened, the reader had watched four things happen and could
   name none of them.

   So all four steps are on screen at once, from the first frame, in the boot
   log's own grammar - a timestamp, a lowercase subsystem name, leader dots, and
   the outcome in the right-hand column. The log above types four lines bringing
   the pages up; this types four more bringing the session up. One machine, one
   voice, one column of outcomes to run an eye down.

   THE TIMES ARE MEASURED, not written down. Each row prints the elapsed time
   its own step actually took, off the same clock the bar is drawn from. A boot
   log with invented timings is set dressing; these are the real numbers, which
   is also why they are not round.

   THE PANEL STILL DOES NOT BREATHE. Every row exists before the first step
   begins - pending ones are dim and blank - so the box is its final height from
   the frame it appears in, and nothing below it moves as the run goes on. That
   was the rule the single-word version was keeping; a ledger keeps it by
   reserving its rows rather than by having only one. */
.load .lsteps{display:flex;flex-direction:column;gap:1px;font-size:12.5px;line-height:1.62}
.load .lstep{display:flex;align-items:baseline;gap:9px;min-width:0}
/* the clock column is fixed-width and tabular, so four timings form a column
   rather than four numbers that happen to be near each other */
.load .lstep .lt{flex:none;width:8.5ch;color:var(--faint);
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.load .lstep .ln{flex:none;color:var(--muted);letter-spacing:.02em}
/* THE LEADER IS A BORDER, NOT A RUN OF FULL STOPS. The boot log's dots are
   baked into fixed strings, which is fine for a line that never changes width;
   these rows carry names and outcomes of different lengths and have to reflow,
   and a string of dots cannot. Same reading, one declaration. */
.load .lstep .ld{flex:1 1 auto;min-width:14px;align-self:stretch;
  border-bottom:1px dotted var(--line-hi);opacity:.5;margin-bottom:.34em}
.load .lstep .lv{flex:none;color:var(--green);font-weight:500;letter-spacing:.06em}

/* WAITING: dim, and genuinely blank. A pending step that showed a dash or a
   zero would be reporting a result it does not have. */
.load .lstep.wait .ln{color:var(--dim)}
.load .lstep.wait .ld{opacity:.22}
/* RUNNING: the one row in the brand colour, with a block cursor where its
   outcome will be printed - the terminal's own way of saying "this line is
   still being written". */
.load .lstep.run .ln{color:var(--brand)}
.load .lstep.run .lt{color:var(--brand);opacity:.75}
.load .lstep.run .lv{color:var(--brand)}
.load .lstep.run .lv::after{content:'\258C';animation:cur 1s steps(1) infinite}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
/* DONE: the name settles back to the reading colour and the outcome is the only
   thing carrying weight, which is what makes the right-hand column scannable */
.load .lstep.done .lt{color:var(--faint)}

/* SLOW: still running, but past the time it should have taken.

   THIS IS THE STATE EVERY LOADING SCREEN IS MISSING. A bar that stops moving
   and a bar that is about to move again look identical, so the reader is left
   deciding for themselves whether the thing is broken - and the usual answer,
   after four or five seconds of a frozen stripe, is to reload and start over.
   A row that says SLOW has answered it: the step is still running, it is late,
   and nothing has failed yet. The clock beside it keeps counting, which is the
   proof.

   It is amber and not red, because amber on this portal means deviation and red
   means fault, and late is a deviation. */
.load .lstep.slow .ln{color:var(--amber)}
.load .lstep.slow .lt{color:var(--amber);opacity:1}
.load .lstep.slow .lv{color:var(--amber);letter-spacing:.1em}

/* FAILED: the run stopped here, and this row is why.

   The whole argument for naming the steps was that a named step tells you WHICH
   one hung. That was a promise the panel could not keep - there was no failure
   state, so a step that died would have left the bar sitting at 48% saying
   nothing at all. The reason is printed in the outcome column, in the place
   every other row prints its result, so the eye finds it where it already knows
   to look.

   The rows below stay dim and BLANK. They were not attempted, and a dash or a
   zero would be reporting a result they do not have. */
.load .lstep.fail .ln{color:var(--red)}
.load .lstep.fail .lt{color:var(--red);opacity:.85}
.load .lstep.fail .lv{color:var(--red);letter-spacing:.08em}

/* ---------- the bar and the count, on one line ----------
   They are one readout - the count is the bar's value in figures - so they sit
   on one row rather than stacked, and the row is the last thing in the panel
   because it is the summary of the four lines above it. */
.load .lfoot{display:flex;align-items:center;gap:14px;margin-top:3px}
.load .lbar{position:relative;flex:1 1 auto;height:6px;border-radius:6px;
  background:var(--line-soft);overflow:hidden}
/* Determinate, not a barber's pole. An indeterminate stripe says "something is
   happening" and nothing else; this is a short, known sequence of steps, so the
   bar can say how much of it is left - which is the only question being asked. */
/* NO CSS TRANSITION ON THE FILL. It used to travel .3s into each new width
   while the number beside it counted on its own clock, and two readouts of the
   same fact drifting apart is worse than either alone - the eye goes straight
   to the disagreement. Both are driven off ONE animation frame loop (see
   openPortal), so the fill IS the number, drawn wide instead of in figures. */
.load .lbar i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,var(--brand),var(--green))}
/* a stopped bar is not a paused bar. The fill holds the width it reached and
   goes red, so the distance travelled is still readable - it says where it got
   to, which is the same thing the failed row says in words. */
.load .lbar.bad i{background:var(--red)}
/* THE STEP BOUNDARIES ARE NOTCHED INTO THE BAR, at the percentages the steps
   actually end on. It was a plain rule, and a plain rule hides the shape of the
   work: the four steps are not equal - connecting is quick and loading the
   sites is the long one - and the bar was drawing them as one smooth run.
   Notched, the reader can see a stage close as the fill crosses it, and can see
   before it starts that the second stage is twice the first.

   Cut in the PAGE's colour rather than drawn in a line colour, so the notch
   reads as a gap in the bar rather than as a fifth thing on it. */
.load .lbar u{position:absolute;top:-1px;bottom:-1px;width:2px;
  background:var(--panel);transform:translateX(-1px)}
/* THE PERCENTAGE, AND IT IS THE LARGEST THING IN THE PANEL. The bar alone was
   the whole answer once, and a 6px rule is a poor way to state a number:
   reading it means estimating a fraction of a width, so "roughly two thirds" is
   the most it can ever say. The count says 67.

   TABULAR FIGURES, AND THE DIGITS RESERVE THEIR WIDTH. A proportional 1 is
   about half the width of a 0, so a counter climbing 8, 9, 10 shifts what is
   beside it on almost every frame - the jitter is more visible than the count
   itself. tabular-nums makes every digit the same width, and the 3ch box holds
   the room the third digit will need from the first frame, so the % never
   moves. */
.load .lpct{flex:none;display:flex;align-items:baseline;gap:2px;color:var(--text)}
.load .lpct b{display:inline-block;min-width:3ch;text-align:right;
  font-size:24px;font-weight:700;line-height:1;letter-spacing:.01em;
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.load .lpct i{font-style:normal;font-size:12.5px;font-weight:600;
  letter-spacing:.1em;color:var(--faint)}
.load .lpct.bad b{color:var(--red)}
/* RETRY, and it appears only when there is something to retry. It borrows the
   AUTHENTICATE button's shape and takes the fault colour, because it is the
   answer to the red row above it and not a second way to sign in. */
.load .lgo.retry{padding:7px 14px;font-size:11.5px;letter-spacing:.18em;flex:none;
  background:rgba(217,45,32,.10);border-color:var(--red);color:var(--red)}
.load .lgo.retry:hover:not(:disabled){background:rgba(217,45,32,.18);
  box-shadow:0 0 20px rgba(217,45,32,.20)}
/* the live region carries the step name for a screen reader. It is not
   displayed, because the ledger says the same thing to everybody else - but it
   cannot be display:none, or the announcement goes with it. */
.load .vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (max-width:620px){
  .load{min-width:0}
  .load .lpct b{font-size:20px}
  .load .lsteps{font-size:11.5px}
  .load .lstep .lt{width:8ch}
}
@media (prefers-reduced-motion:reduce){ .load .lstep.run .lv::after{animation:none} }

.skip{position:fixed;bottom:26px;left:0;right:0;text-align:center;z-index:11;
  font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--dim)}

/* ---------- the login box ----------
   Fleet Control's exact shape: a label column at a fixed width, the field
   beside it, and the action under both — aligned to the FIELDS, not to the
   labels, so the button sits where the answers are rather than where the
   questions were. */
.lbox{display:none;margin-top:26px}
.lbox.on{display:block}
/* ---------- THE FORM ARRIVES THE WAY THE LOG DID ----------
   The boot lines come in one at a time, on a fixed beat: monitoring, alarms,
   analysis, kpi, awaiting operator. The form used to ignore all of that and
   fade in as a single block the moment the log finished, so the page booted in
   two different rhythms, one after the other - a machine counting itself up,
   and then a card appearing.

   It is one rhythm now. The log counts up the pages and the sign-in carries
   straight on from it on the same beat: operator, passkey, and last of all the
   button - so the final thing to land is the thing you press. Nothing new is
   being said. The same arrival is finally told in one voice. */
.lbox .step{opacity:0;transform:translateY(7px);
  transition:opacity .34s ease-out,transform .34s cubic-bezier(.2,.7,.3,1)}
.lbox .step.in{opacity:1;transform:none}
.lrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lrow label{font-size:11.5px;letter-spacing:.28em;color:var(--faint);width:130px;flex:none;text-transform:uppercase}
/* THE FIELD TAKES THE ROOM THE PANEL HAS. It was a fixed 305px, which was the
   right width on a bare field and the wrong one inside a box: the panel is as
   wide as the boot log under it, so a fixed field left a column of nothing down
   the right of every row and made the form look like it had been dropped into
   somebody else's container. It stretches now, and the log sets the width. */
.lfield{position:relative;display:flex;flex:1 1 auto;min-width:0}
.lbox input{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--text);
  font-family:var(--mono);font-size:14.5px;padding:10px 13px;width:100%;outline:none;letter-spacing:.08em;
  transition:border-color .2s,box-shadow .2s}
.lbox input::placeholder{color:var(--dim);letter-spacing:.04em}
.lbox input:focus{border-color:var(--green);box-shadow:0 0 14px rgba(var(--green-rgb),.20)}
.lbox input.bad{border-color:var(--red);box-shadow:0 0 14px rgba(255,107,107,.18)}

/* ---------- one reveal, and it is the eye ----------
   Edge and IE draw their OWN eye inside every password field. It sat beside
   ours and gave the field two controls for one job — and the two do not share
   state, so the field could show plain text while our button still offered to
   show it. Theirs goes; ours is the eye. */
.lfield input::-ms-reveal,
.lfield input::-ms-clear{display:none;width:0;height:0}
.lfield.pw input{padding-right:40px}
/* the icon IS the control, so the label it cannot draw is carried in title and
   aria-label — and both name what the CLICK will do rather than what the field
   is doing, because a crossed-out eye is read both ways by different people */
.reveal{position:absolute;right:3px;top:50%;transform:translateY(-50%);
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:4px;border:none;background:transparent;color:var(--faint)}
.reveal:hover{color:var(--text)}
.reveal:focus-visible{outline:1px solid var(--green);outline-offset:1px}

.lact{display:flex;align-items:center;gap:14px;margin-left:142px;margin-top:15px;flex-wrap:wrap}
.lgo{background:rgba(var(--green-rgb),.10);border:1px solid var(--green);border-radius:6px;color:var(--green);
  font-family:var(--mono);font-size:12.5px;letter-spacing:.2em;padding:10px 20px;
  display:inline-flex;align-items:center;gap:8px;transition:box-shadow .25s,background-color .25s}
.lgo:hover:not(:disabled){background:rgba(var(--green-rgb),.18);box-shadow:0 0 20px rgba(var(--green-rgb),.22)}
.lgo:disabled{opacity:.5;cursor:default}
.lalt{background:none;border:none;color:var(--faint);font-family:var(--mono);font-size:11.5px;letter-spacing:.2em}
.lalt:hover{color:var(--blue)}
.spin{width:11px;height:11px;border-radius:50%;flex:none;
  border:1.6px solid rgba(var(--green-rgb),.28);border-top-color:var(--green);animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* the refusal and the warning share one slot under the fields — never a bubble
   over the field, which covers the thing it is complaining about */
.lerr{color:var(--red);font-size:12px;letter-spacing:.16em;margin-left:142px;margin-top:10px;
  min-height:16px;text-transform:uppercase}
/* Caps Lock is the commonest reason a correct passkey is refused, and the field
   cannot show it back to you to check. Warned while it is true and taken down
   the moment it is not — a warning that outlives its condition teaches people
   to ignore the next one. */
.lcaps{display:none;color:var(--amber);font-size:12px;letter-spacing:.16em;margin-left:142px;margin-top:7px}
.lcaps.on{display:block}
.lhint{color:var(--dim);font-size:11.5px;letter-spacing:.14em;margin-left:142px;margin-top:8px}

@media (prefers-reduced-motion:reduce){
  /* the sequence still HAPPENS - the script simply stops staggering it - so
     nothing here has to be re-ordered, only stripped of its motion */
  .lbox .step{opacity:1;transform:none;transition:none}
}
@media (max-width:620px){
  /* the limb is drawn shallower on a narrow window by the script; the panel
     simply stops being generous with its own edges */
  #boot{padding:18px 16px max(18px,9vh)}
  .stack{padding:18px 18px 20px;border-radius:13px;width:min(100%,360px)}
  .brand img{height:27px}
  .brand .word{font-size:15.5px}
  .lrow{flex-direction:column;align-items:flex-start;gap:5px}
  .lrow label{width:auto}
  .lfield{width:100%}
  .lact,.lerr,.lcaps,.lhint{margin-left:0}
  .lbox{width:min(100%,340px)}
}
</style>
</head>
<body>

<!-- the sky, behind everything, painted once per frame -->
<canvas id="sky" aria-hidden="true"></canvas>
<!-- and the Earth the fleet is on, across the foot of it. Painted once per
     resize and never again: nothing on it moves, and a horizon that redrew
     itself sixty times a second would be a fan spun up to animate a still. -->
<canvas id="limb" aria-hidden="true"></canvas>

<div class="vignette"></div>
<div class="grain"></div>
<div class="corner tl"></div>
<div class="corner br"></div>

<div id="boot">
  <!-- THE ORDER IS REVERSED. The boot log used to run down the top of the
       screen with the sign-in beneath it, which put a status report where the
       eye lands first and the only control on the page below it. Now the form
       is first and the log sits underneath, where it belongs: it is the
       reassurance that the thing you are signing into is up, and reassurance is
       read after the task, not before it.

       The log still types itself out on arrival and the form still appears when
       it finishes - the sequence in TIME is unchanged, only the arrangement in
       SPACE.

       WHAT HEADS THE COLUMN NOW is the mark, and it does not disturb that
       order: it is a NAME, not a step. Nothing is asked of it and nothing waits
       on it - it is up before the boot begins, and it is the same height as the
       one in the portal's own header, so the eye still lands on the operator
       field first. See the note on .brand for why it came back. -->
  <div class="stack">

    <div class="brand">
      <img src="logo/logo-mark.png" alt="EnerOps Data Systems Pvt Ltd">
      <span>
        <span class="word">ENEROPS OS</span>
        <span class="sub">Site Control</span>
      </span>
    </div>

    <!-- ---------- SIGN IN ---------- -->
    <div class="lbox" id="loginbox">
      <div class="lrow step">
        <label for="lu">Operator</label>
        <span class="lfield"><input id="lu" type="email" autocomplete="username"
              spellcheck="false" autocapitalize="off" placeholder="you@company.com"></span>
      </div>
      <div class="lrow step">
        <label for="lp">Passkey</label>
        <span class="lfield pw">
          <input id="lp" type="password" autocomplete="current-password" placeholder="••••••••">
          <button class="reveal" type="button" data-for="lp" title="Show passkey"
                  aria-label="Show passkey" aria-pressed="false"></button>
        </span>
      </div>
      <div class="lcaps" id="caps-lp">CAPS LOCK IS ON</div>
      <div class="lact step">
        <button class="lgo" id="lgo" type="button">AUTHENTICATE</button>
        <!-- No mailed link and no second page: you are already at a keyboard on
             the screen that refused you, so the reset is asked and answered
             here, in the same box. -->
        <button class="lalt" type="button" onclick="goStep('reset')">LOST PASSKEY?</button>
      </div>
      <div class="lerr" id="loginerr"></div>
    </div>

    <!-- ---------- RESET, IN THE SAME BOX ---------- -->
    <div class="lbox" id="resetbox">
      <div class="lrow step">
        <label for="ru">Operator</label>
        <span class="lfield"><input id="ru" type="email" autocomplete="username"
              spellcheck="false" autocapitalize="off" placeholder="you@company.com"></span>
      </div>
      <div class="lrow step">
        <label for="rp">New passkey</label>
        <span class="lfield pw">
          <input id="rp" type="password" autocomplete="new-password" placeholder="At least 8 characters">
          <button class="reveal" type="button" data-for="rp" title="Show passkey"
                  aria-label="Show passkey" aria-pressed="false"></button>
        </span>
      </div>
      <div class="lrow step">
        <label for="rp2">Confirm</label>
        <span class="lfield pw">
          <input id="rp2" type="password" autocomplete="new-password" placeholder="Type it again">
          <button class="reveal" type="button" data-for="rp2" title="Show passkey"
                  aria-label="Show passkey" aria-pressed="false"></button>
        </span>
      </div>
      <div class="lcaps" id="caps-rp">CAPS LOCK IS ON</div>
      <div class="lact step">
        <button class="lgo" id="rgo" type="button">SET PASSKEY</button>
        <button class="lalt" type="button" onclick="goStep('signin')">CANCEL</button>
      </div>
      <div class="lerr" id="reseterr"></div>
      <div class="lhint">MINIMUM 8 CHARACTERS</div>
    </div>

    <pre id="bootlog"></pre>

    <!-- ---------- OPENING ----------
         Hidden until the operator is through, and then it takes the log's
         place in the panel rather than appearing under it. See the note on
         .load for why the two lines of log that used to go here are gone. -->
    <div class="load" id="loading" hidden>
      <div class="lop" id="load-op">&mdash;</div>

      <!-- THE FOUR STEPS, all of them, from the first frame. Built by script
           rather than written out here because each row's timing, state and
           outcome are all filled in as the run goes, and a row that is half
           markup and half script is a row maintained in two places. -->
      <div class="lsteps" id="load-steps"></div>

      <!-- the footer holds the bar, the count, and - only when a run has
           stopped - the way out of it. RETRY is appended here rather than
           reserved, because a button that is present and disabled through every
           successful sign-in is a screen offering to fix something that is not
           broken. -->
      <div class="lfoot" id="load-foot">
        <div class="lbar" id="load-bar" role="progressbar" aria-labelledby="load-say"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="load-fill"></i></div>
        <div class="lpct" id="load-pct" aria-hidden="true"><b id="load-num">0</b><i>%</i></div>
      </div>

      <!-- THE ANNOUNCEMENT, and it is the step NAME rather than the count. The
           number moves every frame, and a live region on it would be a screen
           reader reading two seconds of digits aloud; the ledger and the bar
           say it to everyone else. -->
      <div class="vh" id="load-say" role="status" aria-live="polite">CONNECTING</div>
    </div>
  </div>
</div>

<div class="skip" id="skiphint"></div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= BOOT =================
   Fleet Control's format exactly — a banner, a rule, then timestamped lines
   counting up what came online. WHAT is counted differs, because what boots
   here differs: the three pages behind the sign-in, not a broker uplink and a
   firmware vault. Every line is a fact about this app starting; none of them
   is a reading from a plant. */
/* THE BANNER IS GONE, and so is the kernel line.

   The wordmark used to head this log, above a rule, above the boot lines. It
   was the product introducing itself to somebody who had just opened the
   product - and it pushed the thing they came here to do, which is sign in,
   into the lower half of the screen. The brand is on every screen behind this
   one; the front door does not have to say it twice.

   'kernel init' went with it. It was the one line here that was not about this
   application: a plant operator has no kernel, and a status line nobody can act
   on is set dressing pretending to be information. Every line left names a page
   they are about to be able to open.

   'analysis & kpi' has been split in two. They are separate pages behind the
   sign-in, they come up separately, and one line covering both was a shortcut
   in the writing that made the log slightly untrue. */
const BOOT=[
  ['',     '[ 0.214 ]  monitoring ...................... ', 'READY'],
  ['',     '[ 0.395 ]  alarms .......................... ', 'READY'],
  ['',     '[ 0.611 ]  analysis ........................ ', 'READY'],
  ['',     '[ 0.742 ]  kpi ............................. ', 'READY']
];
/* THE PROMPT IS GONE. The log used to end on '> AWAITING OPERATOR', which was
   the screen telling the reader it was waiting for them - while the sign-in
   form sat beside it, focused, with a cursor already in it. The form IS the
   ask; a line of type restating it is the machine narrating its own state
   rather than reporting anything. The log now ends on the last thing it
   actually did, which is what a boot log is. */

function render(a){
  const div=document.createElement('div');
  if(a[0]) div.className=a[0];
  /* the status word is the only part that is coloured, so the eye can run down
     the right-hand column and read the outcome without re-reading the label */
  div.appendChild(document.createTextNode(a[1]));
  if(a[2]){ const b=document.createElement('b'); b.textContent=a[2]; div.appendChild(b); }
  return div;
}
/* the pending step is HELD, because skip() has to be able to stop the run.
   Without this the chain kept appending into the log skip had just replaced,
   and the boot came out doubled on screen — a real bug, not a warning. */
let bootTimer=0;
function typeLines(lines, done){
  const log=$('bootlog'); let i=0;
  (function next(){
    if(i>=lines.length){ done && done(); return; }
    log.appendChild(render(lines[i++]));
    bootTimer=setTimeout(next, reduced ? 15 : (i<3 ? 300 : 165));
  })();
}

/* One row at a time, on the beat the log keeps - 165ms, the same interval
   typeLines settles into once its first few lines are down. */
const BEAT=165;
/* whole and at once, for a box that is not arriving as part of the boot */
function revealAll(box){
  box.querySelectorAll('.step').forEach(function(el){ el.classList.add('in'); });
}

/* ---------- THE FORM COMES FIRST, THEN THE LOG ----------
   The log used to type itself out and the sign-in appeared when it finished.
   That is the order a machine boots in, and it is the reverse of the order this
   screen is READ in: the form is at the top, it is the only thing anybody came
   here to do, and it was the last thing to arrive - so for the first second and
   a half the screen showed a status report to somebody who had not been offered
   the box yet.

   So the sign-in assembles itself first, row by row on the beat, and the log
   picks that beat up underneath it the moment the last row lands. What you came
   for is in front of you while the reassurance that the thing is up writes
   itself below. One rhythm, one arrival, and now in reading order. */
/* DONE means the whole arrival is over, not that the form is up. While the
   form led the boot those were the same moment; now the form is FIRST, and a
   flag set when it appears would disarm the skip key a second and a half before
   there was anything left to skip. */
let done=false;
function finish(){ done=true; $('skiphint').textContent=''; }

function showLogin(staggered){
  const box=$('loginbox');
  box.classList.add('on');
  /* focused immediately, not when the row lands: a reader who starts typing
     during the arrival must not lose the first characters they type */
  $('lu').focus();
  if(!staggered || reduced){
    revealAll(box);
    typeLines(BOOT, finish);
    return;
  }
  const steps=box.querySelectorAll('.step');
  steps.forEach(function(el,i){ setTimeout(function(){ el.classList.add('in'); }, 90+i*BEAT); });
  /* the log picks the beat up where the last row of the form put it down */
  bootTimer=setTimeout(function(){ typeLines(BOOT, finish); }, 90+steps.length*BEAT);
}
/* someone who has seen the boot once should not have to sit through it again */
function skip(){
  if(done) return;
  clearTimeout(bootTimer);            /* stop the run still in flight */
  const box=$('loginbox');
  box.classList.add('on');
  revealAll(box);
  const log=$('bootlog');
  log.textContent='';
  BOOT.forEach(function(a){ log.appendChild(render(a)); });
  finish();
  $('lu').focus();
}
$('skiphint').textContent = reduced ? '' : 'PRESS ANY KEY TO SKIP';
addEventListener('keydown', skip, {once:true});
showLogin(true);

/* ================= THE REVEAL =================
   One control per field, and it is the eye. The icon flips to the crossed-out
   eye once the passkey is showing, and title/aria-label always name the ACTION,
   so what the button does is never left to how a reader reads a glyph. */
const EYE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 12S5.8 5.4 12 5.4 21.8 12 21.8 12 18.2 18.6 12 18.6 2.2 12 2.2 12Z"/><circle cx="12" cy="12" r="3.1"/></svg>';
const EYE_OFF='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 5.7A9.6 9.6 0 0 1 12 5.4c6.2 0 9.8 6.6 9.8 6.6a17 17 0 0 1-2.9 3.8M6.2 7.5A17 17 0 0 0 2.2 12S5.8 18.6 12 18.6c1.5 0 2.8-.4 3.9-.9"/><path d="M10 10a2.9 2.9 0 0 0 4 4"/><path d="M3.2 3.2 20.8 20.8"/></svg>';

[].slice.call(document.querySelectorAll('.reveal')).forEach(function(b){
  b.innerHTML=EYE;
  b.addEventListener('click',function(){
    const i=$(b.dataset.for), hidden=i.type==='password';
    i.type=hidden?'text':'password';
    b.innerHTML=hidden?EYE_OFF:EYE;
    b.title=hidden?'Hide passkey':'Show passkey';
    b.setAttribute('aria-label',b.title);
    b.setAttribute('aria-pressed',hidden?'true':'false');
    i.focus();
  });
});

/* ================= CAPS LOCK ================= */
[['lp','caps-lp'],['rp','caps-rp']].forEach(function(pair){
  const i=$(pair[0]), flag=$(pair[1]);
  function caps(e){
    var on=false;
    try{ on=e.getModifierState&&e.getModifierState('CapsLock'); }catch(err){}
    flag.classList.toggle('on',!!on);
  }
  i.addEventListener('keydown',caps);
  i.addEventListener('keyup',caps);
  i.addEventListener('blur',function(){ flag.classList.remove('on'); });
});

/* ================= STEPS ================= */
const isEmail=v=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
function mark(id,on){ $(id).classList.toggle('bad',!!on); }

/* Reset carries the operator across, because the reader has usually just typed
   it into the field above, and being asked for it twice reads as not having
   been listened to the first time. */
window.goStep=function(name){
  const to=name==='reset';
  if(to && $('lu').value.trim() && !$('ru').value) $('ru').value=$('lu').value.trim();
  if(!to && $('ru').value.trim() && !$('lu').value) $('lu').value=$('ru').value.trim();
  ['lu','lp','ru','rp','rp2'].forEach(function(id){ mark(id,false); });
  $('loginerr').textContent=''; $('reseterr').textContent='';
  $('loginbox').classList.toggle('on',!to);
  $('resetbox').classList.toggle('on',to);
  /* Whole and at once. The staged arrival belongs to the BOOT - it is the
     machine finishing coming up - and replaying it every time somebody flips
     between sign-in and reset would turn a one-off into a delay. */
  revealAll($(to?'resetbox':'loginbox'));
  document.title='ENEROPS OS · '+(to?'Reset passkey':'Sign in');
  ($(to?'ru':'lu')).focus();
};

/* ================= AUTHENTICATE =================
   A mockup: nothing is checked against anything. The refusals below exist
   because submitting an empty box is the first thing anyone tries, and a screen
   that does nothing at all in that case cannot be reviewed.

   GRANTING ACCESS NO LONGER WRITES TO THE LOG. It used to type two more lines —
   'access granted' and '> SELECT A SITE' — and then navigate. The first
   restated what pressing the button had just done and the second announced a
   screen that was arriving anyway; neither answered the only question anybody
   has in that gap, which is how long they are going to be sitting there. The
   panel becomes a loading state instead. See the note on .load. */

/* The steps, and there are four because the portal has four things to do before
   it can show a site. They are NAMED, not numbered: 'STEP 2 OF 4' tells a
   reader how far along they are and nothing about what is happening, and if one
   of them ever hangs, the name is what says which one.

   `at` is where that step ENDS, so the four are not evenly spaced - connecting
   is quick, loading the sites is the long one. Four equal jumps would be a
   progress readout that had been made up, and the notches in the bar are drawn
   at these same numbers, so the shape is visible before the run starts.

   `out` is what the step PRODUCED, printed in the right-hand column the way the
   boot log above prints READY. '3 SITES' is the fleet this build actually
   carries - Sangria, Rioja and Mendoza, the three the globe hands over - and
   not a number chosen because it looked plausible. If the fleet changes, that
   string is wrong and has to change with it; a count is a fact, and inventing
   one here would be the front door lying about the product behind it.

   `bad` is what this step says when it does NOT finish. Each one is specific,
   because "something went wrong" is the message that sends somebody to support
   with nothing to tell them: a step that cannot reach the server and a step
   that reached it and got nothing back are two different faults with two
   different fixes, and the row is the only place that distinction survives. */
const OPENING=[
  {say:'CONNECTING',       row:'connecting',       at:16,  out:'LINKED',  bad:'NO ROUTE'},
  {say:'LOADING SITES',    row:'loading sites',    at:48,  out:'3 SITES', bad:'NO RESPONSE'},
  {say:'PREPARING PORTAL', row:'preparing portal', at:79,  out:'READY',   bad:'REFUSED'},
  {say:'OPENING',          row:'opening',          at:100, out:'GO',      bad:'TIMED OUT'}
];

/* ---- ONE DOOR, TWO PANELS ----
   The web admin panel - the internal one the EnerOps team runs customers from -
   comes in through this same door rather than a second sign-in page. Who signs
   in decides where the run ends: the Super Admin opens web-admin.html;
   everybody else - an Admin, a Plant Admin and every customer - opens the
   customer panel's Site Control through the globe, as before.

   The mockup has no server, so the web admin side is three fixed accounts,
   one per level: the Super Admin (the original web admin login), an Admin and
   a Plant Admin. The email is matched without regard to case, the passkey
   exactly, and one of these emails with any other passkey is refused at the
   form. Every other address still gets in with anything, as it always has here.
   Signing in as one of them leaves a seat - level, name, email - that the web
   admin panel and the customer pages read.

   The run is the same four steps with the same timing; only what they say
   changes for the Super Admin, because they are not loading sites - they are
   loading the customers, and '1 CUSTOMER' is the one the web admin mockup
   carries. An Admin or a Plant Admin gets the customers' run, since they land
   on Site Control. */
const WEB_ACCOUNTS=[
  {email:'admin@enerops.in',       passkey:'Enerops#01', level:'super', first:'Ravi',  last:'Goyal'},
  {email:'rahul.verma@enerops.in', passkey:'Admin#01',   level:'admin', first:'Rahul', last:'Verma'},
  {email:'anita.desai@enerops.in', passkey:'Plant#01',   level:'plant', first:'Anita', last:'Desai'}
];
const OPENING_ADMIN=[
  {say:'CONNECTING',          row:'connecting',          at:16,  out:'LINKED',      bad:'NO ROUTE'},
  {say:'LOADING CUSTOMERS',   row:'loading customers',   at:48,  out:'1 CUSTOMER',  bad:'NO RESPONSE'},
  {say:'PREPARING WEB ADMIN', row:'preparing web admin', at:79,  out:'READY',       bad:'REFUSED'},
  {say:'OPENING',             row:'opening',             at:100, out:'GO',          bad:'TIMED OUT'}
];
/* the run in progress: which steps it shows and where it ends */
let RUN=OPENING, DEST='plants.html';
const webAccount=u=>WEB_ACCOUNTS.filter(a=>a.email===u.trim().toLowerCase())[0]||null;
const STEPMS=BEAT*2.2;
/* how long the whole run is expected to take. The DESCENT is driven off this
   rather than off the bar - see the note on the limb for why a camera must not
   inherit the bar's four pauses. */
const RUNMS=STEPMS*4;
/* LATE, not broken. A step is called slow once it has run past its own budget
   by half again - late enough that a reader has started to wonder, early enough
   that it has not failed. */
const SLOWAT=1.5;
let openTimer=0, openRAF=0;

/* ---- review affordances, and they are not features ----
   Two states below cannot be reached by using the screen normally, because
   nothing in a mockup actually fails or hangs. A design that cannot be SEEN
   cannot be reviewed or signed off, so ?fail and ?slow put the run into them
   on purpose: ?fail stops it at 'loading sites', ?slow makes that same step
   overrun until the real slow detector trips.

   ?fail applies to the FIRST attempt only. Pressing RETRY then completes, which
   is the whole story a reviewer needs in one screen - it broke, it said which
   part and why, it offered the way out, and the way out worked. */
const DEMO=(location.search||'').toLowerCase();
const demoFail=DEMO.indexOf('fail')>=0, demoSlow=DEMO.indexOf('slow')>=0;
let attempt=0;

/* the log's own clock format: a fixed two decimals in brackets, so the column
   is the same width whether a step took a tenth of a second or three */
const stepClock=ms=>'[ '+(ms/1000).toFixed(2)+' ]';

/* THE COUNT IS DRAWN, NOT TRANSITIONED.

   The bar used to jump to each new width and let CSS ease it there while the
   panel waited on a timer. That is fine for a bar on its own and wrong the
   moment a number sits beside it: two readouts of the same fact, one eased by
   the browser and one set by a timeout, do not agree with each other, and a
   reader looks straight at the disagreement.

   So one animation frame loop drives both. Every frame computes ONE value and
   paints it twice - as digits and as a width - which is why they cannot drift.
   The travel is exactly the length of the step, so the number arrives on its
   value as the word that earned it is replaced, and nothing is left catching up
   after the sentence saying it finished has already gone.

   The easing is a soft quadratic ease-OUT and not the browser's default
   ease-in-out. A step that eases in as well as out stalls at both ends, and
   four stalls in two seconds is a bar that appears to hang four times. */
function openPortal(who){
  attempt++;
  $('bootlog').hidden=true;
  $('loading').hidden=false;
  $('load-op').textContent=who;
  const say=$('load-say'), num=$('load-num'), fill=$('load-fill'), bar=$('load-bar');
  /* a retry starts from nothing: the bar's colour, the count and any notches
     left from the attempt before it all go, or the second run is drawn on top
     of the first one's wreckage */
  clearTimeout(openTimer); cancelAnimationFrame(openRAF);
  bar.classList.remove('bad'); $('load-pct').classList.remove('bad');
  const oldBtn=$('load-retry'); if(oldBtn) oldBtn.remove();
  bar.querySelectorAll('u').forEach(function(u){ u.remove(); });

  /* ---- the ledger, and the notches, both built from the run's steps ----
     One list describes the run, and everything on screen is drawn from it: the
     rows, the boundaries in the bar, the announcements. Adding a fifth step is
     one entry, not five edits in four places. */
  $('load-steps').innerHTML=RUN.map(function(s,n){
    return '<div class="lstep wait" id="lstep'+n+'">'+
      '<span class="lt"></span>'+
      '<span class="ln">'+s.row+'</span>'+
      '<span class="ld"></span>'+
      '<span class="lv"></span></div>';
  }).join('');
  /* the last step ends at 100, which is the end of the bar and not a boundary
     inside it - a notch there is a mark against the edge */
  RUN.slice(0,-1).forEach(function(s){
    const u=document.createElement('u');
    u.style.left=s.at+'%';
    bar.appendChild(u);
  });

  const row=n=>$('lstep'+n);
  function mark(n,cls){ const r=row(n); if(r) r.className='lstep '+cls; }
  function put(n,sel,txt){
    const r=row(n); if(!r) return;
    const el=r.querySelector(sel);
    /* only touch the DOM when the text actually changed - the clock below runs
       on every frame, and writing the same string sixty times a second is sixty
       needless layout invalidations */
    if(el && el.textContent!==txt) el.textContent=txt;
  }

  let i=0, from=0;

  /* one value, two readouts. The width keeps its decimals - a bar rounded to
     whole percent advances in visible 5px steps across a 520px panel - and the
     digits are rounded, because 47.3% is not a thing anybody is waiting for. */
  function paint(p){
    num.textContent=Math.round(p);
    fill.style.width=p.toFixed(2)+'%';
  }
  paint(0);

  /* the run's own clock, so every row's timing is measured from the same
     instant the bar started rather than from whenever that row began */
  const runT0=performance.now();

  /* ---- THE DESCENT ----
     The horizon at the foot of the screen rises while this runs, so the wait is
     the approach to the planet the next screen opens on. It reads the CLOCK and
     not the bar: the bar eases into four discrete steps and rests at each
     boundary, and a camera that stalls four times in two seconds is a shot with
     four hiccups in it. Smoothstepped, so it leaves and arrives without a jerk
     at either end.

     A retry does not restart it. limbFly refuses to go backwards, so a run that
     failed at 48% and was retried carries on from the height it reached - you
     do not un-travel because a request timed out. */
  function flyTo(now){
    if(reduced || !window.limbFly) return;
    const t=Math.max(0,Math.min(1,(now-runT0)/RUNMS));
    window.limbFly(t*t*(3-2*t));
  }
  function closeStep(n){
    mark(n,'done');
    put(n,'.lt', stepClock(performance.now()-runT0));
    put(n,'.lv', RUN[n].out);
  }

  /* THE CLOCK ON THE RUNNING ROW.

     The time column used to be empty until a step finished, which left the
     panel silent about the one thing it was measuring at exactly the moment
     somebody wanted to know it. It counts while the step runs and freezes when
     the step closes, so the figure a reader ends up reading is the same figure
     they watched arrive - there is no second number to reconcile.

     It is written in HUNDREDTHS and not on every frame. At 60fps the last digit
     of a millisecond clock is a strobe: unreadable, and it says nothing a
     hundredth does not. put() drops the write when the string has not changed,
     so this costs one DOM write per centisecond rather than one per frame. */
  function tick(n){
    if(reduced) return;   /* a counter that never stops is motion */
    put(n,'.lt', stepClock(performance.now()-runT0));
  }

  function fail(n){
    cancelAnimationFrame(openRAF); clearTimeout(openTimer);
    mark(n,'fail');
    put(n,'.lt', stepClock(performance.now()-runT0));
    put(n,'.lv', RUN[n].bad);
    bar.classList.add('bad'); $('load-pct').classList.add('bad');
    bar.setAttribute('aria-invalid','true');
    /* the announcement names the step AND the reason - a screen reader hearing
       only "failed" is in the position the bar left everybody else in */
    say.textContent=RUN[n].say+' FAILED: '+RUN[n].bad;
    const b=document.createElement('button');
    b.type='button'; b.className='lgo retry'; b.id='load-retry'; b.textContent='RETRY';
    b.addEventListener('click',function(){ openPortal(who); });
    $('load-foot').appendChild(b);
    b.focus();
  }

  function done(){
    /* the last step is allowed to be SEEN before the page changes under it - a
       bar that reaches 100% and a ledger that completes in the same instant the
       page is replaced read as a jump rather than as a finish */
    openTimer=setTimeout(function(){ window.location.href=DEST; }, reduced?150:620);
  }

  (function step(){
    const n=i, s=RUN[i++], to=s.at;
    say.textContent=s.say;
    mark(n,'run');
    /* the step that the review flags act on, and only on the first attempt */
    const willFail=demoFail && attempt===1 && n===1;
    /* HOW LONG IT TAKES AND HOW LONG IT SHOULD TAKE ARE TWO NUMBERS.

       They were one, and that made the slow detector circular: it compared the
       elapsed time against the very budget the review flag had just stretched,
       so a step told to run four times longer also had four times longer to run
       before it counted as late, and SLOW could never fire. A deadline measured
       against the thing it is meant to catch is not a deadline. */
    const budget = (demoSlow && n===1) ? STEPMS*4.2 : STEPMS;
    const expect = STEPMS;
    /* the progressbar value moves once per STEP, not once per frame: it is what
       a screen reader is told, and it should be told four things rather than
       four hundred */
    bar.setAttribute('aria-valuenow', to);
    if(reduced){
      /* no count and no travel - the number is set, the row is closed, and the
         next one starts. Somebody who asked for less motion has not asked for
         less information. */
      if(willFail){ paint(to); fail(n); return; }
      paint(to); from=to; closeStep(n);
      openTimer=setTimeout(i<RUN.length?step:done, 90);
      return;
    }
    /* THE CLOCK IS THE FRAME CLOCK, NOT performance.now().

       This started the run by calling the frame function with a performance.now()
       reading and then let requestAnimationFrame supply every reading after it.
       The two are not guaranteed to be the same clock - under a headless
       renderer they were not even close - so the second frame arrived with a
       timestamp far BEFORE the start, k went negative, the ease squared it into
       something much larger, and the panel counted down to -586%.

       Nothing outside the loop supplies a time now. The first frame that runs
       IS time zero, and k is clamped at both ends, so an out-of-order or
       repeated timestamp can at worst hold the count still for a frame. */
    let t0=-1, said=false;
    openRAF=requestAnimationFrame(function frame(now){
      if(t0<0) t0=now;
      const k=Math.min(1,Math.max(0,(now-t0)/budget)), e=1-(1-k)*(1-k);
      paint(from+(to-from)*e);
      tick(n);
      flyTo(now);
      /* LATE IS SAID ONCE, and the row keeps running. The bar does not stop and
         the count does not reset - the step is still going, it is simply past
         the time it should have taken, and the reader is told that rather than
         being left to infer it from a stripe that has stopped moving. */
      if(!said && k>0 && (now-t0)>expect*SLOWAT && k<1){
        said=true; mark(n,'run slow'); put(n,'.lv','SLOW');
        say.textContent=RUN[n].say+' - TAKING LONGER THAN EXPECTED';
      }
      if(k<1){ openRAF=requestAnimationFrame(frame); return; }
      if(willFail){ fail(n); return; }
      from=to;
      closeStep(n);
      if(i<RUN.length) step(); else done();
    });
  })();
}

function run(btn, errId, checks, who){
  const bad=checks();
  if(bad){ mark(bad[0],true); $(errId).textContent=bad[1]; $(bad[0]).focus(); return; }
  const label=btn.textContent;
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span>'+label;
  $('loginbox').classList.remove('on');
  $('resetbox').classList.remove('on');
  document.title='ENEROPS OS · Opening';
  openPortal(who);
}

$('lgo').addEventListener('click',function(){
  run($('lgo'),'loginerr',function(){
    const u=$('lu').value.trim(), p=$('lp').value;
    if(!u) return ['lu','ENTER YOUR OPERATOR ADDRESS'];
    if(!isEmail(u)) return ['lu','THAT IS NOT AN EMAIL ADDRESS'];
    if(!p) return ['lp','ENTER YOUR PASSKEY'];
    const acct=webAccount(u);
    if(acct && p!==acct.passkey) return ['lp','OPERATOR OR PASSKEY NOT RECOGNISED'];
    const sup=!!acct && acct.level==='super';
    RUN=sup?OPENING_ADMIN:OPENING; DEST=sup?'web-admin.html':'plants.html';
    /* the seat the web admin panel and the customer pages read */
    try{
      if(acct) localStorage.setItem('enerops-seat',JSON.stringify({level:acct.level,first:acct.first,last:acct.last,email:acct.email}));
      else localStorage.removeItem('enerops-seat');
    }catch(e){}
    return null;
  }, $('lu').value.trim().toUpperCase());
});

$('rgo').addEventListener('click',function(){
  run($('rgo'),'reseterr',function(){
    const u=$('ru').value.trim(), a=$('rp').value, b=$('rp2').value;
    if(!u) return ['ru','ENTER YOUR OPERATOR ADDRESS'];
    if(!isEmail(u)) return ['ru','THAT IS NOT AN EMAIL ADDRESS'];
    if(!a) return ['rp','CHOOSE A NEW PASSKEY'];
    if(a.length<8) return ['rp','USE AT LEAST 8 CHARACTERS'];
    if(!b) return ['rp2','TYPE THE NEW PASSKEY AGAIN'];
    if(a!==b) return ['rp2','THE TWO PASSKEYS DO NOT MATCH'];
    RUN=OPENING; DEST='plants.html';
    try{ localStorage.removeItem('enerops-seat'); }catch(e){}
    return null;
  }, $('ru').value.trim().toUpperCase());
});

/* Enter submits from any field in the box that is showing — a terminal that
   made you reach for the mouse would not be one. */
['lu','lp'].forEach(function(id){
  $(id).addEventListener('keydown',function(e){ if(e.key==='Enter') $('lgo').click(); });
  $(id).addEventListener('input',function(){ mark(id,false); $('loginerr').textContent=''; });
});
['ru','rp','rp2'].forEach(function(id){
  $(id).addEventListener('keydown',function(e){ if(e.key==='Enter') $('rgo').click(); });
  $(id).addEventListener('input',function(){ mark(id,false); $('reseterr').textContent=''; });
});
})();
</script>
<script>
/* ===================== THE LIMB =====================
   The edge of the Earth, across the foot of the front door, lit by the same sun
   the wash overhead is coming from - the same planet the site overview flies
   you down onto, seen from one step further out and one moment earlier.

   IT IS THREE THINGS AND NOTHING ELSE:
     THE GROUND     a circle whose centre is far below the window, so only its
                    cap crosses the screen. Dark on the night side, cool blue
                    where the light reaches, warm right under the sun.
     THE LINE       the atmosphere seen edge-on: a hairline, at its brightest
                    where the sun is and gone entirely by the time the
                    terminator has run off to the left.
     THE HAZE       the same line, spread. Half a dozen widening strokes, each
                    fainter than the last, which is what an atmosphere does to a
                    horizon and what no single stroke can imitate.

   NO SITE IS ON IT. Nothing here is clickable, nothing here is a reading, and
   no figure is printed over it - the fleet lives on the globe on the other side
   of this door, and a horizon that pretended to carry sites would be this
   screen claiming to know something it has not asked for yet.

   IT MOVES ONCE, AND ONLY ONCE: WHEN YOU ARE LET THROUGH.

   It used to be painted a single time per resize, and the note here said so -
   nothing on this screen moved except the stars twinkling on their own canvas.
   That was right while signing in was the only thing happening. It stopped
   being right when the wait after AUTHENTICATE became a thing with a duration:
   a progress bar in a card is a widget borrowed from any other website, and
   this screen already had the one image that could carry a wait without
   borrowing anything - the planet you are about to be handed.

   So the loading IS the approach. The horizon RISES and the curve DEEPENS as
   the run goes, which is what a planet does when you come down towards it, and
   by the time the ledger closes you are looking at a world rather than at the
   edge of one. The site overview then opens on the whole globe: the cut lands
   on a camera that has already been moving.

   Two rules keep it honest.

   IT IS DRIVEN BY THE CLOCK, NOT BY THE BAR. The bar eases into each of its
   four steps and pauses at every boundary, which is correct for a readout of
   discrete stages and disastrous for a camera - four decelerations in two
   seconds is a shot that stalls four times. The descent runs off the elapsed
   time of the whole sequence instead, smoothed end to end, so the ledger ticks
   in stages while the move underneath it is continuous.

   IT NEVER GOES BACKWARDS. A failed step freezes the camera where it is, and
   RETRY carries on from there rather than flying back up to the door. You do
   not un-travel because a request timed out.
   =================================================== */
(function(){
const cv=document.getElementById('limb');
if(!cv) return;
const lx=cv.getContext('2d');
if(!lx) return;

/* The sun's place in the frame, read from the SAME custom property the body
   wash is built out of, so there is one sun on this screen and one only. Change
   --sun-x and the horizon relights itself along with the sky. */
function sunX(){
  const v=getComputedStyle(document.documentElement).getPropertyValue('--sun-x').trim();
  const n=parseFloat(v);
  if(!isFinite(n)) return 0.78;
  return v.indexOf('%')>=0 ? n/100 : n/innerWidth;
}

/* THE CANVAS IS SIZED IN ONE PLACE AND DRAWN IN ANOTHER.

   They were one function, which was fine at one paint per resize and wrong the
   moment the camera moved: setting cv.width reallocates the backing store and
   clears it, so a per-frame repaint that re-sized first would have thrown away
   and rebuilt a full-screen buffer sixty times a second to change two numbers.

   size() runs on resize and builds everything that depends only on the WINDOW -
   the buffer, and the two gradients, which are functions of the width and the
   sun and of nothing else. draw() runs per frame and touches only the geometry.
   The gradients are cached for the same reason: constructing them is the most
   expensive thing here and neither of them changes as the camera moves. */
let W=0, H=0, GROUND=null, AIR=null;

/* THE CAMERA, and it is one number: 0 at the door, 1 arrived. */
let flyT=0;

function size(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  lx.setTransform(dpr,0,0,dpr,0,0);

  const sx=sunX();
  const at=function(t){ return Math.max(0,Math.min(1,t)); };

  /* ---- the ground ----
     Lit ACROSS, not from a point: at this distance the terminator is a soft
     band running down the face of the planet, and a radial highlight would put
     a spotlight on a world. Every stop is placed relative to the sun's own x,
     so moving the sun moves the night with it. */
  const g=lx.createLinearGradient(0,0,W,0);
  /* KEPT DARK ON PURPOSE. A first pass lit the ground until it was a pale
     blue-grey field, and at that value it stopped being a planet and became
     fog - it competed with the panel for the eye and it washed out the one
     thing that actually says "seen from orbit", which is the rim. A limb is a
     DARK body with a bright edge. The light on this screen lives in the line,
     not in the ground under it. */
  g.addColorStop(0,           '#010206');
  g.addColorStop(at(sx-0.62), '#02040b');
  g.addColorStop(at(sx-0.34), '#040c18');
  g.addColorStop(at(sx-0.12), '#0a1c30');
  g.addColorStop(at(sx+0.06), '#102a44');
  g.addColorStop(1,           '#153650');
  GROUND=g;

  /* ---- the atmosphere, edge on ----
     ONE gradient says how lit the air is along the whole arc, and every stroke
     below reads from it - so the hairline and the haze cannot disagree about
     where the day ends. */
  const air=lx.createLinearGradient(0,0,W,0);
  air.addColorStop(0,           'rgba(96,140,206,0)');
  air.addColorStop(at(sx-0.66), 'rgba(104,150,214,.10)');
  air.addColorStop(at(sx-0.38), 'rgba(126,172,232,.34)');
  air.addColorStop(at(sx-0.14), 'rgba(164,204,248,.72)');
  air.addColorStop(at(sx+0.04), 'rgba(214,231,255,.96)');
  air.addColorStop(1,           'rgba(255,236,196,.90)');
  AIR=air;
}

function draw(){
  if(!GROUND) return;
  lx.clearRect(0,0,W,H);

  /* HOW MUCH PLANET. The radius is set from the WIDTH, because the curve is
     read across the screen rather than up it: too small and the horizon becomes
     a hill, too large and it becomes a ruled line and the planet is gone. At
     rest this lands the sag at roughly a tenth of the window - unmistakably
     curved, and still a horizon rather than a ball.

     THE CAMERA SHRINKS IT. A smaller radius on screen is a planet whose curve
     you can see more of, which is what coming closer to a sphere this size
     actually looks like: the horizon bends harder and the ground takes more of
     the frame. It is not halved - a limb that turns into a ball in two seconds
     reads as a zoom, and this is meant to read as a descent. */
  const R=Math.max(W*1.85, H*2.2) * (1 - 0.42*flyT);
  /* How far the cap stands above the bottom edge. Capped in pixels as well as
     in vh, so a tall window does not put the horizon through the middle of the
     sign-in and a short one still gets a horizon rather than a sliver.

     THIS IS THE MOVE. The rest is consequence: the ground rises with it, the
     warm under the sun rises with it, and the haze and the hairline are carried
     up on the same arc. */
  const base=Math.max(58, Math.min(H*0.27, 230));
  const rise=base + (H*0.52 - base)*flyT;
  const cx=W*0.5, cy=H-rise+R;
  const sx=sunX();

  lx.beginPath(); lx.arc(cx,cy,R,0,6.283185); lx.closePath();
  lx.fillStyle=GROUND; lx.fill();

  /* The ground immediately under the sun takes the warm of it - the same gold
     the wash overhead is made of, which is the whole reason the two read as one
     light rather than as two that happen to agree. */
  lx.save();
  lx.beginPath(); lx.arc(cx,cy,R,0,6.283185); lx.clip();
  const wy=H-rise*0.35;
  const wg=lx.createRadialGradient(W*sx,wy,0,W*sx,wy,Math.max(W*0.30,220));
  wg.addColorStop(0,'rgba(255,206,140,.26)');
  wg.addColorStop(.40,'rgba(232,166,80,.09)');
  wg.addColorStop(1,'rgba(226,160,74,0)');
  lx.fillStyle=wg;
  lx.fillRect(0,H-rise-40,W,rise+40);
  lx.restore();

  /* THE HAZE FIRST, widest and faintest, so the hairline lands on top of its
     own glow rather than under it. Seven passes rather than one wide stroke: an
     atmosphere fades off a horizon on a curve, and a single stroke of even
     alpha is a band.

     The offsets stay in PIXELS as the camera moves, because an atmosphere is a
     fixed depth of air: scaling it with the radius would thin the band out as
     the planet grew, which is the one part of this that should not change. */
  lx.lineCap='butt';
  for(let i=7;i>=1;i--){
    lx.beginPath();
    lx.arc(cx,cy,R+i*3.6,Math.PI,6.283185);
    lx.lineWidth=i*5.2;
    lx.globalAlpha=0.085/Math.pow(i,0.86);
    lx.strokeStyle=AIR;
    lx.stroke();
  }
  lx.globalAlpha=1;

  /* and then the line itself: thin, because the thing it draws is thin */
  lx.beginPath();
  lx.arc(cx,cy,R+0.6,Math.PI,6.283185);
  lx.lineWidth=1.5;
  lx.strokeStyle=AIR;
  lx.stroke();
}

function paint(){ size(); draw(); }
addEventListener('resize',paint);
paint();

/* ---- the one control the opening sequence has over this screen ----
   A number in, a repaint out, and it only ever goes forwards. Everything about
   WHEN to move lives with the sequence that is moving it; everything about what
   the move looks like lives here. */
window.limbFly=function(t){
  t=Math.max(0,Math.min(1,t));
  if(t<=flyT) return;                 /* never backwards - see the note above */
  flyT=t;
  draw();
};
})();
</script>

<script>
/* ===================== THE SKY =====================
