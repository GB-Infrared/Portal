<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENEROPS OS &middot; KPI</title>
<link rel="icon" href="logo/favicon.png">
<style>



:root{
  /* ---- LIGHT · UTILITY BLUE (default) · enterprise solar-portal palette ---- */
  --bg:#f1f4f8;            /* page background            */
  --panel:#ffffff;         /* card surface               */
  --panel-2:#f5f8fb;       /* nested surface / inputs    */
  --line:#dde4ec;          /* card borders               */
  --line-soft:#e9eef4;     /* gridlines, dividers        */
  --line-hi:#b5c2d1;       /* hover / active borders     */
  --text:#152234;          /* primary text               */
  --muted:#5a6b7f;         /* secondary text             */
  --faint:#8494a6;         /* tertiary text              */
  --dim:#aab6c4;           /* dead readouts (offline)    */
  --elev:#ffffff;          /* tooltips, toasts           */
  --sel:#e8f0fb;           /* selected card surface      */
  --hover:rgba(11,99,206,.07);
  --hover-soft:rgba(11,99,206,.045);
  /* the row under the pointer, and only that row */
  --row-hover:rgba(11,99,206,.10);
  --grid-v:rgba(21,34,52,.05);
  --shadow:rgba(19,38,63,.16);
  --on-accent:#ffffff;     /* text on a filled accent    */
  --topbar:var(--panel);
  --topbar-fg:var(--text);
  --topbar-fg-2:var(--muted);
  --topbar-tab:var(--muted);
  --topbar-hover:var(--hover);
  --topbar-active:var(--green-soft);
  --green:#12a150;         /* producing / healthy        */
  --green-rgb:18,161,80;
  --green-soft:rgba(18,161,80,.12);
  --green-deep:#0b7a3c;
  --blue:#1a73c8;
  --blue-soft:rgba(26,115,200,.12);
  --red:#d92d20;           /* offline / alarms           */
  --red-soft:rgba(217,45,32,.1);
  --amber:#dc7a06;         /* yield / deviations         */
  --amber-soft:rgba(220,122,6,.12);
  --brand:#a87b0f;         /* wordmark · gold            */

  /* ---------- series palette ----------
     Four slots, assigned to devices in fixed order and never cycled: a device
     keeps its colour when another is switched off, so the eye can carry a
     reading from the chart to the legend to the table.

     Validated, not eyeballed - all-pairs, on this page's own card surface:
     CVD separation, normal-vision separation, chroma and contrast all clear.
     RED IS NOT IN THE SET. On this portal red means offline/alarm, and a
     device that happened to land in slot 4 would be wearing a fault colour
     while producing normally. Amber is likewise the deviation colour, so the
     series ochre is pulled well off it in both lightness and hue. */
  --s1:#1a73c8; --s2:#c47a00; --s3:#00806a; --s4:#c569a0;
  /* BARS, not lines. The --s series is picked so a 2px stroke reads on white,
     which makes it deep - and a deep tone spread over a 26px-wide filled bar
     comes out muddy rather than legible. These are the same hues at the same
     positions, so a plant keeps its identity across every page, lifted in
     saturation for an area rather than a line. */
  --k1:#2d7ff9; --k2:#f59e0b; --k3:#10b981;
  --k4:#e0559f; --k5:#7c5cf0; --k6:#06b6d4;

  --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,'Helvetica Neue',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --r-lg:14px; --r-md:10px; --r-sm:8px;
}
/* ---- DARK · the front door's palette, on every page behind it.

   THIS IS THE SIGN-IN'S SKY, not a second design. login.html and the site
   overview have always stood in the void; the portal stopped at the door and
   turned white. Somebody who signs in at night now keeps the room they signed
   in from, and these are that screen's own token values, copied rather than
   re-picked - two dark palettes that drift apart is exactly the failure the
   single :root above was written to avoid.

   NOT ONE RULE BELOW THIS BLOCK CHANGES. Only the VALUES are redefined, so
   every rule on the page - the cards, the tables, the charts, the dialogs -
   goes dark by reading the same token names it already read. A page re-skinned
   by rewriting two hundred declarations is a page with two hundred chances to
   miss one.

   The header tokens are not here because they do not need to be: --topbar and
   its family are declared as var(--panel), var(--text) and so on, so they
   follow whatever these say.

   The colours mean here what they mean on the overview: WHITE a fixed fact,
   EMERALD live, GOLD what has been banked. ---------------------------------- */
html[data-theme="dark"]{
  /* THE BROWSER'S OWN WIDGETS HAVE TO BE TOLD. Radios, tick boxes, the native
     date popup and the scrollbars are drawn by the UA, not by anything here,
     and left alone they stay in their light costume - four white discs in a
     navy menu, and a calendar that opens as a white sheet. One declaration
     hands the whole set over, which is the only way to reach the parts of a
     control this stylesheet cannot select. */
  color-scheme:dark;
  accent-color:#3ad998;
  --bg:#070c14;            /* the void itself            */
  --panel:rgba(9,16,28,.74);   /* the same glass the overview stands on */
  --panel-2:rgba(9,16,28,.62);
  --line:rgba(150,180,220,.16);
  --line-soft:rgba(150,180,220,.10);
  --line-hi:rgba(140,175,215,.30);
  --text:#e9f1fb;          /* white  - fixed facts, identity */
  --muted:#8ba0bb;
  --faint:#7d92ad;
  --dim:#5d6e83;           /* dead readouts, and they read dead on black */
  /* OPAQUE, and the one token here that is. The cards are glass because they
     sit still and the void behind them is meant to show; a dropdown, a tooltip
     or a toast is drawn OVER something a reader is trying to read, and at 96%
     the number underneath was still legible through the menu. A floating layer
     that lets its background through is not a layer. */
  --elev:#0d1624;
  --sel:rgba(127,178,238,.14);
  --hover:rgba(150,180,220,.07);
  --hover-soft:rgba(150,180,220,.045);
  --row-hover:rgba(150,180,220,.09);
  --shadow:rgba(0,0,0,.62);
  --scrim:rgba(3,7,13,.70);
  --grid-v:rgba(150,180,220,.07);
  /* text ON a filled accent. White on emerald is unreadable at this weight, and
     the accents are light here - so the ink goes dark instead. */
  --on-accent:#07121b;
  --green:#3ad998;         /* emerald - live */
  --green-rgb:58,217,152;
  --green-soft:rgba(58,217,152,.14);
  --green-deep:#3ad998;
  --blue:#7fb2ee;
  --blue-soft:rgba(127,178,238,.16);
  --red:#ff6b5e;
  --red-soft:rgba(255,107,94,.14);
  --crit:#ff9d94;
  --amber:#f0b74a;
  --amber-soft:rgba(240,183,74,.15);
  --brand:#f0b74a;         /* gold - the wordmark, and what the day earns */
  --brand-soft:rgba(240,183,74,.14);
  --brand-line:rgba(240,183,74,.34);
  /* The series hues, lifted. A mid-tone picked to carry on white sinks into
     navy - #12a150 against #070c14 is a line you have to hunt for - so every
     one of these is the same hue at the brightness this ground needs. The
     charts read them as tokens and never learn a theme exists. */
  --s1:#3ad998; --s2:#7fb2ee; --s3:#f0b74a; --s4:#b39cff;
  --s5:#ff8ac0; --s6:#4fd3dd; --s7:#e9a03c; --s8:#9a92ff;
  --s9:#4fd0bd; --s10:#e3c05a; --s11:#ff8ac0; --s12:#5cc0f5;
  --k1:#6aa8ff; --k2:#f7b955; --k3:#3ad998; --k4:#ff8ac0;
  --k5:#a99bff; --k6:#4fd3dd;
}
/* The one control that is not a reading: it belongs with the clock and the
   avatar, at the right of the bar, because it is about the SCREEN rather than
   about the plant. */
.themebtn{width:30px;height:30px;display:grid;place-items:center;flex:none;
  border-radius:8px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--topbar-fg-2,var(--muted));transition:background .12s,border-color .12s,color .12s}
.themebtn:hover{border-color:var(--line-hi);background:var(--topbar-hover,var(--hover));
  color:var(--topbar-fg,var(--text))}
.themebtn svg{display:block}
/* the icon shows WHAT YOU WILL GET, not what you are in: a moon on the light
   page is an offer, a moon on the dark page is a label for a state the whole
   screen is already stating */
.themebtn .moon{display:none}
html[data-theme="dark"] .themebtn .moon{display:block}
html[data-theme="dark"] .themebtn .sun{display:none}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:var(--line-hi) transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;
     -webkit-font-smoothing:antialiased}

/* ===================== THE FIELD THE GLASS STANDS ON =====================
   DARK WAS A FLAT BLACK SLAB, and it should not have been.

   The dark tokens were copied from the sign-in exactly, which was right, but
   only half of what makes that screen work came across. Over there --panel is
   rgba(9,16,28,.74) - GLASS - and behind it is a lit sky: a warm wash where the
   sun is, a wide cold one carrying the rest, a star field and the limb of the
   Earth. The panel reads as a surface because there is something behind it for
   it to be in front of.

   Here the same glass was laid on #070c14 and nothing else. 74% of near-black
   over near-black composites to near-black: card and page came out within a
   couple of values of each other, every border did the whole job of separating
   them, and the screen read as one unlit sheet with type on it. The tokens were
   never the problem - the room was empty.

   So this is the sign-in's own sky, at working strength. Same three washes, same
   places, same hues; roughly a third of the amplitude, because that screen is a
   held moment with one panel on it and this one is a working surface covered in
   tables. Enough to give the glass something to lift off, not enough to be read
   as data. No stars and no limb: those are the front door's, and a horizon
   behind a KPI table would be scenery.

   ON html, NOT ON body. The root element's background paints the whole canvas
   and does not scroll away when a long table does - a wash on body either ends
   where the content ends or has to be pinned with background-attachment:fixed,
   which repaints the gradient on every scroll frame. body is handed back to
   transparent for the same reason: two backgrounds is one background and one
   piece of dead code.

   LIGHT IS UNTOUCHED. It is a daylit palette on a solid ground and it separates
   its cards with white against grey, which needs no help from behind. */
html[data-theme="dark"]{
  background:
    /* the sun, off the top right corner */
    radial-gradient(circle 46vmax at 80% -8%,
      rgba(255,216,146,.085) 0%, rgba(240,178,73,.032) 32%, transparent 64%),
    /* the cold half of the same sky, wide enough to reach the far corner */
    radial-gradient(ellipse 155% 125% at 80% -8%,
      rgba(126,158,214,.115) 0%, rgba(90,120,180,.05) 46%, transparent 80%),
    /* and the void closing back in under both, so the foot of a long page is
       the deep end rather than a gradient that simply stops */
    radial-gradient(ellipse 130% 105% at 50% 62%,
      rgba(2,6,14,.34) 0%, rgba(0,1,5,.5) 100%),
    var(--bg);
}
html[data-theme="dark"] body{background:transparent}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line-hi);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:20px;
  height:58px;padding:0 22px;border-bottom:1px solid var(--line);
  background:var(--topbar);color:var(--topbar-fg)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .logo{height:34px;width:auto;display:block;flex:none}
.brand .btext{display:flex;flex-direction:column;justify-content:center;gap:1px}
.brand .word{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--brand);
  letter-spacing:.2px;line-height:1.05}
.brand .sub{font-size:9px;letter-spacing:.16em;color:var(--topbar-fg-2);text-transform:uppercase;
  font-weight:600;line-height:1}
@media (max-width:820px){ .brand .sub{display:none} }
/* ---------- which site the portal is on ----------
   A READOUT, NOT A CONTROL. Every page used to answer "which site am I looking
   at" with a picker of its own - four of them, four defaults, and nothing
   keeping them in step: you could walk from Monitoring to Alarms and be reading
   two different plants without either page saying so. The choosing moved to one
   place, the Sites tab a little to the right of this, and what is left here is
   the ANSWER - the same words, the same spot, on every page.
   A pin and a name, with no "SITE" label in front of it: the wordmark beside it
   already says SITE OVERVIEW and the tab beside that says Sites, and a third
   one would be the bar saying the word three times before saying anything. */
.sitenow{display:flex;align-items:center;gap:7px;flex:none;white-space:nowrap;
  padding-left:16px;border-left:1px solid var(--line);color:var(--topbar-fg)}
.sitenow svg{color:var(--green);flex:none}
.sitenow .n{font-family:var(--mono);font-size:13.5px;font-weight:600;letter-spacing:.02em}
@media (max-width:900px){ .sitenow{padding-left:10px} .sitenow svg{display:none} }
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:8px 13px;border-radius:9px;color:var(--topbar-tab);font-size:13.5px;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--topbar-fg);background:var(--topbar-hover)}
.tab.active{color:var(--green);background:var(--topbar-active);font-weight:600}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.clock{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--topbar-fg);letter-spacing:.02em}
.refresh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--topbar-fg-2)}
/* The control beside it is the portal's own dropdown now, not the browser's -
   see the note on the markup - and these are the few things a header-sized one
   needs said. Everything else it inherits from .mbtn / .colpanel unchanged. */
/* The word is a LABEL for the control beside it, so it stops being a link-sized
   piece of type competing with the value: quieter, letterspaced, and it steps
   out of the way on a narrow bar where the value is the part that matters. */
.refresh .rl{letter-spacing:.04em;white-space:nowrap}
/* .mbtn was drawn for the filter bar and is already this height, so only the
   width is stated - "15 min" is the longest thing it ever holds, and a box
   sized for that stops the header shifting when the value changes. */
.refresh .rsel .mbtn{min-width:86px;font-family:var(--mono);font-size:12px;
  justify-content:space-between}
/* .colpanel hangs from its control's LEFT edge, which is right for a filter bar
   and wrong here: this is the last control before the theme switch and the
   avatar, so a list dropped leftward runs off the end of the bar. */
.refresh .rsel .colpanel{left:auto;right:0;width:150px}
/* OFF is a state, not an absence, so the label says it in the same voice the
   dot does - dimmed, with the pulse stopped. */
.refresh .rsel .mbtn .mlab.off{color:var(--muted)}
@media (max-width:1180px){ .refresh .rl{display:none} }
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(var(--green-rgb),.55);
  animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--green-rgb),.5)}70%{box-shadow:0 0 0 8px rgba(var(--green-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--green-rgb),0)}}
select{appearance:none;background:var(--panel-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%238d99a6" stroke-width="1.6" stroke-linecap="round"/></svg>') no-repeat right 10px center;
  border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);
  padding:8px 28px 8px 11px;font-size:13px;font-family:inherit;outline:none}
select:hover{border-color:var(--line-hi);background-color:var(--hover)}
select:focus{border-color:var(--line-hi);background-color:var(--hover)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;
  background:transparent;border:1px solid transparent;color:var(--muted)}
.iconbtn:hover{color:var(--text);background:var(--hover);border-color:var(--line)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--text);
  border:1px solid var(--line)}
/* ---------- account menu ----------
   The avatar was a dead circle: it named the signed-in user and offered nothing.
   It is the only place Settings and Sign out can live without spending a tab on
   either, and every page carries the same one so the way out is never hunted for. */
.acct{position:relative;display:flex}
.avatar{padding:0}
.avatar:hover,.acct.open .avatar{border-color:var(--line-hi);background:var(--hover)}
.acctmenu{position:absolute;top:calc(100% + 8px);right:0;z-index:90;width:224px;
  background:var(--elev);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:0 18px 44px -16px var(--shadow);padding:6px;display:none}
.acct.open .acctmenu{display:block}
.acctwho{padding:9px 10px 10px}
.acctwho .nm{font-size:13px;font-weight:700;color:var(--text);line-height:1.3}
.acctwho .em{font-size:11.5px;color:var(--muted);line-height:1.35;word-break:break-all}
.acctdiv{height:1px;background:var(--line-soft);margin:4px}
.acctitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
  font-size:12.5px;font-weight:600;color:var(--text);width:100%;
  border:none;background:transparent;text-align:left;font-family:inherit}
.acctitem:hover{background:var(--hover)}
.acctitem svg{flex:none;color:var(--faint)}
.acctitem:hover svg{color:var(--muted)}
.acctitem.out:hover{background:var(--red-soft);color:var(--red)}
.acctitem.out:hover svg{color:var(--red)}


/* ---------- page shell ----------
   One column, no rail. Analysis is driven entirely by the bar above it, and a
   rail would take width from a chart whose whole job is a long time axis. */
.wrap{max-width:2400px;margin:0 auto;padding:14px clamp(14px,1.5vw,28px) 34px;
  display:flex;flex-direction:column;gap:14px}
.toprow{max-width:2400px;margin:0 auto;padding:16px clamp(14px,1.5vw,28px) 0}

/* ---------- filter bar ---------- */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:9px;padding:0 2px 2px;min-width:0}
.field{position:relative;display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.field select,.field .input,.field input{height:34px;min-width:116px}
.field select{padding-top:0;padding-bottom:0}
/* Y1 and Y2 are each a PAIR - the category narrows the list the value is
   picked from - so they are ruled together and read as one control, not four.
   Without this the bar is eight equal boxes and nothing says which value
   belongs to which category. */
.pair{display:flex;align-items:flex-end;gap:6px;padding:0 9px 0 0;border-right:1px solid var(--line);margin-right:3px}
.pair:last-of-type{border-right:none}
.axtag{display:inline-flex;align-items:center;gap:5px}
.axtag i{width:14px;height:0;border-top-width:2px;border-top-color:var(--muted);display:inline-block}
.axtag i.solid{border-top-style:solid}
.axtag i.dash{border-top-style:dashed}

/* ---------- dropdown panels (one idiom, four uses) ---------- */
.msel{position:relative;display:flex}
.mbtn{display:flex;align-items:center;width:100%;min-width:150px;height:34px;
  padding:0 28px 0 11px;border-radius:var(--r-sm);border:1px solid var(--line);
  color:var(--text);font-size:13px;font-weight:600;text-align:left;
  background:var(--panel-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%238d99a6" stroke-width="1.6" stroke-linecap="round"/></svg>') no-repeat right 10px center}
.mbtn:hover,.msel.open .mbtn{border-color:var(--line-hi);background-color:var(--hover)}
.mbtn .mlab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbtn .mlab.any{color:var(--muted);font-weight:600}
/* a value control that has nothing to offer yet says so instead of opening empty */
.mbtn:disabled{opacity:.5;cursor:default}
.mbtn:disabled:hover{border-color:var(--line);background-color:var(--panel-2)}
.colpanel{position:absolute;top:calc(100% + 6px);left:0;z-index:80;width:236px;
  background:var(--elev);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 18px 44px -16px var(--shadow);padding:8px;
  max-height:min(60vh,460px);overflow-y:auto;scrollbar-width:thin}
.colpanel[hidden]{display:none}
.colhead{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:4px 8px 8px}
.colrow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;
  font-size:12.5px;font-weight:600;cursor:pointer;width:100%;background:transparent;
  border:none;color:inherit;text-align:left}
.colrow:hover{background:var(--hover)}
.colrow input{width:14px;height:14px;accent-color:var(--green);flex:none}
.colrow.locked{cursor:default;color:var(--muted)}
.colrow.locked:hover{background:transparent}
.colrow .req{margin-left:auto;font-size:8px;font-weight:800;letter-spacing:.09em;
  color:var(--faint);background:var(--panel-2);border:1px solid var(--line);
  padding:2px 6px;border-radius:5px}
/* a device that does not report the chosen parameter is offered but marked -
   ticking it is allowed, and the column it adds is honestly all dashes */
.colrow .noda{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--faint)}
.colrow .swatch{width:9px;height:9px;border-radius:3px;flex:none}
.coldiv{height:1px;background:var(--line-soft);margin:6px 4px}
.colfoot{display:flex;gap:6px;padding:8px 4px 2px;border-top:1px solid var(--line-soft);margin-top:6px}
.colfoot button{flex:1;padding:6px 0;border-radius:7px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:11.5px;font-weight:700}
.colfoot button:hover{border-color:var(--line-hi);color:var(--text);background:var(--hover)}
.mpanel{width:214px;min-width:100%}
/* The rows are <label>s inside a .field, so the filter bar's own label rule
   reached them and set every option in tiny faint tracked-out caps - the voice
   reserved for the name ABOVE a control, printed inside it. Stated back. */
.mpanel .colrow{font-size:12.5px;font-weight:600;letter-spacing:0;
  text-transform:none;color:var(--text)}
.mpanel .colrow input{min-width:0}
.unit{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--faint)}

/* ---------- plant picker ---------- */
.pplant{width:268px;padding:7px;display:flex;flex-direction:column;gap:5px;
  max-height:min(60vh,320px);overflow-y:auto;scrollbar-width:thin}
.pcard{display:flex;flex-direction:column;gap:3px;min-width:0;width:100%;
  text-align:left;font-family:inherit;color:var(--text);
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:7px 10px}
.pcard:hover{background:var(--hover);border-color:var(--line-hi)}
.pcard.on{background:var(--sel);border-color:var(--line-hi)}
.pcard .top,.pcard .row{display:flex;align-items:baseline;gap:6px;min-width:0}
.pcard .nm{font-family:var(--serif);font-size:12.5px;font-weight:700;color:var(--text);
  line-height:1.15;white-space:nowrap}
.pcard.on .nm::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  margin-left:6px;vertical-align:middle;background:var(--line-hi)}
.pcard .ad{flex:1 1 0;min-width:0;text-align:right;font-size:9px;color:var(--faint);
  line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .cap{font-family:var(--mono);font-size:9.5px;font-weight:800;color:var(--text);white-space:nowrap}
.pcard .dv{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.05em;
  color:var(--faint);white-space:nowrap}

/* ---------- card ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.card .chead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:13px 16px 10px}
.chead .title{font-size:14.5px;font-weight:700;white-space:nowrap;flex:none}
.chead .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
/* The bucket switch, in the chart's head - the same control Monitoring puts
   there for its range, at the same size and with the same green for the one in
   force. A page's controls are read as one set across the app or not at all. */
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{padding:6px 11px;font-size:11.5px;font-weight:600;background:transparent;border:none;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--text);background:var(--hover)}
.seg button.on{background:var(--green-soft);color:var(--green)}
.seg button.on:hover{background:var(--green-soft)}
.seg button:not(:last-child){border-right:1px solid var(--line)}

/* ---------- legend ----------
   Identity is never colour alone: every chip carries the series name, and the
   SHAPE drawn in the chip is the shape the plot draws with - a square for the
   bar, a dot, a triangle. This note used to describe solid and dashed rules,
   which was Analysis's arrangement carried over; the marks here are filled
   shapes now, so the chips are too. */
.legend{display:flex;gap:7px;flex-wrap:wrap;min-width:0}
.lg{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2);font-size:12px;cursor:pointer;user-select:none;white-space:nowrap;flex:none}
.lg:hover{border-color:var(--line-hi)}
.lg.off{opacity:.38}
/* THE CHIP IS AN INLINE SVG, not a styled box. The marks stopped being things
   CSS can draw the moment simulated became a rule with a hollow dot ON it -
   that is two shapes in one chip - so the chip draws the same geometry the
   plot does and there is one place a mark is defined instead of two that have
   to be kept in step. --mkbg is the surface the hollow dot is cut out of, and
   each context sets it to whatever it is actually sitting on. */
.mk{display:block;width:17px;height:12px;flex:none;overflow:visible;--mkbg:var(--panel-2)}
.lg .n{color:var(--text);font-weight:700;font-family:var(--mono);font-size:11.5px}
.lg .p{color:var(--muted);font-weight:600;font-size:11px}

/* ---------- chart ---------- */
.chartwrap{position:relative;padding:4px 10px 14px}
/* DIRECT CHILD, not any descendant. This was .chartwrap svg, and it was
   harmless for as long as the only svg in here was the plot. The moment the
   tooltip started drawing its marks as inline svg it caught them too - .tip is
   inside .chartwrap - and width:100%;height:auto blew a 17x12 chip up to the
   300x150 an svg defaults to, so hovering a bar produced a tooltip the size of
   the card with two enormous shapes in it. The plot is a direct child; nothing
   else in here should be sized by this rule. */
.chartwrap>svg{width:100%;height:auto;display:block}
.gl{stroke:var(--line-soft);stroke-width:1}
.gl.v{stroke:var(--grid-v)}
.axt{fill:var(--faint);font-size:10.5px;font-family:var(--mono)}
.axtitle{fill:var(--muted);font-size:10.5px;font-family:var(--sans);font-weight:700;letter-spacing:.06em}
#xh{stroke:var(--text)}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--elev);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:150px;
  box-shadow:0 10px 26px -8px var(--shadow);z-index:5}
.tip .tt{font-family:var(--mono);font-weight:700;font-size:11px;color:var(--muted);margin-bottom:5px}
.tip .tr{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:2px 0}
.tip .tr b{margin-left:auto;font-family:var(--mono);color:var(--text);font-weight:700}
/* the state before a query is complete - the plot keeps its frame and says what
   is missing, rather than collapsing to a bare box */
.chartnote{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;color:var(--faint);font-family:var(--mono);font-size:12.5px;text-align:center;padding:0 20px}

/* ---------- table ---------- */
/* Cells are CENTRED. Numbers in a column read fastest right-aligned - the
   decimal points line up and magnitude is visible without reading a digit -
   so that is what these tables did. Centred is the house style now; the
   mono face keeps the digits on a common width, which is what stops a
   centred column of numbers from going ragged. */
.ttools{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;
  letter-spacing:.04em;background:transparent;border:1px solid var(--line);color:var(--muted)}
.tbtn:hover{color:var(--text);border-color:var(--line-hi);background:var(--hover)}
.tablewrap{overflow-x:auto}
table{width:100%;min-width:520px}
thead th{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:9px 16px;border-bottom:1px solid var(--line-soft);text-align:center;white-space:nowrap}
thead .grp th{border-bottom:none;padding-bottom:2px;font-size:11.5px;color:var(--text);letter-spacing:.06em}
/* the device name spans its parameter columns, so the pairing is structural */
thead .grp th.dev{text-align:center;border-bottom:1px solid var(--line-soft)}
/* the header the table keeps when nothing is ticked - stated, but plainly not a
   reading, so nobody mistakes the shape for content */
thead th.ph{color:var(--faint);font-weight:600}
tbody td{padding:9px 16px;font-family:var(--mono);font-size:12.5px;font-weight:600;text-align:center;
  border-bottom:1px solid var(--line-soft);color:var(--text);white-space:nowrap}
tbody td.ts{color:var(--muted);font-weight:600}
tbody td.nil{color:var(--faint)}
/* THE ROW UNDER THE POINTER LIFTS OFF THE TABLE. A tint alone was not enough on
   a table this wide - at 4.5% it was invisible, and even raised it only shaded a
   band the eye still slips out of. So the row is picked out the way every other
   raised surface in this portal is: its own ring, and a shadow under it. It
   reads as one object rather than as a row of separate cells, which is the point
   when a value has to be carried across ten columns.

   It marks where the POINTER is, so it clears the moment the pointer leaves and
   can never be mistaken for a selection that persists. The table's borders are
   separated rather than collapsed for it: a collapsed table draws one shared
   border between two rows, and a browser will not paint a shadow on a row that
   does not own its own edges. Only bottom borders are ever set here, so nothing
   doubles up and the table looks exactly as it did. */
table{border-collapse:separate;border-spacing:0}
tbody tr{transition:background-color .12s ease,box-shadow .12s ease}
tbody tr:hover{background:var(--row-hover);position:relative;z-index:1;
  box-shadow:inset 0 0 0 1px var(--line-hi),0 10px 22px -12px var(--shadow),0 2px 6px -4px var(--shadow)}
/* the readings come up to full strength with it; a dash stays a dash, because a
   cell with nothing in it has nothing to bring forward */
tbody tr:hover td:not(.nil){color:var(--text)}
/* the y2 half of a device's pair is ruled off from the y1 half, so a wide table
   does not read as one undifferentiated block of numbers */
thead th.sep, tbody td.sep{border-left:1px solid var(--line-soft)}
.empty-note{display:flex;align-items:center;justify-content:center;
  color:var(--faint);font-size:12.5px;font-family:var(--mono)}
.empty-note.tall{min-height:170px}
.colpick{position:relative;display:inline-flex}

/* ---------- pager ---------- */
.tfoot{display:flex;align-items:center;gap:16px;padding:11px 16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
/* THE ROWS-PER-PAGE CONTROL IS THE PAGE'S OWN DROPDOWN, not the browser's - the
   same move the header's refresh control made, for the same reason: this footer
   sat under a table drawn entirely by the app and then handed its one control to
   the operating system. These are the few things a footer-sized one needs said.

   IT OPENS UPWARD. .colpanel hangs below its button, which is right in a filter
   bar at the top of a card and wrong at the bottom of one - a list dropped
   downward from the last row of the page opens into the window's edge. */
.tfoot .psel{flex:none}
.tfoot .psel .mbtn{min-width:74px;height:30px;font-family:var(--mono);font-size:12px;
  justify-content:space-between}
.tfoot .psel .colpanel{top:auto;bottom:calc(100% + 6px);width:120px}
.tfoot .sp{margin-left:auto}
.pgbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.pgbtn:hover:not(:disabled){color:var(--text);border-color:var(--line-hi)}
.pgbtn:disabled{opacity:.35;cursor:default}
.tfoot .range{font-family:var(--mono)}

/* ---------- toasts ---------- */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--elev);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:9px;
  padding:10px 14px;font-size:12.5px;color:var(--text);box-shadow:0 12px 30px -8px var(--shadow);
  animation:tin .18s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:820px){
  .topbar{gap:12px;padding:0 14px}
  .wrap{padding:12px 14px 30px}
  .toprow{padding:12px 14px 0}
  .clock{display:none}
  .pair{border-right:none;padding-right:0;margin-right:0}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ---------- month picker ---------- */
.mpick{position:relative;display:inline-flex;flex-direction:column;justify-content:flex-end}
.mpick .fl{position:absolute;top:-6px;left:9px;padding:0 4px;background:var(--panel);z-index:1;
  font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.mpick-btn{display:flex;align-items:center;gap:10px;min-width:150px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);padding:8px 10px;
  font-size:12.5px;font-family:var(--mono);font-weight:600}
.mpick-btn:hover{border-color:var(--line-hi);background-color:var(--hover)}
.mpick-btn svg{margin-left:auto;color:var(--muted);flex:none}
.mpick-panel{position:absolute;top:calc(100% + 6px);right:0;z-index:80;width:250px;
  background:var(--elev);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 18px 44px -16px var(--shadow);padding:12px}
.mpick-panel[hidden]{display:none}
.mpick-head{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.mpick-head .yr{flex:1;text-align:center;font-family:var(--mono);font-weight:800;font-size:14px}
.mpick-head button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:13px;line-height:1}
.mpick-head button:hover{color:var(--text);border-color:var(--line-hi);background:var(--hover)}
.mpick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mpick-grid button{padding:9px 0;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--text);font-size:12.5px;font-weight:600}
.mpick-grid button:hover{border-color:var(--line-hi);background:var(--hover)}
/* selection is a surface, the same language the plant cards use */
.mpick-grid button.on{background:var(--sel);border-color:var(--line-hi);color:var(--text);font-weight:800}

/* the bucket switch is styled with .seg, up beside the card rules, because that
   is where the control it copies from Monitoring is defined */

/* ---------- the chart's own head ---------- */
.chead .metric{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--muted)}
.bench{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--faint);
  display:inline-flex;align-items:center;gap:6px}
.bench i{width:14px;height:0;border-top:2px dashed var(--faint);display:inline-block}

/* bars, not lines: the legend and the tooltip carry a square swatch to match
   what the chart actually draws */
/* the tooltip is a lifted surface, so a hollow mark inside it is cut out of
   that and not out of the card two layers down */
.tip .tr .mk{--mkbg:var(--elev)}

/* ---------- the row, spelled out in full ----------
   A table wider than the screen is read by scrolling sideways, and a row read
   sideways is a row half remembered: by the time the last column is on screen,
   the device name that started it is not. Hovering a row lifts the WHOLE of it
   out as a card - every column of that one row, label and value, in one place -
   so the reading is taken in a glance instead of in two swipes.

   It follows the pointer, it is never clickable, and it goes the moment the
   pointer leaves. It opens on every row, whether or not the table is currently
   wider than the screen - the same gesture has to give the same answer on a
   laptop as on a wall display, and a reader who learns it on one must not find
   it missing on the other. */
.rowpop{position:fixed;z-index:120;pointer-events:none;opacity:0;transition:opacity .12s ease;
  background:var(--elev);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  box-shadow:0 20px 48px -18px var(--shadow),0 3px 10px -6px var(--shadow);
  max-width:min(620px,92vw)}
.rowpop.on{opacity:1}
.rowpop .rp-h{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.05em;
  color:var(--text);padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line-soft)}
.rowpop .rp-g{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;align-items:baseline}
.rowpop .rp-g.two{grid-template-columns:auto 1fr auto 1fr}
.rowpop .rp-k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap}
.rowpop .rp-v{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text);
  text-align:right;white-space:nowrap}
/* a cell with nothing in it stays a dash, and says so quietly */
.rowpop .rp-v.nil{color:var(--faint);font-weight:600}
</style>

</script>
<script>
/* THE THEME, SET BEFORE THE FIRST PAINT.

   This runs in the head, ahead of the body, because the alternative is a white
   flash on every navigation for anybody who chose dark - the page would paint
   light, then the script would run, then it would repaint. A theme applied
   after the first frame is a theme the reader watches being applied.

   It is one key in localStorage, so the choice carries from Home to Alarms to
   Settings rather than being made again on each. The sign-in and the site
   overview never read it: they are the void either way.

   LIGHT IS THE DEFAULT AGAIN, AND DARK IS THE CHOICE. For one revision it was
   the other way round: the portal opened dark, so that sign-in, globe and
   portal read as one night-sky room the whole way through. Light was asked for
   as the state people land in, so the portal opens daylit and the switch in the
   header is there for anybody who wants the dark half of the palette. The
   sign-in and the globe are still the void - only the portal behind them moved.

   THE DEFAULT IS STILL ON THE TAG, NOT IN THIS SCRIPT. <html> carries no
   data-theme, and no data-theme IS light; all this line does is PUT dark on for
   somebody who chose it. That leaves the try/catch on the right side: a browser
   with storage blocked cannot read anybody's choice, so it opens in the
   default, which is the theme the page says it is. */
(function(){
  var KEY='enerops-theme', root=document.documentElement;
  try{ if(localStorage.getItem(KEY)==='dark') root.setAttribute('data-theme','dark'); }catch(e){}
  function say(){
    var b=document.getElementById('themebtn');
    if(!b) return;
    /* the button names WHAT IT WILL DO, not where you are */
    var t = root.getAttribute('data-theme')==='dark' ? 'Switch to light' : 'Switch to dark';
    b.title=t; b.setAttribute('aria-label',t);
  }
  window.toggleTheme=function(){
    var dark = root.getAttribute('data-theme')==='dark';
    if(dark) root.removeAttribute('data-theme'); else root.setAttribute('data-theme','dark');
    try{ localStorage.setItem(KEY, dark?'light':'dark'); }catch(e){}
    say();
  };
  document.addEventListener('DOMContentLoaded', say);
})();
</script>

        <div class="acctdiv"></div>
        <a class="acctitem" role="menuitem" href="settings.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.1 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09A1.7 1.7 0 0 0 21 10.1a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg> Settings</a>
        <a class="acctitem out" role="menuitem" href="login.html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 16.5v1.8a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2V5.7a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1.8"/><path d="M19.8 12H9.4m10.4 0-3.2-3.2M19.8 12l-3.2 3.2"/></svg> Sign out</a>
      </div>

</header>

<!-- ======================= FILTER BAR =======================
     No APPLY: every control re-reads on change, so the tiles, the chart and the
     table always describe what the bar says. Refresh defaults to OFF - a KPI
     over a month does not move while you read it.

     ONE PLANT. The three bars in the chart are Actual, Simulated and Forecast -
     the same reading measured, modelled and predicted - so the plant has to be
     fixed for them to mean anything. Comparing sites is what the portfolio
     tiles on Home are for; this page is one site examined closely. -->
<div class="toprow">

    <!-- NO PLANT FIELD. Which site this page is showing is stated in the bar

      <!-- Two buckets, two questions: DAY is "what happened this month" and
           MONTH is "how is the year going". Weekly sat between them answering

           moved every time the month started on a different weekday, and the

  <!-- ======================= THE GRAPH'S DATA =======================
       Exactly what the chart is drawing, one row per bucket - not a second

  <div class="card">
    <div class="chead"><div class="title" id="tb-title">KPI Data</div></div>
    <div class="ttools">
      <!-- FILTER, not COLUMNS. The button named the mechanism - it ticks columns

      <div class="colpick" id="colpick">

</div>

<div id="toasts"></div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- toasts ---------- */
window.T=function(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  $('toasts').appendChild(t);setTimeout(()=>t.remove(),2600);return false;
};

/* ---------- theme ----------
   TWO THEMES, ONE SWITCH, AND NONE OF IT RUNS HERE.

   This note used to read "THERE IS NO TOGGLE, AND THERE IS NO DARK" - the
   portal had been cut back to the light palette on purpose. Dark came back and
   the note did not, so the file said the opposite of what it did.

   The argument it made is still worth answering rather than deleting: it held
   that a second theme is a second answer to a settled question. The question is
   not settled. The sign-in and the globe are a void, the portal is entered
   through them, and a portal that opens white behind a night sky is a seam the
   reader can see. So there are two, the portal opens DARK, and light is what
   the switch is for.

   The apply-before-first-paint and the toggle both live in the HEAD script, up
   with the tokens they act on. A theme applied by this script - which runs at
   the bottom of the body - is a theme the reader watches being applied. */
/* ---------- account menu ---------- */
window.toggleAcct=function(e){
  e.stopPropagation();
  const a=$('acct'), open=a.classList.toggle('open');
  $('acctbtn').setAttribute('aria-expanded', open?'true':'false');
};
document.addEventListener('click',function(){
  const a=$('acct'); if(!a) return;
  a.classList.remove('open'); $('acctbtn').setAttribute('aria-expanded','false');
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  const a=$('acct'); if(!a||!a.classList.contains('open')) return;
  a.classList.remove('open'); $('acctbtn').setAttribute('aria-expanded','false'); $('acctbtn').focus();
});


/* ---------- clock ---------- */
const START_T=12+10/60+3/3600, t0=Date.now();
const nowT=()=>START_T+(Date.now()-t0)/3600000;
function fmtClock(t,withS){t=((t%24)+24)%24;let h=Math.floor(t),m=Math.floor((t-h)*60),s=Math.floor((t*3600)%60);
  const ap=h<12?'AM':'PM';let hh=h%12;if(hh===0)hh=12;
  return hh+':'+pad(m)+(withS?(':'+pad(s)):'')+' '+ap;}
$('clk').textContent=fmtClock(nowT(),true);
setInterval(function(){ $('clk').textContent=fmtClock(nowT(),true); },1000);
$('refresh-sel').addEventListener('change',function(){
  const off=this.value==='off';
  $('livedot').style.animationPlayState=off?'paused':'running';
  $('livedot').style.opacity=off?.35:1;
  /* the toast repeats the interval rather than saying only that it is on:
     the value is the thing that was just chosen, so it is the thing to confirm */
  T(off?'Live refresh paused':'Live refresh · every '+(Number(this.value)/60)+' min');
});
$('livedot').style.animationPlayState='paused'; $('livedot').style.opacity=.35;

/* =======================================================================
   PLANTS, PERIOD, METRICS
   ======================================================================= */
const PLANTS=[
  {id:'Sangria', ac:2500, dc:2500},
  {id:'Rioja',   ac:1800, dc:1885},
  {id:'Mendoza', ac:3200, dc:3360}
];
const PIDX=id=>Math.max(0,PLANTS.map(p=>p.id).indexOf(id));
const plant=()=>$('pl-sel').value;

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July',
            'August','September','October','November','December'];
const TODAY={y:2026,m:7,d:14};                 /* the demo's today */
let PY=TODAY.y, PM=TODAY.m, GRAN='day';
const dim=(y,m)=>new Date(y,m+1,0).getDate();
/* is this bucket in the past, in progress, or still to come? */
const cmpDay=(y,m,d)=> (y!==TODAY.y?y-TODAY.y : m!==TODAY.m?m-TODAY.m : d-TODAY.d);

const METRICS=[
  {k:'PR',     t:'Performance Ratio', u:'%',       f:x=>x.pr,     dec:1},
  {k:'CUF',    t:'Capacity Factor',   u:'%',       f:x=>x.cuf,    dec:1},
  {k:'AVAIL',  t:'Availability',      u:'%',       f:x=>x.avail,  dec:1},
  {k:'YIELD',  t:'Specific Yield',    u:'kWh/kWp', f:x=>x.yield,  dec:2},
  {k:'ENERGY', t:'Energy',            u:'kWh',     f:x=>x.energy, dec:0},
  {k:'IRR',    t:'Irradiation',       u:'kWh/m²',  f:x=>x.irr,    dec:2}
];
const metOf=k=>METRICS.filter(m=>m.k===k)[0];
const met=()=>metOf($('met-sel').value)||METRICS[0];

/* =======================================================================
   THE READINGS - measured, modelled, predicted

   ACTUAL     what the plant did. Nothing after today has one.
   SIMULATED  what the design model says the plant should have done in that
              day's weather. This is the benchmark the page compares against,
              and it is the reason the comparison is worth anything: a KPI
              against last month cannot tell a dull month from a sick plant.
   FORECAST   what it is expected to do. Only ahead of today - a forecast for
              a day already measured is a number nobody would act on.

   Everything is DERIVED from two facts per day: the sun it had, and how well
   the plant converted it. Energy is never invented separately from irradiation,
   so the table cannot show a plant making more than the weather allowed.
   ======================================================================= */
function rnd(seed){ let s=seed>>>0; return function(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }
const seedOf=s=>String(s).split('').reduce((h,c)=>(h*31+c.charCodeAt(0))&0xffff,7);

function reading(pid,y,m,d,kind){
  const p=PLANTS[PIDX(pid)];
  const r=rnd(seedOf(pid)*7919+y*1000+m*40+d+(kind==='sim'?101:kind==='fc'?202:0));
  const doy=new Date(y,m,d).getTime()/86400000%365;
  const season=5.9+1.5*Math.sin((doy-40)/365*2*Math.PI);
  const monsoon=(m>=5&&m<=8)?0.74:1;

  if(kind==='sim'){
    /* the model gets the season and the monsoon but not that day's cloud: it is
       what the site was SOLD as doing, not what the sky did */
    const irr=Math.max(0.6,season*monsoon*0.95);
    const pr=0.822-(m>=3&&m<=6?0.03:0);
    const energy=irr*p.dc*pr;
    return {irr:irr, pr:pr*100, avail:99.5, energy:energy, yield:energy/p.dc, cuf:energy/(p.ac*24)*100};
  }
  const cloud=0.72+0.28*Math.min(1,r()*1.35);
  const irr=Math.max(0.6,season*monsoon*cloud);
  const avail=kind==='fc'?99.0:Math.min(100,96.4+3.6*r());
  const pr=Math.max(0.55,Math.min(0.87,0.815-(m>=3&&m<=6?0.035:0)-0.05*(1-cloud)+0.02*(r()-0.5)))*(avail/100);
  const energy=irr*p.dc*pr;
  return {irr:irr, pr:pr*100, avail:avail, energy:energy, yield:energy/p.dc, cuf:energy/(p.ac*24)*100};
}
/* A bucket bigger than a day is its days ROLLED UP, never a second simulation:
   the daily view and the monthly view of the same month must agree to the last
   kWh, or the page has two answers to one question. */
function roll(pid,days,kind){
  const p=PLANTS[PIDX(pid)];
  let e=0,irr=0,av=0,prw=0,n=0;
  days.forEach(function(dt){
    const x=reading(pid,dt[0],dt[1],dt[2],kind);
    e+=x.energy; irr+=x.irr; av+=x.avail; prw+=x.pr*x.irr; n++;
  });
  if(!n) return null;
  return {
    irr:irr, energy:e, avail:av/n,
    /* PR over a period is weighted by the sun each day actually had - a plain
       mean lets a bright day and an overcast one count equally */
    pr:prw/irr, yield:e/p.dc, cuf:e/(p.ac*24*n)*100, days:n
  };
}

/* ---------- the buckets of the chosen period ---------- */
function buckets(){
  const out=[];
  if(GRAN==='day'){
    const last=dim(PY,PM);
    for(let d=1;d<=last;d++)
      out.push({key:d, label:pad(d)+' '+MON[PM], stamp:pad(d)+'.'+pad(PM+1)+'.'+PY, days:[[PY,PM,d]]});
  }else{
    for(let m=0;m<12;m++){
      const last=dim(PY,m), days=[];
      for(let i=1;i<=last;i++) days.push([PY,m,i]);
      out.push({key:m, label:MON[m], stamp:MON[m]+' '+PY, days:days});
    }
  }
  return out;
}
/* how much of a bucket is already measured */
function split(b){
  const past=b.days.filter(dt=>cmpDay(dt[0],dt[1],dt[2])<=0);
  const future=b.days.filter(dt=>cmpDay(dt[0],dt[1],dt[2])>0);
  return [past,future];
}

let ROWS=[];
function buildRows(){
  const pid=plant();
  ROWS=buckets().map(function(b){
    const parts=split(b);
    return {
      key:b.key, label:b.label, stamp:b.stamp,
      /* a bucket only half elapsed reports what HAS happened - the rest of it
         is the forecast's business, and mixing the two would be a number that
         is neither */
      actual:   parts[0].length?roll(pid,parts[0],'act'):null,
      simulated:roll(pid,b.days,'sim'),
      forecast: parts[1].length?roll(pid,parts[1],'fc'):null,
      partial:  parts[0].length>0&&parts[1].length>0
    };
  });
}

/* =======================================================================
   THE SERIES
   ======================================================================= */
/* THREE READINGS, THREE MARKS - and the mark says which kind of claim it is.

   ACTUAL is measured, so it is a BAR: a bar sits on the baseline and its height
   is the whole of it, which is how a quantity that happened should read.
   SIMULATED is a LINE THAT CARRIES A HOLLOW DOT ON EVERY BUCKET.
   FORECAST is a FILLED TRIANGLE per bucket, and no line at all.

   IT WAS A SOLID RULE AND A DASHED RULE, and both were read over the bars
   rather than beside them. Over a bar chart a stroke is the worst place to put
   a distinction: it crosses the bars at a shallow angle, the dashes land in the
   gaps as often as on the bars, and at 31 daily buckets the two rules are thin
   lines a few pixels apart. Telling them apart meant reading the colour, which
   is the one thing a mark is supposed to spare you.

   The two now differ by FORM, and the form also says what kind of claim each
   one is making.

   Simulated keeps its line because a model IS continuous - it has a value for
   every day whether or not anybody looks - and the line is what lets it be read
   against the bars in one sweep. The dots are what the bare rule was missing:
   they put a mark on each bucket, so the line can be read value by value and
   not only as a shape. They are HOLLOW so the bar underneath shows through the
   middle; a filled dot at this size covers the top of its own bar.

   Forecast gets no line, and that is the whole of the difference. A forecast is
   a set of separate estimates, not a curve through anything that happened, and
   drawing it as a broken version of the simulated rule said "the same thing,
   less certain" when it is a different thing. Triangles say it once, with a
   shape that survives at 4px, in greyscale, and for a reader who cannot
   separate blue from amber - and a bucket with no forecast simply has no
   triangle, where a broken stroke had to be interpreted. */
const SERIES=[
  {k:'actual',    t:'Actual',    col:'var(--green)', mark:'bar'},
  {k:'simulated', t:'Simulated', col:'var(--blue)',  mark:'line'},
  {k:'forecast',  t:'Forecast',  col:'var(--amber)', mark:'tri'}
];
/* THE LEGEND AND THE TOOLTIP DRAW WHAT THE PLOT DRAWS. Same geometry, one
   viewBox wide enough to hold the rule the dot sits on; the bar answers with a
   square, because a chip is not tall enough to be a bar. */
const MARKI=function(s){
  const c=s.col, o='<svg class="mk" viewBox="0 0 17 12" aria-hidden="true">';
  if(s.mark==='bar') return o+'<rect x="3.5" y="1" width="10" height="10" rx="2.5" fill="'+c+'"/></svg>';
  if(s.mark==='tri') return o+'<path d="M8.5 1.4L14.3 10.2H2.7Z" fill="'+c+'"/></svg>';
  return o+'<path d="M1 6h15" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/>'+
         '<circle cx="8.5" cy="6" r="3.1" fill="var(--mkbg)" stroke="'+c+'" stroke-width="1.8"/></svg>';
};
/* off, not on: a series switched off stays off while you change the metric */
const OFF={actual:false,simulated:false,forecast:false};
const live=()=>SERIES.filter(s=>!OFF[s.k]);
const val=(row,sk)=>{ const r=row[sk]; return r?met().f(r):null; };

function renderLegend(){
  $('legend').innerHTML=SERIES.map(function(s){
    return '<span class="lg'+(OFF[s.k]?' off':'')+'" data-s="'+s.k+'" title="Click to hide or show">'+
      MARKI(s)+'<span class="n">'+s.t+'</span></span>';
  }).join('');
  $('legend').querySelectorAll('.lg').forEach(function(el){
    el.onclick=function(){
      OFF[el.dataset.s]=!OFF[el.dataset.s];
      /* the last visible series cannot be switched off - an empty plot is not
         a view anybody asked for */
      if(!live().length){ OFF[el.dataset.s]=false; T('At least one series stays on'); }
      renderLegend(); drawChart();
    };
  });
}

/* =======================================================================
   CHART
   ======================================================================= */
let W=1300,H=300;
const ML=64,MR=18,MT=14,MB=38;
let PW=W-ML-MR, PH=H-MT-MB, SLOT=0, TOP=1;
/* Height tracks width but stays in a band, as on Monitoring - except that this
   page has no side rail, so the card is the full width of the screen and the
   same ratio buys a plot half a screen tall. A month is at most 31 bars; the
   height only has to separate them, not fill the window. */
function fitChart(force){
  const box=$('chartwrap');
  const cw=Math.max(320,Math.round(box.clientWidth-20));
  const nh=Math.round(Math.min(330,Math.max(215,cw*0.20)));
  if(!force&&cw===W&&nh===H) return false;
  W=cw;H=nh;PW=W-ML-MR;PH=H-MT-MB;
  $('chart').setAttribute('viewBox','0 0 '+W+' '+H);
  return true;
}
const Y=v=>MT+PH-(v/TOP)*PH;
function niceTop(v){
  if(!(v>0)) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  return Math.ceil(v/p*1.08)*p;
}
const trim=(v,d)=>Number(v).toFixed(v>=1000?0:(d==null?1:d));
/* A triangle CENTRED on the point, not standing on it. Apex at -s and base at
   +s/2 puts the centroid exactly on the value, which is where the dot's centre
   is - so the two series are read off the same line rather than one sitting
   half a mark high. Half-width 0.866s makes it equilateral, and s = 1.5r gives
   it about the same ink as a dot of radius r, so neither reads as the heavier
   series. */
const triPath=(x,y,s)=>'M'+x.toFixed(1)+' '+(y-s).toFixed(1)+
  'L'+(x+s*0.866).toFixed(1)+' '+(y+s*0.5).toFixed(1)+
  'L'+(x-s*0.866).toFixed(1)+' '+(y+s*0.5).toFixed(1)+'Z';

function drawChart(){
  const m=met(), ser=live();
  $('ch-title').textContent=m.t;
  $('tb-title').textContent=m.t+' · Data';
  const vals=[];
  ROWS.forEach(r=>ser.forEach(s=>{const v=val(r,s.k); if(v!=null&&isFinite(v)) vals.push(v);}));
  const note=$('chartnote');
  if(!ROWS.length||!vals.length){
    $('axes').innerHTML=''; $('bars').innerHTML='';
    note.hidden=false; note.textContent='Nothing to plot for this period';
    return;
  }
  note.hidden=true;
  TOP=niceTop(Math.max.apply(null,vals));
  SLOT=PW/ROWS.length;

  let ax='';
  for(let i=0;i<=5;i++){
    const v=TOP/5*i, y=Y(v);
    ax+='<line class="gl" x1="'+ML+'" y1="'+y.toFixed(1)+'" x2="'+(W-MR)+'" y2="'+y.toFixed(1)+'"/>'+
        '<text class="axt" x="'+(ML-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+trim(v,m.dec)+'</text>';
  }
  /* the y axis names what it measures and in what: PR read as 0.79 against PR
     read as 79% is exactly the confusion worth 10px of label */
  ax+='<g transform="translate(13,'+(MT+PH/2)+') rotate(-90)">'+
      '<text class="axtitle" x="0" y="0" text-anchor="middle">'+esc(m.t.toUpperCase())+
      (m.u?' &middot; '+esc(m.u):'')+'</text></g>';
  const every=SLOT<26?Math.ceil(26/SLOT):1;
  ROWS.forEach(function(b,i){
    if(i%every) return;
    ax+='<text class="axt" x="'+(ML+SLOT*i+SLOT/2).toFixed(1)+'" y="'+(MT+PH+16)+'" text-anchor="middle">'+
        esc(b.label)+'</text>';
  });
  ax+='<text class="axt" x="'+(ML+PW/2)+'" y="'+(MT+PH+32)+'" text-anchor="middle" opacity=".75">'+
      (GRAN==='month'?(PY+' · MONTH'):(MONL[PM]+' '+PY+' · DAY'))+'</text>';
  $('axes').innerHTML=ax;

  let g='';
  /* THE BARS FIRST, so the modelled lines are read ON them rather than behind
     them. Actual is the only series drawn as a quantity; it gets the middle of
     the slot and a width that stops growing once a bar is wide enough to read. */
  const actual=ser.filter(function(s){return s.mark==='bar';})[0];
  if(actual){
    const abw=Math.max(3,Math.min(26,SLOT*0.52));
    ROWS.forEach(function(b,i){
      const v=val(b,actual.k);
      if(v==null||!isFinite(v)) return;
      const x=ML+SLOT*i+(SLOT-abw)/2, y=Y(v), h=Math.max(1,MT+PH-y);
      g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+abw.toFixed(1)+
         '" height="'+h.toFixed(1)+'" rx="2" fill="'+actual.col+'" opacity=".92"/>';
    });
  }
  /* and then the modelled series, through the middle of each slot.

     THE MARK GROWS WITH THE SLOT AND THEN STOPS. At 31 daily buckets it has to
     fit between its neighbours; at 12 monthly ones it should not swell into a
     blob. The band is the whole of the sizing rule, and the dot's stroke is cut
     with it so the hollow middle survives at the small end instead of closing
     up into a blot.

     A GAP IS A GAP. The simulated rule BREAKS where a bucket has no value
     rather than being drawn straight across it, and the forecast simply has no
     triangle there - so a forecast that starts halfway through the month starts
     halfway across the plot.

     The line is laid down before the marks that sit on it, and the triangles
     are outlined in the CARD's own colour: the halo IS the background, so a
     triangle and a dot that land on the same value stay two marks instead of
     merging, and the outline disappears against the card in both themes
     without a second token to keep in step. */
  const r=Math.max(2.8,Math.min(5.4,SLOT*0.17));
  ser.filter(function(s){return s.mark!=='bar';}).forEach(function(s){
    if(s.mark==='line'){
      let d='', pen=false;
      ROWS.forEach(function(b,i){
        const v=val(b,s.k);
        if(v==null||!isFinite(v)){ pen=false; return; }
        d+=(pen?'L':'M')+(ML+SLOT*i+SLOT/2).toFixed(1)+' '+Y(v).toFixed(1)+' ';
        pen=true;
      });
      if(d) g+='<path d="'+d.trim()+'" fill="none" stroke="'+s.col+'" stroke-width="2"'+
               ' stroke-linejoin="round" stroke-linecap="round"/>';
    }
    ROWS.forEach(function(b,i){
      const v=val(b,s.k);
      if(v==null||!isFinite(v)) return;
      const x=ML+SLOT*i+SLOT/2, y=Y(v);
      g+= s.mark==='tri'
        ? '<path d="'+triPath(x,y,r*1.5)+'" fill="'+s.col+'" stroke="var(--panel)"'+
          ' stroke-width="1" stroke-linejoin="round"/>'
        : '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(1)+
          '" fill="var(--panel)" stroke="'+s.col+'" stroke-width="'+
          Math.min(1.8,r*0.56).toFixed(2)+'"/>';
    });
  });
  $('bars').innerHTML=g;
}

/* ---------- hover: read every live series for the bucket under the pointer ---
   The same rule Home's KPI chart uses - the whole slot highlights, and the tip
   lists each series with its own swatch - so the two pages are read the same
   way even though one is a summary and this one is the detail. */
(function(){
  const svg=$('chart'), tip=$('tip'), hl=$('hl'), wrap=$('chartwrap');
  const hide=function(){ tip.style.opacity=0; hl.setAttribute('opacity','0'); };
  const row=(s,v,dim)=>'<div class="tr"'+(dim?' style="opacity:.7"':'')+
    '>'+MARKI(s)+s.t+'<b>'+v+'</b></div>';
  svg.addEventListener('mousemove',function(e){
    if(!ROWS.length||!SLOT){ hide(); return; }
    const r=svg.getBoundingClientRect();
    const vx=(e.clientX-r.left)/r.width*W, vy=(e.clientY-r.top)/r.height*H;
    if(vx<ML||vx>W-MR||vy<MT||vy>MT+PH){ hide(); return; }
    let i=Math.floor((vx-ML)/SLOT); i=Math.max(0,Math.min(ROWS.length-1,i));
    const b=ROWS[i], m=met(), cx=ML+(i+0.5)*SLOT;
    hl.setAttribute('x',(ML+SLOT*i).toFixed(1)); hl.setAttribute('y',MT);
    hl.setAttribute('width',SLOT.toFixed(1)); hl.setAttribute('height',PH.toFixed(1));
    hl.setAttribute('opacity','1');
    let rows='', peak=0;
    live().forEach(function(s){
      const v=val(b,s.k);
      if(v==null) return;
      peak=Math.max(peak,v);
      rows+=row(s,trim(v,m.dec)+' '+m.u,s.k==='forecast');
    });
    if(!rows){ hide(); return; }
    /* a half-elapsed bucket says so, rather than looking like a bad day */
    tip.innerHTML='<div class="tt">'+esc(b.stamp)+(b.partial?' · in progress':'')+'</div>'+rows;
    const wr=wrap.getBoundingClientRect(), ox=r.left-wr.left, oy=r.top-wr.top;
    let lx=(cx/W)*r.width+ox+14; if(lx+180>wr.width) lx-=200;
    tip.style.left=lx+'px';
    tip.style.top=Math.max(4,(Y(peak)/H)*r.height+oy-10)+'px';
    tip.style.opacity=1;
  });
  svg.addEventListener('mouseleave',hide);
})();

/* =======================================================================
   TABLE - the graph's data, nothing else
   ======================================================================= */
const COLDEF=[
  {k:'stamp', t:'Timestamp', cls:'ts', get:r=>r.stamp},
  {k:'actual',    t:'Actual',    get:r=>cell(r,'actual')},
  {k:'simulated', t:'Simulated', get:r=>cell(r,'simulated')},
  {k:'forecast',  t:'Forecast',  get:r=>cell(r,'forecast')}
];
function cell(r,sk){ const v=val(r,sk); return v==null?'—':trim(v,met().dec); }
const SORTV={stamp:r=>r.key, actual:r=>val(r,'actual'), simulated:r=>val(r,'simulated'),
             forecast:r=>val(r,'forecast')};
let SORT={k:'stamp',dir:1}, PAGE=0, PER=100;

/* Timestamp is locked: a KPI row without the bucket it covers is not a reading.
   The rest are the three series, so the picker and the legend narrow the same
   dataset from two directions. */
let COLS=['actual','simulated','forecast'];
const shown=()=>COLDEF.filter(c=>c.k==='stamp'||COLS.indexOf(c.k)>=0);

function renderColPanel(){
  $('colpanel').innerHTML=
    '<div class="colhead">Shown in the table and the export</div>'+
    '<label class="colrow locked"><input type="checkbox" checked disabled>Timestamp'+
      '<span class="req">REQUIRED</span></label>'+
    '<div class="coldiv"></div>'+
    SERIES.map(function(s){
      return '<label class="colrow"><input type="checkbox"'+(COLS.indexOf(s.k)>=0?' checked':'')+
        ' onchange="colSet(\''+s.k+'\',this.checked)">'+
        '<span class="swatch" style="background:'+s.col+'"></span>'+s.t+'</label>';
    }).join('')+
    '<div class="colfoot">'+
      '<button type="button" onclick="colAll(1)">All</button>'+
      '<button type="button" onclick="colAll(0)">None</button></div>';
}
window.colToggle=function(ev){
  ev.stopPropagation();
  const p=$('colpanel'), open=p.hidden;
  if(open) renderColPanel();
  p.hidden=!open;
  $('colbtn').setAttribute('aria-expanded',open?'true':'false');
};
function colClose(){ $('colpanel').hidden=true; $('colbtn').setAttribute('aria-expanded','false'); }
window.colSet=function(k,on){
  const i=COLS.indexOf(k);
  if(on&&i<0) COLS.push(k); else if(!on&&i>=0) COLS.splice(i,1);
  COLS.sort((a,b)=>SERIES.map(s=>s.k).indexOf(a)-SERIES.map(s=>s.k).indexOf(b));
  if(!shown().some(c=>c.k===SORT.k)){ SORT.k='stamp'; SORT.dir=1; }
  renderTable();
};
window.colAll=function(on){
  COLS=on?SERIES.map(s=>s.k):[];
  if(!shown().some(c=>c.k===SORT.k)){ SORT.k='stamp'; SORT.dir=1; }
  renderColPanel(); renderTable();
};
document.addEventListener('click',function(e){ if(!$('colpick').contains(e.target)) colClose(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') colClose(); });

function sorted(){
  const f=SORTV[SORT.k], d=SORT.dir;
  return ROWS.slice().sort(function(a,b){
    const x=f(a), y=f(b);
    /* a bucket with no reading sorts last either way - it is not a small value,
       it is an absent one */
    if(x==null&&y==null) return 0;
    if(x==null) return 1;
    if(y==null) return -1;
    if(x<y) return -1*d; if(x>y) return 1*d; return 0;
  });
}
const ARROW=d=>'<span class="ar">'+(d<0?'▼':'▲')+'</span>';
function renderTable(){
  const cols=shown(), rows=sorted();
  /* Nothing ticked, or nothing to show: the table states its SHAPE and says so
     plainly, which is what Analysis does. Timestamp is locked on, so with every
     series unticked the alternative is a column of dates alone in a wide card -
     a list wearing a table's clothes. The greyed header is the contract; the note
     underneath is why it is empty. */
  const blank=cols.length===1||!rows.length;
  if(blank){
    $('thead').innerHTML='<tr><th class="ts">Timestamp</th>'+
      SERIES.map(s=>'<th class="ph">'+esc(s.t)+'</th>').join('')+'</tr>';
    $('tbody').innerHTML='<tr><td colspan="'+(SERIES.length+1)+'"><div class="empty-note tall">'+
      (!rows.length?'Nothing in this period':'No columns selected')+'</div></td></tr>';
    $('range').textContent='0-0 of 0';
    $('prev').disabled=true; $('next').disabled=true;
    return;
  }
  const pages=Math.max(1,Math.ceil(rows.length/PER));
  if(PAGE>=pages) PAGE=pages-1;
  const from=PAGE*PER, slice=rows.slice(from,from+PER);
  $('thead').innerHTML='<tr>'+cols.map(function(c){
    const on=SORT.k===c.k;
    return '<th class="so'+(c.cls?' '+c.cls:'')+(on?' on':'')+'" onclick="sortBy(\''+c.k+'\')" title="Sort by '+esc(c.t)+'">'+
      esc(c.t)+(on?ARROW(SORT.dir):'')+'</th>';
  }).join('')+'</tr>';
  $('tbody').innerHTML=slice.map(r=>'<tr>'+
    cols.map(c=>'<td'+(c.cls?' class="'+c.cls+'"':'')+'>'+esc(c.get(r))+'</td>').join('')+'</tr>').join('');
  $('range').textContent=(from+1)+'-'+Math.min(from+PER,rows.length)+' of '+rows.length;
  $('prev').disabled=PAGE<=0;
  $('next').disabled=from+PER>=rows.length;
}
window.sortBy=function(k){
  if(SORT.k===k) SORT.dir=-SORT.dir; else { SORT.k=k; SORT.dir=k==='stamp'?1:-1; }
  PAGE=0; renderTable();
};
window.pageBy=function(d){ PAGE=Math.max(0,PAGE+d); renderTable(); };
$('per').addEventListener('change',function(){ PER=parseInt(this.value,10); PAGE=0; renderTable(); });

window.exportCsv=function(){
  const cols=shown(), m=met();
  const q=s=>/[",\r\n]/.test(String(s))?'"'+String(s).replace(/"/g,'""')+'"':String(s);
  /* the header carries the metric and its unit: a column of numbers headed
     "Actual" in a file opened next week says nothing about what was measured */
  const head=cols.map(c=>q(c.k==='stamp'?c.t:c.t+' '+m.k+(m.u?' ('+m.u+')':''))).join(',');
  const body=sorted().map(r=>cols.map(c=>q(c.get(r))).join(','));
  const url=URL.createObjectURL(new Blob(['﻿'+[head].concat(body).join('\r\n')],
    {type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');
  a.href=url;
  a.download='KPI_'+plant()+'_'+m.k+'_'+PY+(GRAN==='month'?'':'-'+pad(PM+1))+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),0);
  T('Exported '+body.length+' rows');
};

const PICKS=[];
function pickClose(except){ PICKS.forEach(function(p){ if(p!==except) p.close(); }); }
document.addEventListener('click',function(){ pickClose(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') pickClose(); });

function singleSelect(o){
  const el=$(o.value), mount=$(o.mount);
  const btn=document.createElement('button');
  btn.type='button'; btn.className='mbtn'; btn.setAttribute('aria-expanded','false');
  if(o.title) btn.title=o.title;
  const lab=document.createElement('span'); lab.className='mlab'; btn.appendChild(lab);
  const pan=document.createElement('div'); pan.className='colpanel mpanel'; pan.hidden=true;
  mount.appendChild(btn); mount.appendChild(pan);
  /* `dim` marks a value that is a STATE rather than a choice - the header's
     Off - so the label can say so in the same voice the live dot does */
  function paint(){
    lab.textContent=o.render?o.render(el.value):el.value;
    lab.className='mlab'+(o.dim&&o.dim(el.value)?' off':'');
  }
  function draw(){
    pan.innerHTML='<div class="colhead">'+esc(o.head)+'</div>'+
      o.options.map(function(v){
        return '<label class="colrow"><input type="radio" name="'+o.value+'-r" value="'+esc(v)+'"'+
          (v===el.value?' checked':'')+'>'+esc(o.render?o.render(v):v)+
          (o.unit?'<span class="unit">'+esc(o.unit(v))+'</span>':'')+'</label>';
      }).join('');
  }
  const api={close:function(){ if(!pan.hidden) open(false); }, repaint:paint};
  function open(on){
    if(on){ pickClose(api); draw(); }
    pan.hidden=!on; mount.classList.toggle('open',on);
    btn.setAttribute('aria-expanded',on?'true':'false');
  }
  btn.addEventListener('click',function(e){ e.stopPropagation(); open(pan.hidden); });
  pan.addEventListener('click',function(e){ e.stopPropagation(); });
  pan.addEventListener('change',function(e){
    const r=e.target; if(r.type!=='radio') return;
    el.value=r.value; paint(); open(false);
    el.dispatchEvent(new Event('change',{bubbles:true}));
  });
  PICKS.push(api); paint();
  return api;
}

/* one KPI at a time: the three bars are one reading measured, modelled and

singleSelect({mount:'met-pick',value:'met-sel',head:'KPI metric',

/* ================= WHICH SITE THE PORTAL IS ON =================
   ONE site, chosen ONCE, on the Sites screen.

   This page used to choose its own, from a picker in the bar below, and so did
   three others. Four pickers is four answers to a question that has one, and
   nothing kept them in step - the site overview already exists to answer "which
   site", and answering it a second time is how a portal ends up disagreeing
   with itself.

   So the pickers are gone, and this is the whole of what replaced them:
   ?plant= wins, because a link that names a site is explicit; otherwise the
   last choice stands, which is what carries the choice from page to page;
   otherwise the first site there is. The answer is printed in the bar, so no
   page is ever showing a site it has not named. */
function siteNow(ids){
  const q=new URLSearchParams(location.search).get('plant');
  let last=null; try{ last=localStorage.getItem('enerops-plant'); }catch(e){}
  const id = ids.indexOf(q)>=0 ? q : (ids.indexOf(last)>=0 ? last : ids[0]);
  try{ localStorage.setItem('enerops-plant',id); }catch(e){}
  const el=document.getElementById('site-now'); if(el) el.textContent=id;
  return id;
}

function initMonthPick(id,y,m,onPick){
  const root=$(id), btn=root.querySelector('.mpick-btn'), pan=root.querySelector('.mpick-panel');
  const head=root.querySelector('.mpick-head'), grid=root.querySelector('.mpick-grid');
  const lab=btn.querySelector('.mpick-lab');
  let vy=y, sy=y, sm=m, step='year';
  const YSPAN=12;
  let ypage=Math.floor(y/YSPAN)*YSPAN;
  function paintBtn(){ lab.textContent=(GRAN==='month'?'':MONL[sm]+' ')+sy; }
  function paint(){
    if(step==='year'){
      head.innerHTML='<button type="button" data-dir="-1" aria-label="Earlier years">&lsaquo;</button>'+
        '<span class="yr">'+ypage+' – '+(ypage+YSPAN-1)+'</span>'+
        '<button type="button" data-dir="1" aria-label="Later years">&rsaquo;</button>';
      grid.innerHTML=Array.from({length:YSPAN},function(_,i){
        const yy=ypage+i;
        return '<button type="button" data-y="'+yy+'"'+(yy===sy?' class="on"':'')+'>'+yy+'</button>';
      }).join('');
      grid.querySelectorAll('button').forEach(function(b){
        b.onclick=function(e){e.stopPropagation();vy=+b.dataset.y;
          /* monthly buckets ARE the year, so the year is the whole answer */
          if(GRAN==='month'){ sy=vy; paintBtn(); pan.hidden=true; if(onPick) onPick(sy,sm); return; }
          step='month';paint();};
      });
      head.querySelectorAll('button').forEach(function(b){
        b.onclick=function(e){e.stopPropagation();ypage+=(+b.dataset.dir)*YSPAN;paint();};
      });
    }else{
      head.innerHTML='<button type="button" data-back="1" aria-label="Choose another year">&lsaquo;</button>'+
        '<span class="yr">'+vy+'</span><span style="width:26px"></span>';
      grid.innerHTML=MON.map(function(n,i){
        return '<button type="button" data-m="'+i+'"'+((i===sm&&vy===sy)?' class="on"':'')+'>'+n+'</button>';
      }).join('');
      grid.querySelectorAll('button').forEach(function(b){
        b.onclick=function(e){e.stopPropagation();sm=+b.dataset.m;sy=vy;paintBtn();pan.hidden=true;
          if(onPick)onPick(sy,sm);};
      });
      head.querySelectorAll('button[data-back]').forEach(function(b){
        b.onclick=function(e){e.stopPropagation();ypage=Math.floor(vy/YSPAN)*YSPAN;step='year';paint();};
      });
    }
  }
  btn.onclick=function(e){e.stopPropagation();
    vy=sy;ypage=Math.floor(sy/YSPAN)*YSPAN;step='year';paint();pan.hidden=!pan.hidden;};
  document.addEventListener('mousedown',function(e){if(!root.contains(e.target))pan.hidden=true;});
  paintBtn();paint();
  return {repaint:paintBtn};
}
const PERPICK=initMonthPick('per-pick',PY,PM,function(y,m){
  PY=y; PM=m; applyQuery(); T((GRAN==='month'?'':MONL[m]+' ')+y);

window.setGran=function(g){
  if(g===GRAN) return;
  GRAN=g;
  document.querySelectorAll('#gran button').forEach(function(b){

  T(g==='day'?'Daily · '+MONL[PM]+' '+PY:'Monthly · '+PY);
};
