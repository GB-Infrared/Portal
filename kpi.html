<!-- ======================= THE ROW, IN FULL =======================
     Hover a row and the whole of it is lifted out beside the pointer, so a table
     wider than the screen does not have to be read in two swipes. The labels are
     taken from the table's OWN header every time it opens - including the
     two-deck device/variable header, where a column is named by both decks - so
     a page that re-renders its columns can never label a value wrongly here. -->
<script>
(function(){
  const wrap=document.querySelector('.tablewrap');
  if(!wrap) return;
  const table=wrap.querySelector('table'), tbody=table&&table.tBodies[0];
  if(!tbody) return;

  const pop=document.createElement('div');
  pop.className='rowpop';
  document.body.appendChild(pop);

  /* Column names, read off the header as it stands. A header cell can span rows
     and columns, so the deck is laid out into a grid first and each column then
     reads down its own line - which is what turns "INV06" over "P_AC (kW)" into
     one name for one column. */
  function headerLabels(){
    const head=table.tHead; if(!head) return [];
    const grid=[];
    [].forEach.call(head.rows,function(tr,r){
      grid[r]=grid[r]||[];
      let c=0;
      [].forEach.call(tr.cells,function(cell){
        while(grid[r][c]!==undefined) c++;
        const rs=cell.rowSpan||1, cs=cell.colSpan||1;
        /* the sort arrow is a control, not part of the column's name */
        const txt=cell.textContent.replace(/[\u25b2\u25bc]/g,'').trim();
        for(let i=0;i<rs;i++){
          grid[r+i]=grid[r+i]||[];
          for(let j=0;j<cs;j++) grid[r+i][c+j]=txt;
        }
        c+=cs;
      });
    });
    const n=grid.reduce((m,g)=>Math.max(m,g.length),0), out=[];
    for(let c=0;c<n;c++){
      const parts=[];
      for(let r=0;r<grid.length;r++){
        const t=(grid[r]||[])[c];
        if(t&&parts[parts.length-1]!==t) parts.push(t);
      }
      out.push(parts.join(' \u00b7 '));
    }
    return out;
  }

  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let row=null;

  function hide(){ pop.classList.remove('on'); row=null; }

  function fill(tr){
    const labels=headerLabels();
    const cells=[].slice.call(tr.cells);
    /* the "nothing here" row is one cell spanning the table - there is no
       reading to spell out */
    if(cells.length<2) return false;
    let body='';
    cells.forEach(function(td,i){
      const v=td.textContent.trim();
      body+='<span class="rp-k">'+esc(labels[i]||('Column '+(i+1)))+'</span>'+
            '<span class="rp-v'+(v==='\u2014'||v===''?' nil':'')+'">'+esc(v||'\u2014')+'</span>';
    });
    /* the first cell is the row's identity - its time stamp - so it heads the
       card rather than sitting in the list as one field among many */
    pop.innerHTML='<div class="rp-h">'+esc(cells[0].textContent.trim())+'</div>'+
      '<div class="rp-g'+(cells.length>9?' two':'')+'">'+body+'</div>';
    return true;
  }

  function place(e){
    const w=pop.offsetWidth, h=pop.offsetHeight;
    let x=e.clientX+20, y=e.clientY+18;
    if(x+w>window.innerWidth-10) x=e.clientX-w-20;   /* flip rather than overflow */
    if(y+h>window.innerHeight-10) y=Math.max(10,e.clientY-h-14);
    pop.style.left=x+'px';
    pop.style.top=y+'px';
  }

  tbody.addEventListener('mousemove',function(e){
    const tr=e.target.closest&&e.target.closest('tr');
    if(!tr||!tbody.contains(tr)){ hide(); return; }
    if(tr!==row){
      if(!fill(tr)){ hide(); return; }
      row=tr;
      pop.classList.add('on');
    }
    place(e);
  });
  tbody.addEventListener('mouseleave',hide);
  /* it is pinned to the pointer, so anything that moves the page under it makes
     it a lie */
  window.addEventListener('scroll',hide,true);
  window.addEventListener('resize',hide);
})();
</script>
<script>
/* ===================== WHO IS AT THE DESK =====================
   Somebody from the web admin panel - a Super Admin, an Admin or a Plant Admin
   - can open this customer panel from the web admin logo. They are not this
   customer's admin, so the account menu names who they are and their role
   (Super Admin, Admin or Plant Admin) and offers the way
   back: Web Admin (their own panel), Customer Admin (this customer's Settings -
   left out on Settings itself, as Settings leaves out a link to itself) and
   Sign out.

   A PLANT ADMIN READS THIS PANEL BUT CHANGES NOTHING in it: on Settings every
   add, edit, delete and save control is taken away - the toolbar buttons, the
   row buttons, Change password and the role pickers on Access Control. The
   other pages only read already, so they are unchanged.

   The seat is one key - level, name, email - set by login.html when one of the
   web admin accounts signs in and by the web admin panel itself, cleared by
   any other sign-in and by Sign out. The same block is on every page of this
   panel. */
(function(){
  var KEY='enerops-seat', raw=null, seat=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(raw==='webadmin') seat={level:'super',first:'Ravi',last:'Goyal',email:'admin@enerops.in'};
  else { try{ seat=JSON.parse(raw); }catch(e){ seat=null; } }
  var menu=document.querySelector('.acctmenu');
  if(!menu) return;
  [].slice.call(menu.querySelectorAll('.acctitem.out')).forEach(function(a){
    a.addEventListener('click',function(){ try{ localStorage.removeItem(KEY); }catch(e){} });
  });
  if(!seat || !seat.email) return;
  var name=((seat.first||'')+' '+(seat.last||'')).trim()||seat.email;
  menu.querySelector('.acctwho .nm').textContent=name;
  menu.querySelector('.acctwho .em').textContent=seat.email;
  var LV={super:'Super Admin',admin:'Admin',plant:'Plant Admin'};
  if(LV[seat.level]){
    var lv=document.createElement('div');
    lv.className='lv';
    lv.style.cssText='margin-top:6px;font-size:12.5px;font-weight:700;color:var(--text)';
    lv.textContent=LV[seat.level];
    menu.querySelector('.acctwho').appendChild(lv);
  }
  var btn=document.getElementById('acctbtn'); if(btn) btn.textContent=name.charAt(0).toUpperCase();
  [].slice.call(menu.querySelectorAll('.acctitem:not(.out)')).forEach(function(a){ a.remove(); });
  var out=menu.querySelector('.acctitem.out'), here=location.pathname.split('/').pop();
  [['web-admin.html','Web Admin','<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 5 6v5.4c0 4.2 2.9 7.6 7 9.4 4.1-1.8 7-5.2 7-9.4V6l-7-2.8z"/><path d="M9.2 12.2l2 2 3.8-4"/></svg>'],
   ['settings.html','Customer Admin','<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.1 4.7a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09A1.7 1.7 0 0 0 21 10.1a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>']].forEach(function(it){
    if(it[0]===here) return;
    var a=document.createElement('a');
    a.className='acctitem'; a.setAttribute('role','menuitem'); a.href=it[0];
    a.innerHTML=it[2]+' '+it[1];
    menu.insertBefore(a,out);
  });
  if(seat.level==='plant' && here==='settings.html'){
    document.documentElement.classList.add('seat-ro');
    var st=document.createElement('style');
    st.textContent='html.seat-ro .tbtn,html.seat-ro .rowbtn,html.seat-ro .cfoot .linkbtn{display:none !important}'
      +'html.seat-ro [data-ss="acrole"]{pointer-events:none;background-image:none}';
    document.head.appendChild(st);
    document.addEventListener('keydown',function(e){
      var t=e.target;
      if(t && t.dataset && t.dataset.ss==='acrole'){ e.preventDefault(); e.stopPropagation(); }
    },true);
  }
})();
</script>
