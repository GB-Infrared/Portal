<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENEROPS OS · Analysis</title>
<link rel="icon" href="logo/favicon.png">
<style>

:root{
  /* ---- LIGHT · UTILITY BLUE (default) · enterprise solar-portal palette ---- */
  --bg:#f1f4f8;            /* page background            */
  --panel:#ffffff;         /* card surface               */
  --panel-2:#f5f8fb;       /* nested surface / inputs    */
  --line:#dde4ec;          /* card borders               */
  --line-soft:#e9eef4;     /* gridlines, dividers        */
  --line-hi:#b5c2d1;       /* hover / active borders     */
  --text:#152234;          /* primary text               */
  --muted:#5a6b7f;         /* secondary text             */
  --faint:#8494a6;         /* tertiary text              */
  --dim:#aab6c4;           /* dead readouts (offline)    */
  --elev:#ffffff;          /* tooltips, toasts           */
  --sel:#e8f0fb;           /* selected card surface      */
  --hover:rgba(11,99,206,.07);
  --hover-soft:rgba(11,99,206,.045);
  /* the row under the pointer, and only that row */
  --row-hover:rgba(11,99,206,.10);
  --grid-v:rgba(21,34,52,.05);
  --shadow:rgba(19,38,63,.16);
  --on-accent:#ffffff;     /* text on a filled accent    */
  --topbar:var(--panel);
  --topbar-fg:var(--text);
  --topbar-fg-2:var(--muted);
  --topbar-tab:var(--muted);
  --topbar-hover:var(--hover);
  --topbar-active:var(--green-soft);
  --green:#12a150;         /* producing / healthy        */
  --green-rgb:18,161,80;
  --green-soft:rgba(18,161,80,.12);
  --green-deep:#0b7a3c;
  --blue:#1a73c8;
  --blue-soft:rgba(26,115,200,.12);
  --red:#d92d20;           /* offline / alarms           */
  --red-soft:rgba(217,45,32,.1);
  --amber:#dc7a06;         /* yield / deviations         */
  --amber-soft:rgba(220,122,6,.12);
  --brand:#a87b0f;         /* wordmark · gold            */

  /* ---------- series palette ----------
     Four slots, assigned to devices in fixed order and never cycled: a device
     keeps its colour when another is switched off, so the eye can carry a
     reading from the chart to the legend to the table.

     Validated, not eyeballed - all-pairs, on this page's own card surface:
     CVD separation, normal-vision separation, chroma and contrast all clear.

     THAT SET WAS FOUR, AND IT WAS FOUR BECAUSE THE LINES SHARED A FRAME. Past
     four overlaid curves there is no fifth hue that stays apart from the other
     four for a colour-blind reader, so there was no fifth line. The plot is
     SPLIT now - one panel per device, each one named in its own corner - and a
     line alone in a named panel is not being identified by its colour. The set
     can be eight because colour stopped being the only thing telling them
     apart; it is still chosen for separation, because the legend chips and the
     table dots still sit side by side. */
/* ================= THE SERIES HUES DO NOT FOLLOW THE THEME =================

   THESE ARE THE ONE SET OF COLOURS ON THE PAGE THAT ARE THE SAME IN LIGHT AND
   IN DARK, and that is deliberate.

   Every other colour here is SEMANTIC - green means healthy, red means alarm -
   and a semantic colour has to be re-picked per ground or it stops being
   legible: #12a150 reads as green on white and disappears into navy. A SERIES
   colour is not semantic. It is an IDENTITY: it says "this line is INV06", and
   it has to survive a screenshot pasted into a report, a page compared against
   the same page on somebody else's screen, and a reader who flips the theme
   mid-investigation. A line that was emerald a moment ago and is now a
   different emerald is a line the reader has to re-identify.

   So one set, chosen to clear BOTH grounds rather than to sit best on either.
   They are mid-tones: dark enough to hold a 2px stroke against #f1f4f8, light
   enough to hold one against #070c14. Neither ground gets the optimum, which is
   the price of the line meaning the same thing on both.

   RED IS NOT IN THE SET, and the ochre is pulled well off the alarm amber in
   both hue and lightness. On this portal red means offline and amber means
   deviation, and a device that happened to land in that slot would be wearing a
   fault colour while producing normally. */
  --s1:#2e86e0;   /* blue    */
  --s2:#c9860c;   /* ochre   */
  --s3:#12a08a;   /* teal    */
  --s4:#c569a0;   /* mauve   */
  --s5:#8b7ff0;   /* violet  */
  --s6:#22b0c2;   /* cyan    */
  --s7:#93a03a;   /* olive   */
  --s8:#e0739a;   /* rose    */

  --mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,'Helvetica Neue',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --r-lg:14px; --r-md:10px; --r-sm:8px;
}
/* ---- DARK · the front door's palette, on every page behind it.

   THIS IS THE SIGN-IN'S SKY, not a second design. login.html and the site
   overview have always stood in the void; the portal stopped at the door and
   turned white. Somebody who signs in at night now keeps the room they signed
   in from, and these are that screen's own token values, copied rather than
   re-picked - two dark palettes that drift apart is exactly the failure the
   single :root above was written to avoid.

   NOT ONE RULE BELOW THIS BLOCK CHANGES. Only the VALUES are redefined, so
   every rule on the page - the cards, the tables, the charts, the dialogs -
   goes dark by reading the same token names it already read. A page re-skinned
   by rewriting two hundred declarations is a page with two hundred chances to
   miss one.

   The header tokens are not here because they do not need to be: --topbar and
   its family are declared as var(--panel), var(--text) and so on, so they
   follow whatever these say.

   The colours mean here what they mean on the overview: WHITE a fixed fact,
   EMERALD live, GOLD what has been banked. ---------------------------------- */
html[data-theme="dark"]{
  /* THE BROWSER'S OWN WIDGETS HAVE TO BE TOLD. Radios, tick boxes, the native
     date popup and the scrollbars are drawn by the UA, not by anything here,
     and left alone they stay in their light costume - four white discs in a
     navy menu, and a calendar that opens as a white sheet. One declaration
     hands the whole set over, which is the only way to reach the parts of a
     control this stylesheet cannot select. */
  color-scheme:dark;
  accent-color:#3ad998;
  --bg:#070c14;            /* the void itself            */
  --panel:rgba(9,16,28,.74);   /* the same glass the overview stands on */
  --panel-2:rgba(9,16,28,.62);
  --line:rgba(150,180,220,.16);
  --line-soft:rgba(150,180,220,.10);
  --line-hi:rgba(140,175,215,.30);
  --text:#e9f1fb;          /* white  - fixed facts, identity */
  --muted:#8ba0bb;
  --faint:#7d92ad;
  --dim:#5d6e83;           /* dead readouts, and they read dead on black */
  /* OPAQUE, and the one token here that is. The cards are glass because they
     sit still and the void behind them is meant to show; a dropdown, a tooltip
     or a toast is drawn OVER something a reader is trying to read, and at 96%
     the number underneath was still legible through the menu. A floating layer
     that lets its background through is not a layer. */
  --elev:#0d1624;
  --sel:rgba(127,178,238,.14);
  --hover:rgba(150,180,220,.07);
  --hover-soft:rgba(150,180,220,.045);
  --row-hover:rgba(150,180,220,.09);
  --shadow:rgba(0,0,0,.62);
  --scrim:rgba(3,7,13,.70);
  --grid-v:rgba(150,180,220,.07);
  /* text ON a filled accent. White on emerald is unreadable at this weight, and
     the accents are light here - so the ink goes dark instead. */
  --on-accent:#07121b;
  --green:#3ad998;         /* emerald - live */
  --green-rgb:58,217,152;
  --green-soft:rgba(58,217,152,.14);
  --green-deep:#3ad998;
  --blue:#7fb2ee;
  --blue-soft:rgba(127,178,238,.16);
  --red:#ff6b5e;
  --red-soft:rgba(255,107,94,.14);
  --crit:#ff9d94;
  --amber:#f0b74a;
  --amber-soft:rgba(240,183,74,.15);
  --brand:#f0b74a;         /* gold - the wordmark, and what the day earns */
  --brand-soft:rgba(240,183,74,.14);
  --brand-line:rgba(240,183,74,.34);
  /* THE SERIES HUES ARE NOT REDEFINED HERE. They were - lifted to carry on
     navy, on the argument that a mid-tone picked for white sinks into black.
     That argument is right about a SEMANTIC colour and wrong about a series
     one: a curve that changes hue when the reader flips the theme is a curve
     they have to identify twice. The single set on :root is picked to clear
     both grounds; see the note beside it. */
}
/* The one control that is not a reading: it belongs with the clock and the
   avatar, at the right of the bar, because it is about the SCREEN rather than
   about the plant. */
.themebtn{width:30px;height:30px;display:grid;place-items:center;flex:none;
  border-radius:8px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--topbar-fg-2,var(--muted));transition:background .12s,border-color .12s,color .12s}
.themebtn:hover{border-color:var(--line-hi);background:var(--topbar-hover,var(--hover));
  color:var(--topbar-fg,var(--text))}
.themebtn svg{display:block}
/* the icon shows WHAT YOU WILL GET, not what you are in: a moon on the light
   page is an offer, a moon on the dark page is a label for a state the whole
   screen is already stating */
.themebtn .moon{display:none}
html[data-theme="dark"] .themebtn .moon{display:block}
html[data-theme="dark"] .themebtn .sun{display:none}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:var(--line-hi) transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;
     -webkit-font-smoothing:antialiased}

/* ===================== THE FIELD THE GLASS STANDS ON =====================
   DARK WAS A FLAT BLACK SLAB, and it should not have been.

   The dark tokens were copied from the sign-in exactly, which was right, but
   only half of what makes that screen work came across. Over there --panel is
   rgba(9,16,28,.74) - GLASS - and behind it is a lit sky: a warm wash where the
   sun is, a wide cold one carrying the rest, a star field and the limb of the
   Earth. The panel reads as a surface because there is something behind it for
   it to be in front of.

   Here the same glass was laid on #070c14 and nothing else. 74% of near-black
   over near-black composites to near-black: card and page came out within a
   couple of values of each other, every border did the whole job of separating
   them, and the screen read as one unlit sheet with type on it. The tokens were
   never the problem - the room was empty.

   So this is the sign-in's own sky, at working strength. Same three washes, same
   places, same hues; roughly a third of the amplitude, because that screen is a
   held moment with one panel on it and this one is a working surface covered in
   tables. Enough to give the glass something to lift off, not enough to be read
   as data. No stars and no limb: those are the front door's, and a horizon
   behind a KPI table would be scenery.

   ON html, NOT ON body. The root element's background paints the whole canvas
   and does not scroll away when a long table does - a wash on body either ends
   where the content ends or has to be pinned with background-attachment:fixed,
   which repaints the gradient on every scroll frame. body is handed back to
   transparent for the same reason: two backgrounds is one background and one
   piece of dead code.

   LIGHT IS UNTOUCHED. It is a daylit palette on a solid ground and it separates
   its cards with white against grey, which needs no help from behind. */
html[data-theme="dark"]{
  background:
    /* the sun, off the top right corner */
    radial-gradient(circle 46vmax at 80% -8%,
      rgba(255,216,146,.085) 0%, rgba(240,178,73,.032) 32%, transparent 64%),
    /* the cold half of the same sky, wide enough to reach the far corner */
    radial-gradient(ellipse 155% 125% at 80% -8%,
      rgba(126,158,214,.115) 0%, rgba(90,120,180,.05) 46%, transparent 80%),
    /* and the void closing back in under both, so the foot of a long page is
       the deep end rather than a gradient that simply stops */
    radial-gradient(ellipse 130% 105% at 50% 62%,
      rgba(2,6,14,.34) 0%, rgba(0,1,5,.5) 100%),
    var(--bg);
}
html[data-theme="dark"] body{background:transparent}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line-hi);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:20px;
  height:58px;padding:0 22px;border-bottom:1px solid var(--line);
  background:var(--topbar);color:var(--topbar-fg)}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .logo{height:34px;width:auto;display:block;flex:none}
.brand .btext{display:flex;flex-direction:column;justify-content:center;gap:1px}
.brand .word{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--brand);
  letter-spacing:.2px;line-height:1.05}
.brand .sub{font-size:9px;letter-spacing:.16em;color:var(--topbar-fg-2);text-transform:uppercase;
  font-weight:600;line-height:1}
@media (max-width:820px){ .brand .sub{display:none} }
/* ---------- which site the portal is on ----------
   A READOUT, NOT A CONTROL. Every page used to answer "which site am I looking
   at" with a picker of its own - four of them, four defaults, and nothing
   keeping them in step: you could walk from Monitoring to Alarms and be reading
   two different plants without either page saying so. The choosing moved to one
   place, the Sites tab a little to the right of this, and what is left here is
   the ANSWER - the same words, the same spot, on every page.
   A pin and a name, with no "SITE" label in front of it: the wordmark beside it
   already says SITE OVERVIEW and the tab beside that says Sites, and a third
   one would be the bar saying the word three times before saying anything. */
.sitenow{display:flex;align-items:center;gap:7px;flex:none;white-space:nowrap;
  padding-left:16px;border-left:1px solid var(--line);color:var(--topbar-fg)}
.sitenow svg{color:var(--green);flex:none}
.sitenow .n{font-family:var(--mono);font-size:13.5px;font-weight:600;letter-spacing:.02em}
@media (max-width:900px){ .sitenow{padding-left:10px} .sitenow svg{display:none} }
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:8px 13px;border-radius:9px;color:var(--topbar-tab);font-size:13.5px;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--topbar-fg);background:var(--topbar-hover)}
.tab.active{color:var(--green);background:var(--topbar-active);font-weight:600}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.clock{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--topbar-fg);letter-spacing:.02em}
.refresh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--topbar-fg-2)}
/* The control beside it is the portal's own dropdown now, not the browser's -
   see the note on the markup - and these are the few things a header-sized one
   needs said. Everything else it inherits from .mbtn / .colpanel unchanged. */
/* The word is a LABEL for the control beside it, so it stops being a link-sized
   piece of type competing with the value: quieter, letterspaced, and it steps
   out of the way on a narrow bar where the value is the part that matters. */
.refresh .rl{letter-spacing:.04em;white-space:nowrap}
/* .mbtn was drawn for the filter bar and is already this height, so only the
   width is stated - "15 min" is the longest thing it ever holds, and a box
   sized for that stops the header shifting when the value changes. */
.refresh .rsel .mbtn{min-width:86px;font-family:var(--mono);font-size:12px;
  justify-content:space-between}
/* .colpanel hangs from its control's LEFT edge, which is right for a filter bar
   and wrong here: this is the last control before the theme switch and the
   avatar, so a list dropped leftward runs off the end of the bar. */
.refresh .rsel .colpanel{left:auto;right:0;width:150px}
/* OFF is a state, not an absence, so the label says it in the same voice the
   dot does - dimmed, with the pulse stopped. */
.refresh .rsel .mbtn .mlab.off{color:var(--muted)}
@media (max-width:1180px){ .refresh .rl{display:none} }
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(var(--green-rgb),.55);
  animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(var(--green-rgb),.5)}70%{box-shadow:0 0 0 8px rgba(var(--green-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--green-rgb),0)}}
select{appearance:none;background:var(--panel-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%238d99a6" stroke-width="1.6" stroke-linecap="round"/></svg>') no-repeat right 10px center;
  border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);
  padding:8px 28px 8px 11px;font-size:13px;font-family:inherit;outline:none}
select:hover{border-color:var(--line-hi);background-color:var(--hover)}
select:focus{border-color:var(--line-hi);background-color:var(--hover)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;
  background:transparent;border:1px solid transparent;color:var(--muted)}
.iconbtn:hover{color:var(--text);background:var(--hover);border-color:var(--line)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--panel-2);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--text);
  border:1px solid var(--line)}
/* ---------- account menu ----------
   The avatar was a dead circle: it named the signed-in user and offered nothing.
   It is the only place Settings and Sign out can live without spending a tab on
   either, and every page carries the same one so the way out is never hunted for. */
.acct{position:relative;display:flex}
.avatar{padding:0}
.avatar:hover,.acct.open .avatar{border-color:var(--line-hi);background:var(--hover)}
.acctmenu{position:absolute;top:calc(100% + 8px);right:0;z-index:90;width:224px;
  background:var(--elev);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:0 18px 44px -16px var(--shadow);padding:6px;display:none}
.acct.open .acctmenu{display:block}
.acctwho{padding:9px 10px 10px}
.acctwho .nm{font-size:13px;font-weight:700;color:var(--text);line-height:1.3}
.acctwho .em{font-size:11.5px;color:var(--muted);line-height:1.35;word-break:break-all}
.acctdiv{height:1px;background:var(--line-soft);margin:4px}
.acctitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
  font-size:12.5px;font-weight:600;color:var(--text);width:100%;
  border:none;background:transparent;text-align:left;font-family:inherit}
.acctitem:hover{background:var(--hover)}
.acctitem svg{flex:none;color:var(--faint)}
.acctitem:hover svg{color:var(--muted)}
.acctitem.out:hover{background:var(--red-soft);color:var(--red)}
.acctitem.out:hover svg{color:var(--red)}


/* ---------- page shell ----------
   One column, no rail. Analysis is driven entirely by the bar above it, and a
   rail would take width from a chart whose whole job is a long time axis. */
.wrap{max-width:2400px;margin:0 auto;padding:14px clamp(14px,1.5vw,28px) 34px;
  display:flex;flex-direction:column;gap:14px}
.toprow{max-width:2400px;margin:0 auto;padding:16px clamp(14px,1.5vw,28px) 0}

/* ---------- filter bar ---------- */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:9px;padding:0 2px 2px;min-width:0}
.field{position:relative;display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.field select,.field .input,.field input{height:34px;min-width:116px}
.field select{padding-top:0;padding-bottom:0}
/* Y1 and Y2 are each a PAIR - the category narrows the list the value is
   picked from - so they are ruled together and read as one control, not four.
   Without this the bar is eight equal boxes and nothing says which value
   belongs to which category. */
.pair{display:flex;align-items:flex-end;gap:6px;padding:0 9px 0 0;border-right:1px solid var(--line);margin-right:3px}
/* ---------- saved views ----------
   ONE control, not three. The first pass put a dropdown, a SAVE and a DELETE
   side by side in the filter bar: three boxes for one idea, and enough width
   that the bar wrapped onto a second line on a laptop. A saved view is a single
   thing you either open, name, or throw away - so it is a single button, and
   everything you can do to one happens inside the panel it opens. */
.vw{position:relative}
.vwbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;
  border:1px solid var(--line);border-radius:9px;background:var(--panel);
  color:var(--text);font-family:inherit;font-size:13px;font-weight:600;
  max-width:230px;white-space:nowrap}
.vwbtn:hover{border-color:var(--line-hi);background:var(--hover)}
.vw.open .vwbtn{border-color:var(--line-hi);background:var(--hover)}
.vwbtn svg{flex:none;color:var(--faint)}
.vw.on .vwbtn svg{color:var(--brand)}
.vwbtn .t{overflow:hidden;text-overflow:ellipsis}
.vwbtn .t.none{color:var(--faint);font-weight:500}
/* the one honest thing a saved view has to be able to say about itself */
.vwbtn .edit{color:var(--amber);font-size:11px;font-weight:800;letter-spacing:.06em;flex:none}
.vwbtn .cx{margin-left:2px;color:var(--faint);flex:none}

.vwpanel{position:absolute;top:calc(100% + 6px);left:0;z-index:40;
  min-width:340px;max-width:400px;padding:0;overflow:hidden}
.vwlist{max-height:230px;overflow:auto;padding:4px}
.vwrow{display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;
  border:none;background:transparent;border-radius:8px;text-align:left;
  font-family:inherit;font-size:13px;color:var(--text);cursor:pointer}
.vwrow:hover{background:var(--hover)}
.vwrow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
/* the summary gives way before the NAME does: the name is what the reader is
   looking for, the summary is only there to tell two similar ones apart */
.vwrow .q{color:var(--faint);font-size:11px;font-weight:600;font-family:var(--mono);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto;min-width:0}
.vwrow .n{flex:0 1 auto}
.vwrow.on{background:var(--sel)}
.vwrow.on .n{color:var(--brand)}
.vwx{flex:none;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;
  border:none;background:transparent;border-radius:6px;color:var(--faint);opacity:0}
.vwrow:hover .vwx,.vwx:focus-visible{opacity:1}
.vwx:hover{background:var(--red-soft);color:var(--red)}
.vwnone{padding:14px 12px;color:var(--faint);font-size:12.5px;line-height:1.5}
.vwfoot{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line-soft);background:var(--panel-2)}
.vwfoot input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel);color:var(--text);font-family:inherit;font-size:12.5px;padding:0 9px;outline:none}
.vwfoot input:focus{border-color:var(--line-hi)}
.vwfoot button{flex:none;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--green);
  background:var(--green);color:var(--on-accent);font-family:inherit;font-size:12px;font-weight:700}
.vwfoot button:hover{background:var(--green-deep);border-color:var(--green-deep)}

.vwerr:empty{display:none}
.pair:last-of-type{border-right:none}
.axtag{display:inline-flex;align-items:center;gap:5px}
.axtag i{width:14px;height:0;border-top-width:2px;border-top-color:var(--muted);display:inline-block}
.axtag i.solid{border-top-style:solid}
.axtag i.dash{border-top-style:dashed}

/* ---------- one window, two controls ----------
   A datetime-local field looks tidy until it is opened: the browser answers it
   with a calendar AND two spinner columns in a single popup, wide enough to
   land across the field beside it. A date input and a time input sharing one
   box open the two compact pickers this portal already uses elsewhere, and the
   field still says one thing. Lifted from the alarms bar unchanged, so a
   window is set the same way on both pages. */
.dt{position:relative;display:flex;align-items:stretch;height:34px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r-sm)}
.dt:hover{border-color:var(--line-hi)}
.dt:focus-within{border-color:var(--line-hi);background-color:var(--hover)}
.dt input{height:100%;border:none;background:transparent;color:var(--text);
  font-family:var(--mono);font-weight:600;font-size:12.5px;padding:0 9px;outline:none}
.dt input[type=date]{min-width:132px}
.field input::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.55}
.field input:hover::-webkit-calendar-picker-indicator{opacity:1}
.dt input[type=date]{user-select:none;-webkit-user-select:none;cursor:pointer}
.dt input[type=date]::selection{background:transparent}
.dt input[type=date]::-webkit-datetime-edit-day-field,
.dt input[type=date]::-webkit-datetime-edit-month-field,
.dt input[type=date]::-webkit-datetime-edit-year-field{
  background:transparent;color:inherit;outline:none;padding:0}
.dt input[type=date]::-webkit-datetime-edit-day-field:focus,
.dt input[type=date]::-webkit-datetime-edit-month-field:focus,
.dt input[type=date]::-webkit-datetime-edit-year-field:focus{
  background:transparent;color:inherit;outline:none}
/* the window is invalid until it is a window - said on the control, not in a toast */
.dt.bad{border-color:var(--red)}
.dtwarn{font-size:10px;font-weight:700;color:var(--red);letter-spacing:.04em}

/* ---------- the time half ----------
   Hours and minutes are two separate dropdowns, not two columns of one panel:
   two lists that are never open together cannot drift out of step with each
   other. Same control as the alarms bar. */
.tpick{display:flex;align-items:center;gap:2px;padding:0 7px;border-left:1px solid var(--line)}
.tbit{position:relative;height:26px;min-width:31px;padding:0 5px;border-radius:6px;
  border:1px solid transparent;background:transparent;color:var(--text);
  font-family:var(--mono);font-size:12.5px;font-weight:600}
.tbit:hover{background:var(--hover);border-color:var(--line-hi)}
.tbit.open{background:var(--sel);border-color:var(--line-hi)}
.tsep{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--faint)}
.tlist{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:80;
  display:flex;flex-direction:column;gap:2px;width:62px;max-height:214px;

.tlist[hidden]{display:none}
.tlist button{flex:none;height:26px;border:1px solid transparent;border-radius:6px;
  background:transparent;color:var(--text);
  font-family:var(--mono);font-size:12.5px;font-weight:600}
.tlist button:hover{background:var(--hover)}
.tlist button.on{background:var(--sel);border-color:var(--line-hi)}

/* ---------- dropdown panels (one idiom, four uses) ---------- */
.msel{position:relative;display:flex}
.mbtn{display:flex;align-items:center;width:100%;min-width:150px;height:34px;
  padding:0 28px 0 11px;border-radius:var(--r-sm);border:1px solid var(--line);
  color:var(--text);font-size:13px;font-weight:600;text-align:left;
  background:var(--panel-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%238d99a6" stroke-width="1.6" stroke-linecap="round"/></svg>') no-repeat right 10px center}
.mbtn:hover,.msel.open .mbtn{border-color:var(--line-hi);background-color:var(--hover)}
.mbtn .mlab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbtn .mlab.any{color:var(--muted);font-weight:600}
/* a value control that has nothing to offer yet says so instead of opening empty */
.mbtn:disabled{opacity:.5;cursor:default}
.mbtn:disabled:hover{border-color:var(--line);background-color:var(--panel-2)}
.colpanel{position:absolute;top:calc(100% + 6px);left:0;z-index:80;width:236px;
  background:var(--elev);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 18px 44px -16px var(--shadow);padding:8px;
  max-height:min(60vh,460px);overflow-y:auto;scrollbar-width:thin}
.colpanel[hidden]{display:none}
.colhead{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);padding:4px 8px 8px}
.colrow{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;
  font-size:12.5px;font-weight:600;cursor:pointer;width:100%;background:transparent;
  border:none;color:inherit;text-align:left}
.colrow:hover{background:var(--hover)}
.colrow input{width:14px;height:14px;accent-color:var(--green);flex:none}
.colrow.locked{cursor:default;color:var(--muted)}
.colrow.locked:hover{background:transparent}
.colrow .req{margin-left:auto;font-size:8px;font-weight:800;letter-spacing:.09em;
  color:var(--faint);background:var(--panel-2);border:1px solid var(--line);
  padding:2px 6px;border-radius:5px}
/* a device that does not report the chosen parameter is offered but marked -
   ticking it is allowed, and the column it adds is honestly all dashes */
.colrow .noda{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--faint)}
.colrow .swatch{width:9px;height:9px;border-radius:3px;flex:none}
.coldiv{height:1px;background:var(--line-soft);margin:6px 4px}
.colfoot{display:flex;gap:6px;padding:8px 4px 2px;border-top:1px solid var(--line-soft);margin-top:6px}
.colfoot button{flex:1;padding:6px 0;border-radius:7px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:11.5px;font-weight:700}
.colfoot button:hover{border-color:var(--line-hi);color:var(--text);background:var(--hover)}
.mpanel{width:214px;min-width:100%}
/* The rows are <label>s inside a .field, so the filter bar's own label rule
   reached them and set every option in tiny faint tracked-out caps - the voice
   reserved for the name ABOVE a control, printed inside it. Stated back. */
.mpanel .colrow{font-size:12.5px;font-weight:600;letter-spacing:0;
  text-transform:none;color:var(--text)}
.mpanel .colrow input{min-width:0}

/* ---------- plant picker ---------- */
.pplant{width:268px;padding:7px;display:flex;flex-direction:column;gap:5px;
  max-height:min(60vh,320px);overflow-y:auto;scrollbar-width:thin}
.pcard{display:flex;flex-direction:column;gap:3px;min-width:0;width:100%;
  text-align:left;font-family:inherit;color:var(--text);
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:7px 10px}
.pcard:hover{background:var(--hover);border-color:var(--line-hi)}
.pcard.on{background:var(--sel);border-color:var(--line-hi)}
.pcard .top,.pcard .row{display:flex;align-items:baseline;gap:6px;min-width:0}
.pcard .nm{font-family:var(--serif);font-size:12.5px;font-weight:700;color:var(--text);
  line-height:1.15;white-space:nowrap}
.pcard.on .nm::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  margin-left:6px;vertical-align:middle;background:var(--line-hi)}
.pcard .ad{flex:1 1 0;min-width:0;text-align:right;font-size:9px;color:var(--faint);
  line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .cap{font-family:var(--mono);font-size:9.5px;font-weight:800;color:var(--text);white-space:nowrap}
.pcard .dv{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.05em;
  color:var(--faint);white-space:nowrap}

/* ---------- card ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.card .chead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:13px 16px 10px}
.chead .title{font-size:14.5px;font-weight:700;white-space:nowrap;flex:none}
/* THERE IS NO LAYOUT SWITCH, and no .tools box in the chart's head to hold one.

   The plot was briefly offered as Overlap or Split, on the segmented control
   Monitoring and KPI use for their buckets. Both went with the split: the chart
   is one frame, and a control with one setting is not a control - it is a label
   that looks clickable. The idiom is still on those two pages if it is ever
   wanted back here. */

/* ---------- legend ----------
   Identity is never colour alone: every chip carries the device name, and the
   axis it reads is carried by the LINE STYLE drawn in the chip - solid for Y1,
   dashed for Y2 - which is the same mark the chart draws. */
.legend{display:flex;gap:7px;flex-wrap:wrap;min-width:0}
.lg{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2);font-size:12px;cursor:pointer;user-select:none;white-space:nowrap;flex:none}
.lg:hover{border-color:var(--line-hi)}
.lg.off{opacity:.38}
.lg i{width:16px;height:0;border-top-width:2.5px;display:inline-block;flex:none}
.lg i.solid{border-top-style:solid}
.lg i.dash{border-top-style:dashed}
.lg .n{color:var(--text);font-weight:700;font-family:var(--mono);font-size:11.5px}
.lg .p{color:var(--muted);font-weight:600;font-size:11px}

/* ---------- chart ---------- */
.chartwrap{position:relative;padding:4px 10px 14px}
/* DIRECT CHILD, not any descendant. .tip lives inside .chartwrap, so the day
   anything in the tooltip is drawn as inline svg this rule would size it to the
   card. It cost an afternoon on the KPI page; it is closed here before it can. */
.chartwrap>svg{width:100%;height:auto;display:block}
.gl{stroke:var(--line-soft);stroke-width:1}
.gl.v{stroke:var(--grid-v)}
.axt{fill:var(--faint);font-size:10.5px;font-family:var(--mono)}
.axtitle{fill:var(--muted);font-size:10.5px;font-family:var(--sans);font-weight:700;letter-spacing:.06em}
#xh{stroke:var(--text)}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--elev);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:150px;
  box-shadow:0 10px 26px -8px var(--shadow);z-index:5}
.tip .tt{font-family:var(--mono);font-weight:700;font-size:11px;color:var(--muted);margin-bottom:5px}
.tip .tr{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:2px 0}
.tip .tr i{width:13px;height:0;border-top-width:2.5px;flex:none}
.tip .tr i.solid{border-top-style:solid}
.tip .tr i.dash{border-top-style:dashed}
.tip .tr b{margin-left:auto;font-family:var(--mono);color:var(--text);font-weight:700}
/* the state before a query is complete - the plot keeps its frame and says what
   is missing, rather than collapsing to a bare box */
.chartnote{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;color:var(--faint);font-family:var(--mono);font-size:12.5px;text-align:center;padding:0 20px}

/* ---------- table ---------- */
/* Cells are CENTRED. Numbers in a column read fastest right-aligned - the
   decimal points line up and magnitude is visible without reading a digit -
   so that is what these tables did. Centred is the house style now; the
   mono face keeps the digits on a common width, which is what stops a
   centred column of numbers from going ragged. */
.ttools{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;
  letter-spacing:.04em;background:transparent;border:1px solid var(--line);color:var(--muted)}
.tbtn:hover{color:var(--text);border-color:var(--line-hi);background:var(--hover)}
.tablewrap{overflow-x:auto}
table{width:100%;min-width:520px}
thead th{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:9px 16px;border-bottom:1px solid var(--line-soft);text-align:center;white-space:nowrap}
thead .grp th{border-bottom:none;padding-bottom:2px;font-size:11.5px;color:var(--text);letter-spacing:.06em}
/* the device name spans its parameter columns, so the pairing is structural */
thead .grp th.dev{text-align:center;border-bottom:1px solid var(--line-soft)}
thead th.ts, tbody td.ts{text-align:center}
thead th.ph{color:var(--faint);font-weight:600}
tbody td{padding:9px 16px;font-family:var(--mono);font-size:12.5px;font-weight:600;text-align:center;
  border-bottom:1px solid var(--line-soft);color:var(--text);white-space:nowrap}
tbody td.ts{color:var(--muted);font-weight:600}
tbody td.nil{color:var(--faint)}
/* THE ROW UNDER THE POINTER LIFTS OFF THE TABLE. A tint alone was not enough on
   a table this wide - at 4.5% it was invisible, and even raised it only shaded a
   band the eye still slips out of. So the row is picked out the way every other
   raised surface in this portal is: its own ring, and a shadow under it. It
   reads as one object rather than as a row of separate cells, which is the point
   when a value has to be carried across ten columns.

   It marks where the POINTER is, so it clears the moment the pointer leaves and
   can never be mistaken for a selection that persists. The table's borders are
   separated rather than collapsed for it: a collapsed table draws one shared
   border between two rows, and a browser will not paint a shadow on a row that
   does not own its own edges. Only bottom borders are ever set here, so nothing
   doubles up and the table looks exactly as it did. */
table{border-collapse:separate;border-spacing:0}
tbody tr{transition:background-color .12s ease,box-shadow .12s ease}
tbody tr:hover{background:var(--row-hover);position:relative;z-index:1;
  box-shadow:inset 0 0 0 1px var(--line-hi),0 10px 22px -12px var(--shadow),0 2px 6px -4px var(--shadow)}
/* the readings come up to full strength with it; a dash stays a dash, because a
   cell with nothing in it has nothing to bring forward */
tbody tr:hover td:not(.nil){color:var(--text)}
/* the y2 half of a device's pair is ruled off from the y1 half, so a wide table
   does not read as one undifferentiated block of numbers */
thead th.sep, tbody td.sep{border-left:1px solid var(--line-soft)}
.empty-note{display:flex;align-items:center;justify-content:center;
  color:var(--faint);font-size:12.5px;font-family:var(--mono)}
.empty-note.tall{min-height:170px}
.colpick{position:relative;display:inline-flex}

/* ---------- pager ---------- */
.tfoot{display:flex;align-items:center;gap:16px;padding:11px 16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
/* THE ROWS-PER-PAGE CONTROL IS THE PAGE'S OWN DROPDOWN, not the browser's - the
   same move the header's refresh control made, for the same reason: this footer
   sat under a table drawn entirely by the app and then handed its one control to
   the operating system. These are the few things a footer-sized one needs said.

   IT OPENS UPWARD. .colpanel hangs below its button, which is right in a filter
   bar at the top of a card and wrong at the bottom of one - a list dropped
   downward from the last row of the page opens into the window's edge. */
.tfoot .psel{flex:none}
.tfoot .psel .mbtn{min-width:74px;height:30px;font-family:var(--mono);font-size:12px;
  justify-content:space-between}
.tfoot .psel .colpanel{top:auto;bottom:calc(100% + 6px);width:120px}
.tfoot .sp{margin-left:auto}
.pgbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.pgbtn:hover:not(:disabled){color:var(--text);border-color:var(--line-hi)}
.pgbtn:disabled{opacity:.35;cursor:default}
.tfoot .range{font-family:var(--mono)}

/* ---------- toasts ---------- */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--elev);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:9px;
  padding:10px 14px;font-size:12.5px;color:var(--text);box-shadow:0 12px 30px -8px var(--shadow);
  animation:tin .18s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:820px){
  .topbar{gap:12px;padding:0 14px}
  .wrap{padding:12px 14px 30px}
  .toprow{padding:12px 14px 0}
  .clock{display:none}
  .pair{border-right:none;padding-right:0;margin-right:0}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ---------- the row, spelled out in full ----------
   A table wider than the screen is read by scrolling sideways, and a row read
   sideways is a row half remembered: by the time the last column is on screen,
   the device name that started it is not. Hovering a row lifts the WHOLE of it
   out as a card - every column of that one row, label and value, in one place -
   so the reading is taken in a glance instead of in two swipes.

   It follows the pointer, it is never clickable, and it goes the moment the
   pointer leaves. It opens on every row, whether or not the table is currently
   wider than the screen - the same gesture has to give the same answer on a
   laptop as on a wall display, and a reader who learns it on one must not find
   it missing on the other. */
.rowpop{position:fixed;z-index:120;pointer-events:none;opacity:0;transition:opacity .12s ease;
  background:var(--elev);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  box-shadow:0 20px 48px -18px var(--shadow),0 3px 10px -6px var(--shadow);
  max-width:min(620px,92vw)}
.rowpop.on{opacity:1}
.rowpop .rp-h{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.05em;
  color:var(--text);padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line-soft)}
.rowpop .rp-g{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;align-items:baseline}
.rowpop .rp-g.two{grid-template-columns:auto 1fr auto 1fr}
.rowpop .rp-k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap}
.rowpop .rp-v{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--text);
  text-align:right;white-space:nowrap}
/* a cell with nothing in it stays a dash, and says so quietly */
.rowpop .rp-v.nil{color:var(--faint);font-weight:600}
</style>
<script>/* stored theme applied before first paint, so there is no flash */
</script>
<script>
/* THE THEME, SET BEFORE THE FIRST PAINT.

   This runs in the head, ahead of the body, because the alternative is a white
   flash on every navigation for anybody who chose dark - the page would paint
   light, then the script would run, then it would repaint. A theme applied
   after the first frame is a theme the reader watches being applied.

   It is one key in localStorage, so the choice carries from Home to Alarms to
   Settings rather than being made again on each. The sign-in and the site
   overview never read it: they are the void either way.

   LIGHT IS THE DEFAULT AGAIN, AND DARK IS THE CHOICE. For one revision it was
   the other way round: the portal opened dark, so that sign-in, globe and
   portal read as one night-sky room the whole way through. Light was asked for
   as the state people land in, so the portal opens daylit and the switch in the
   header is there for anybody who wants the dark half of the palette. The
   sign-in and the globe are still the void - only the portal behind them moved.

   THE DEFAULT IS STILL ON THE TAG, NOT IN THIS SCRIPT. <html> carries no
   data-theme, and no data-theme IS light; all this line does is PUT dark on for
   somebody who chose it. That leaves the try/catch on the right side: a browser
   with storage blocked cannot read anybody's choice, so it opens in the
   default, which is the theme the page says it is. */
(function(){
  var KEY='enerops-theme', root=document.documentElement;
  try{ if(localStorage.getItem(KEY)==='dark') root.setAttribute('data-theme','dark'); }catch(e){}
  function say(){
    var b=document.getElementById('themebtn');
    if(!b) return;
    /* the button names WHAT IT WILL DO, not where you are */
    var t = root.getAttribute('data-theme')==='dark' ? 'Switch to light' : 'Switch to dark';
    b.title=t; b.setAttribute('aria-label',t);
  }
  window.toggleTheme=function(){
    var dark = root.getAttribute('data-theme')==='dark';
    if(dark) root.removeAttribute('data-theme'); else root.setAttribute('data-theme','dark');
    try{ localStorage.setItem(KEY, dark?'light':'dark'); }catch(e){}
    say();
  };
  document.addEventListener('DOMContentLoaded', say);
})();
</script>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');

/* ---------- toasts ---------- */
window.T=function(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  $('toasts').appendChild(t);setTimeout(()=>t.remove(),2600);return false;
};

/* ---------- theme ----------
   TWO THEMES, ONE SWITCH, AND NONE OF IT RUNS HERE.

   This note used to read "THERE IS NO TOGGLE, AND THERE IS NO DARK" - the
   portal had been cut back to the light palette on purpose. Dark came back and
   the note did not, so the file said the opposite of what it did.

   The argument it made is still worth answering rather than deleting: it held
   that a second theme is a second answer to a settled question. The question is
   not settled. The sign-in and the globe are a void, the portal is entered
   through them, and a portal that opens white behind a night sky is a seam the
   reader can see. So there are two, the portal opens DARK, and light is what
   the switch is for.

   The apply-before-first-paint and the toggle both live in the HEAD script, up
   with the tokens they act on. A theme applied by this script - which runs at
   the bottom of the body - is a theme the reader watches being applied. */
/* ---------- account menu ---------- */
window.toggleAcct=function(e){
  e.stopPropagation();
  const a=$('acct'), open=a.classList.toggle('open');
  $('acctbtn').setAttribute('aria-expanded', open?'true':'false');
};
document.addEventListener('click',function(){
  const a=$('acct'); if(!a) return;
  a.classList.remove('open'); $('acctbtn').setAttribute('aria-expanded','false');
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  const a=$('acct'); if(!a||!a.classList.contains('open')) return;
  a.classList.remove('open'); $('acctbtn').setAttribute('aria-expanded','false'); $('acctbtn').focus();
});


/* ---------- simulated plant clock (anchored for demo) ---------- */
const START_T=12+10/60+3/3600, t0=Date.now();
const nowT=()=>START_T+(Date.now()-t0)/3600000;
function fmtClock(t,withS){t=((t%24)+24)%24;let h=Math.floor(t),m=Math.floor((t-h)*60),s=Math.floor((t*3600)%60);
  const ap=h<12?'AM':'PM';let hh=h%12;if(hh===0)hh=12;
  return hh+':'+pad(m)+(withS?(':'+pad(s)):'')+' '+ap;}

/* =======================================================================
   PARAMETER CATALOGUE
   Category narrows; value picks. The two dropdowns are one decision, so the
   value list is rebuilt from the category rather than offering every tag on
   the plant at once - which is what makes the pair worth having over a single
   flat list of forty parameters.
   ======================================================================= */
const CATS=[
  {k:'AC Power',      vals:[['P_AC','kW'],['S_AC','kVA'],['Q_AC','kVAR'],['COS_PHI','']]},
  {k:'AC Electrical', vals:[['V_AC','V'],['I_AC','A'],['F_AC','Hz']]},
  {k:'DC Input',      vals:[['P_DC','kW'],['V_DC','V'],['I_DC','A']]},
  {k:'Energy',        vals:[['E_TODAY','kWh'],['E_TOTAL','kWh']]},
  {k:'Temperature',   vals:[['T_INT','°C'],['T_MOD','°C'],['T_AMB','°C']]},
  {k:'Irradiance',    vals:[['GHI','W/m²'],['POA','W/m²']]},
  {k:'Performance',   vals:[['PR','%'],['CUF','%'],['SPEC_YIELD','kWh/kWp']]}
];
/* "None" is a real answer for the second axis: most analysis is one parameter
   over time, and a second scale that is not wanted should be switchable off
   rather than set to something harmless. */
const NONE='— None —';
const catOf=k=>CATS.filter(c=>c.k===k)[0];
const unitOf=v=>{
  for(const c of CATS) for(const p of c.vals) if(p[0]===v) return p[1];
  return '';
};
const labelOf=v=>{const u=unitOf(v); return v+(u?' ('+u+')':'');};

/* ---------- devices ----------
   The same fleet the alarms page lists, so a device named in an alarm can be
   looked up here under the same id. */
const DEVICES=['INV01','INV02','INV03','INV04','INV05','INV06','INV07','MFM01','WMS01'];
const KIND=id=>id.slice(0,3);        /* INV | MFM | WMS */
/* Which parameters a device actually reports. A weather station has no power
   factor and an inverter has no irradiance - asking for one returns null, which
   prints as a dash rather than a zero. Nothing measured and zero measured are
   different facts, and a chart that draws the first as the second is lying. */
const REPORTS={
  INV:['P_AC','S_AC','Q_AC','COS_PHI','V_AC','I_AC','F_AC','P_DC','V_DC','I_DC',
       'E_TODAY','E_TOTAL','T_INT','PR','CUF','SPEC_YIELD'],
  MFM:['P_AC','S_AC','Q_AC','COS_PHI','V_AC','I_AC','F_AC','E_TODAY','E_TOTAL'],
  WMS:['T_MOD','T_AMB','GHI','POA']
};
const reports=(id,v)=>!!v&&REPORTS[KIND(id)].indexOf(v)>=0;

const PLANTS=[
  {id:'Sangria', addr:'2 DLP, Kikarwali Road Nathwana Sangria', ac:2500, dev:9},
  {id:'Rioja',   addr:'Plot 14, Bikaner Road, Bikaner',         ac:1800, dev:7},
  {id:'Mendoza', addr:'NH-52, Pokhran Road, Jaisalmer',         ac:3200, dev:12}
];

/* =======================================================================
   TELEMETRY MODEL
   Deterministic: the same device, parameter and instant always give the same
   number, so a screenshot taken today still matches the page tomorrow and the
   table cannot disagree with the chart it was drawn from.
   ======================================================================= */
const SUNRISE=6.2, SUNSET=19.35, SPAN=SUNSET-SUNRISE;
const hash=(s)=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967296;};
const jit=(id,v,ms)=>hash(id+'|'+v+'|'+Math.round(ms/60000))-0.5;
const bell=t=>(t<=SUNRISE||t>=SUNSET)?0:Math.sin(Math.PI*(t-SUNRISE)/SPAN);
/* one day's weather, stable for a given date */
const dayK=d=>{const s=Math.sin((d.getFullYear()*372+d.getMonth()*31+d.getDate())*12.9898)*43758.5453;
  return 0.72+0.28*Math.abs(s-Math.floor(s));};
/* a passing cloud, so two devices on the same site dip together and the page
   has something worth comparing */
const cloud=t=>(t>9.05&&t<9.5)?(.86+.07*Math.sin((t-9.05)*22)):1;
/* each inverter carries its own capacity factor, fixed by its id */
const devF=id=>KIND(id)==='INV'?(0.78+hash(id)*0.3):1;
const RATED=350;                        /* kW per inverter, for PR and the gauge maths */

function value(id,v,ms){
  if(!reports(id,v)) return null;
  const d=new Date(ms);
  const t=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
  const k=dayK(d), b=bell(t)*k*cloud(t);
  const n=jit(id,v,ms);
  const f=devF(id);
  const ghi=b*1010, poa=ghi*1.06;
  const pac=Math.max(0,b*RATED*0.86*f+(b>0?n*3.2:0));
  switch(v){
    case 'P_AC':   return KIND(id)==='MFM'?pac*6.4:pac;
    case 'S_AC':   return (KIND(id)==='MFM'?pac*6.4:pac)*1.002+Math.abs(n)*0.4;
    case 'Q_AC':   return b>0?Math.abs(n)*2.4:0;
    case 'COS_PHI':return b>0?0.997+n*0.004:0;
    case 'V_AC':   return 415+n*2.6;
    case 'I_AC':   return pac>0?pac*1000/(Math.sqrt(3)*415):0;
    case 'F_AC':   return 49.98+n*0.06;
    case 'P_DC':   return pac>0?pac/0.985:0;
    case 'V_DC':   return b>0?622+n*9:0;
    case 'I_DC':   return b>0?(pac/0.985)*1000/(622+n*9):0;
    /* energy is an integral, not a sample: it only ever climbs, and it resets
       at midnight. Integrated over the day so far rather than accumulated by
       the page, so scrolling back to an earlier hour gives the same number. */
    case 'E_TODAY':return dayEnergy(id,d,t);
    case 'E_TOTAL':return 40000+hash(id)*22000+dayEnergy(id,d,t);
    case 'T_INT':  return 26+b*34*f+n*1.1;
    case 'T_AMB':  return 21+bell(t)*11*k+n*0.7;
    case 'T_MOD':  return 21+bell(t)*11*k+poa/810*24+n*0.9;
    case 'GHI':    return ghi;
    case 'POA':    return poa;
    case 'PR':     return b>0?78.5+n*3.4:0;
    case 'CUF':    return b>0?21.5+n*2.2:0;
    case 'SPEC_YIELD': return dayEnergy(id,d,t)/RATED;
  }
  return null;
}
/* kWh delivered since midnight, by 10-minute strips - enough resolution for a
   curve that has to look like an integral of the power line above it */
function dayEnergy(id,d,t){
  const f=devF(id), s=KIND(id)==='MFM'?6.4:1, k=dayK(d);
  let e=0;
  for(let x=SUNRISE;x<t;x+=1/6) e+=Math.max(0,bell(x)*k*cloud(x))*RATED*0.86*f*s/6;
  return e;
}

/* =======================================================================
   THE QUERY
   ======================================================================= */
/* The page opens on the canonical solar question: two inverters' AC power
   against the irradiance that drove it. The weather station is in the selection
   because it is the only device that reports POA - without it the second axis
   would open empty, and a control that appears broken on first load reads as a
   broken control rather than as an honest "this device does not report that". */
let SEL=['INV06','INV07','WMS01'];      /* chosen devices, in fleet order */
let PAGE=0, PER=100;
let OFF={};                             /* legend toggles, keyed device|axis */

const y1=()=>$('y1v-sel').value;
const y2=()=>$('y2c-sel').value===NONE?'':$('y2v-sel').value;

/* the two ends of the window as epoch ms - null while they disagree */
function winRange(){
  const a=Date.parse($('f-from-d').value+'T'+($('f-from-t').value||'00:00')+':00');
  const b=Date.parse($('f-to-d').value+'T'+($('f-to-t').value||'00:00')+':00');
  return (isFinite(a)&&isFinite(b)&&b>a)?[a,b]:null;
}
/* ---------- resolution ----------
   The window sets the step, not a control. A month at five-minute resolution is
   nine thousand points of ink for a question nobody asked, and a six-hour window
   at one point an hour is four points pretending to be a curve. The ladder is
   climbed until the count fits. */
const LADDER=[1,5,15,30,60,180,360,720,1440];       /* minutes */
const MAXPTS=1100;
function stepMin(span){
  for(const m of LADDER) if(span/(m*60000)<=MAXPTS) return m;
  return LADDER[LADDER.length-1];
}

/* the rows the query resolves to; every reading on the page comes from here, so
   the chart and the table can never be drawn from different data */
let ROWS=[], STEP=5;
function buildRows(){
  const w=winRange();
  ROWS=[];
  if(!w) return;
  STEP=stepMin(w[1]-w[0]);
  const ms=STEP*60000;
  const a=y1(), b=y2();
  for(let t=w[0];t<=w[1];t+=ms){
    const r={t:t,v1:{},v2:{}};
    SEL.forEach(function(id){
      r.v1[id]=value(id,a,t);
      if(b) r.v2[id]=value(id,b,t);
    });
    ROWS.push(r);
  }
}

/* ---------- the stamp ----------
   The monitoring table's format, unchanged: a reading is a point in TIME, not a
   time of day. "12:05:02" reads fine while you are looking at one day and is
   ambiguous the moment the window spans two - which of the thirty-one 12:05s is
   this? Sortable YYYY-MM-DD, and a 24-hour clock so there is no AM/PM to lose. */
function stamp(ms){
  const d=new Date(ms);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+
         ' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

/* =======================================================================
   CHART
   ======================================================================= */
/* Colour follows the DEVICE, assigned in fleet order and never cycled: a device
   keeps its slot when another is switched off in the legend, so the survivors
   are not repainted under the reader.

   THE CAP WAS FOUR, AND IT WAS A COLOUR CAP. Past four lines stacked in one
   frame there is no fifth hue that stays apart from the other four for a
   colour-blind reader, so there was no fifth line and the rest were left to the
   table. The plot is SPLIT now - one panel per device - and a device in its own
   panel is not being told apart from anything by its colour. The constraint
   that replaces it is vertical room: eight panels is already a card taller than
   a screen, and past that the strip stops being read and starts being scrolled.

   Eight hues, then, from the same series ramp the rest of the portal uses. */
const SLOTS=['var(--s1)','var(--s2)','var(--s3)','var(--s4)',
             'var(--s5)','var(--s6)','var(--s7)','var(--s8)'];

/* FOUR SERIES, AND IT IS A COLOUR CAP.

   In one frame the only thing keeping two curves apart is their hue, and past
   four there is no fifth that stays clear of the other four for a colour-blind
   reader. So a fifth device is selected but not plotted, and the legend says so
   in its last chip rather than the chart quietly dropping it.

   It was briefly 8, while the plot could be split into a panel per device: a
   line alone in a named panel is not told apart by its colour, so the limit
   there was vertical room instead. The split went, and the reason for 8 went
   with it. */
const PLOTCAP=4;
const plotted=()=>SEL.slice(0,PLOTCAP);
const colorOf=id=>SLOTS[plotted().indexOf(id)]||'var(--dim)';

let W=1300,H=340;
const ML=58,MT=16,MB=40;
/* the right gutter exists only to hold the Y2 scale. With one axis it is 58px
   of nothing between the last reading and the card edge, so it is only reserved
   when there is something to print in it. */
let MR=58;
let PW=W-ML-MR, PH=H-MT-MB;

/* ---------- the scale ----------
   Four intervals of a round step, so every gridline is a number a reader can
   hold and the five labels the axis draws land exactly on them.

   The baseline is NOT always zero. Power falls to zero every night, so a zero
   baseline is the honest frame for it - but grid frequency lives between 49.9
   and 50.1, and forcing that onto a 0-50 axis draws a dead flat line at the top
   and hides the only thing anyone opens the page to see. Zero is kept whenever
   the data actually comes near it, and dropped when the reading is a narrow
   band a long way above it. */
function niceScale(mn,mx){
  if(!isFinite(mn)||!isFinite(mx)) return [0,1];
  /* a window with nothing but zeros in it - a night, or a device that was down
     all day. Left to the general case this drew a 0 to 0.05 axis, which prints
     five decimal gridlines under a flat line and reads as a precision instrument
     measuring nothing. A plain 0-1 frame says the same thing without the theatre. */
  if(mn===0&&mx===0) return [0,1];
  if(mn>=0&&mn<=0.25*mx) mn=0;            /* the data reaches for zero - keep it */
  if(mx<=0&&mn<0&&mx>=0.25*mn) mx=0;
  if(mx===mn){ mx=mn+(Math.abs(mn)||1)*0.05; }
  const raw=(mx-mn)/4;
  const e=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/e;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;
  return [Math.floor(mn/step)*step, Math.ceil(mx/step)*step];
}

/* the extent of one axis across the devices currently drawn */
function extent(which){
  let mx=-Infinity,mn=Infinity,any=false;
  ROWS.forEach(function(r){
    plotted().forEach(function(id){
      if(OFF[id+'|'+which]) return;
      const v=(which===1?r.v1:r.v2)[id];
      if(v==null||!isFinite(v)) return;
      any=true; if(v>mx)mx=v; if(v<mn)mn=v;
    });
  });
  if(!any) return null;
  return niceScale(mn,mx);
}

const fmtNum=v=>Math.abs(v)>=1000?v.toFixed(0):Math.abs(v)>=100?v.toFixed(1):v.toFixed(2);
/* zero is written "0", not "0.00" - an axis that prints two decimals on its
   baseline claims a precision the gridline does not have, and it is the widest
   label on the scale for the least information */
const axNum=v=>Math.abs(v)<1e-9?'0'
              :Math.abs(v)>=1000?v.toLocaleString('en-US',{maximumFractionDigits:0})
              :Math.abs(v)>=10?v.toFixed(0):v.toFixed(Math.abs(v)>=1?1:2);

/* x is time across the window; both views share it */
function xOf(t){
  const w=winRange(); if(!w) return ML;
  return ML+(t-w[0])/(w[1]-w[0])*PW;
}
/* ---------- time ticks ----------
   Ticks land on ROUND times, not on equal fractions of the window. Cutting the
   span into n equal parts put the labels on 03:25, 06:51, 10:17 - arithmetically
   even and useless, because nobody reads a chart by asking what happened at
   ten past. The step is taken off a ladder of intervals a clock actually has,
   and the ticks are aligned to local midnight so a day boundary is always one
   of them. */
const TSTEPS=[6e4,12e4,3e5,6e5,9e5,18e5,                     /* 1,2,5,10,15,30 min */
              36e5,72e5,108e5,216e5,432e5,                    /* 1,2,3,6,12 h       */
              864e5,1728e5,6048e5,12096e5];                   /* 1,2,7,14 d         */
function timeTicks(from,to,maxN){
  const span=to-from;
  let step=TSTEPS[TSTEPS.length-1];
  for(const s of TSTEPS){ if(span/s<=maxN){ step=s; break; } }
  /* months are not a fixed number of milliseconds, so a long window steps by
     whole days off the ladder rather than pretending otherwise */
  const d0=new Date(from); d0.setHours(0,0,0,0);
  let t=d0.getTime();
  while(t<from) t+=step;
  const out=[];
  for(;t<=to;t+=step) out.push(t);
  return {ticks:out,step:step};
}
/* a label that says as much as the step needs and no more */
function xLabel(ms,step){
  const d=new Date(ms);
  if(step<864e5) return pad(d.getHours())+':'+pad(d.getMinutes());
  return pad(d.getDate())+'/'+pad(d.getMonth()+1);
}

/* THE PLOT KEEPS ITS PROPORTIONS. Its height tracks the card's width and stays
   inside a band, so the same day looks like the same day on a laptop and on a
   wide monitor - a chart is read as a shape, and a shape that changes with the
   window is a different chart at every width.

   For a while the height grew with a panel count instead, because the plot
   could be split one frame per device. There is one frame again, so there is
   one height again. */
function fitChart(force){
  const box=$('chartwrap');
  const cw=Math.max(320,Math.round(box.clientWidth-20));
  const b2=y2();
  const nh=Math.round(Math.min(380,Math.max(230,cw*0.21)));
  /* the right gutter only exists when there is a second scale to print in it */
  const nmr=b2?58:20;
  if(!force && cw===W && nh===H && nmr===MR) return false;
  W=cw; H=nh; MR=nmr; PW=W-ML-MR; PH=H-MT-MB;
  $('chart').setAttribute('viewBox','0 0 '+W+' '+H);
  return true;
}

/* ======================= THE PLOT AREA =======================

   ONE FRAME, and every plotted device drawn into it. The band is the rectangle
   the curves live in, and it is a VALUE rather than four loose constants so
   that the gridlines, the scales, the series and the crosshair all read the
   same geometry from one place instead of each recomputing it.

   IT ALSO CARRIES WHICH AXES IT NEEDS. A frame whose devices all report power
   and nothing else should not print a second gutter of numbers down the right
   that nothing in it is measured against - so y1 and y2 say whether there is
   anything to read on each side, and the gutter follows.

   THE SCALES ARE SHARED across every device in the frame, which is the whole
   point of overlaying them: two curves drawn against the same extent can be
   compared by eye. extent() reads across every plotted device.

   NULL WHEN THERE IS NOTHING TO DRAW - a device is in the frame only if it
   reports the parameter and the legend has not switched that series off. Empty
   is a state, and the caller draws an empty frame with the note over it rather
   than a blank rectangle.

   This briefly returned a LIST of bands, one per device, and the plot could be
   split into a stack. It is one frame again, so it is one band again - but it
   stays a returned value rather than an assumption, because that is what kept
   the drawing code from having to know either way. */
function plot(){
  const b2=y2();
  const live=plotted().map(function(id){
    return {a: reports(id,y1()) && !OFF[id+'|1'],
            b: !!(b2 && reports(id,y2()) && !OFF[id+'|2'])};
  }).filter(function(p){ return p.a||p.b; });
  if(!live.length) return null;
  return { y1:live.some(function(p){ return p.a; }),
           y2:live.some(function(p){ return p.b; }),
           top:MT, h:PH };
}

function drawChart(){
  fitChart(false);
  const svg=$('chart'), b2=y2();
  const w=winRange();
  const note=$('chartnote');
  $('axes').innerHTML=''; $('series').innerHTML=''; $('dots').innerHTML='';
  $('areas').innerHTML=''; $('gdefs').innerHTML='';

  if(!w){ note.hidden=false; note.textContent='Set a window: the end must be after the start.'; return; }
  if(!SEL.length){ note.hidden=false; note.textContent='Pick one or more devices to plot.'; drawFrame(null,null); return; }
  if(!ROWS.length){ note.hidden=false; note.textContent='No readings in this window.'; drawFrame(null,null); return; }

  const e1=extent(1), e2=b2?extent(2):null;
  if(!e1&&!e2){
    note.hidden=false;
    note.textContent='None of the selected devices reports '+
      [y1(),b2].filter(Boolean).join(' or ')+'.';
    drawFrame(null,null); return;
  }
  note.hidden=true;
  drawFrame(e1,e2);
  drawSeries(e1,e2);
}

/* ---------- axes ----------
   Each axis is titled with the parameter AND its unit, and the title carries the
   line style that reads it. On a two-scale plot the axis a line belongs to is
   the one thing a reader cannot work out from the picture, so it is never left
   to be worked out. */
function drawFrame(e1,e2){
  const w=winRange(); if(!w) return;
  const b2=y2();
  /* nothing plotted: the frame is still drawn, as an empty band, so the note
     over it sits on a plot rather than on a blank rectangle */
  const band=plot()||{y1:true,y2:true,top:MT,h:PH};
  const tt=timeTicks(w[0],w[1],Math.max(2,Math.min(14,Math.floor(PW/86))));
  const steps=4;
  let s='';

  if(e1||e2) for(let i=0;i<=steps;i++){
    const y=band.top+band.h*(i/steps);
    s+='<line class="gl" x1="'+ML+'" y1="'+y.toFixed(1)+'" x2="'+(W-MR)+'" y2="'+y.toFixed(1)+'"/>';
  }
  /* Y1 scale, left: the labels END at the gutter and run leftward, or they
     would be printed across the plot they are labelling. Printed only where
     there is a Y1 curve in the frame to read against it. */
  if(e1&&band.y1!==false) s+=yScale(e1,band,'end',ML-8,steps);
  /* Y2 reads the same frame from the right-hand gutter, on the same terms */
  if(b2&&e2&&band.y2) s+=yScale(e2,band,'start',W-MR+8,steps);
  tt.ticks.forEach(function(t){
    const x=xOf(t);
    s+='<line class="gl v" x1="'+x.toFixed(1)+'" y1="'+band.top.toFixed(1)+
       '" x2="'+x.toFixed(1)+'" y2="'+(band.top+band.h).toFixed(1)+'"/>';
  });

  /* the time axis, under the frame */
  tt.ticks.forEach(function(t){
    s+='<text class="axt" x="'+xOf(t).toFixed(1)+'" y="'+(H-14)+'" text-anchor="middle">'+
       xLabel(t,tt.step)+'</text>';
  });

  /* the window, spelled out under the axis - the bar above can be scrolled off */
  s+='<text class="axt" x="'+(W/2)+'" y="'+(H-1)+'" text-anchor="middle" style="letter-spacing:.08em">'+
     stamp(w[0])+'  →  '+stamp(w[1])+'</text>';

  /* each axis title runs down the side of the frame it is read from */
  if(e1) s+=axTitle(labelOf(y1()),'Y1',band,14,false);
  if(b2&&e2) s+=axTitle(labelOf(y2()),'Y2',band,W-13,true);
  $('axes').innerHTML=s;
}
function yScale(e,band,anchor,x,steps){
  const n=steps||4;
  let s='';
  for(let i=0;i<=n;i++){
    const v=e[1]-(e[1]-e[0])*(i/n), y=band.top+band.h*(i/n);
    s+='<text class="axt" x="'+x+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="'+anchor+'">'+axNum(v)+'</text>';
  }
  return s;
}
/* The title carries the parameter, its unit, AND the stroke that reads it. On a
   two-scale plot the axis a line belongs to is the one thing the picture cannot
   tell you, so it is never left to be worked out. */
function axTitle(txt,which,band,x,dashed){
  const cy=band.top+band.h/2;
  return '<g transform="translate('+x+','+cy+') rotate(-90)">'+
    '<text class="axtitle" x="0" y="0" text-anchor="middle">'+which+' · '+esc(txt)+
      ' · '+(dashed?'dashed':'solid')+'</text></g>';
}

function drawSeries(e1,e2){
  const b2=y2();
  let s='', ar='', defs='';
  /* every plotted device draws into the one frame */
  const band=plot(); if(!band) return;
  plotted().forEach(function(id){
    [1,2].forEach(function(which){
      if(which===2&&!b2) return;
      if(OFF[id+'|'+which]) return;
      const e=which===1?e1:e2; if(!e) return;
      const yOf=v=>band.top+(1-(v-e[0])/(e[1]-e[0]))*band.h;
      /* a gap in the data is a GAP: the path is broken rather than bridged, so
         a device that stopped reporting does not get a straight line drawn
         across the hours it was silent - and the fill is broken with it, one
         closed shape per run of readings rather than one shape over the hole */
      let d='', pen=false, runs=[], run=null;
      ROWS.forEach(function(r){
        const v=(which===1?r.v1:r.v2)[id];
        if(v==null||!isFinite(v)){ pen=false; run=null; return; }
        const x=xOf(r.t), y=yOf(v);
        d+=(pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';
        if(!run){ run={x0:x, pts:''}; runs.push(run); }
        run.pts+=(run.pts?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';
        run.x1=x;
        pen=true;
      });
      if(!d) return;
      const col=colorOf(id), gid='ar-'+id+'-'+which;
      /* The fill Monitoring puts under its power curve, per device colour: it
         fades to nothing at the baseline, so four series can overlap without the
         plot turning into a block of paint. */
      defs+='<linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="'+col+'" stop-opacity="'+(which===1?'.26':'.16')+'"/>'+
        '<stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient>';
      const base=(band.top+band.h).toFixed(1);
      runs.forEach(function(r){
        if(r.x1===r.x0) return;                 /* a single point has no area */
        ar+='<path d="'+r.pts.trim()+' L'+r.x1.toFixed(1)+' '+base+' L'+r.x0.toFixed(1)+' '+base+
            ' Z" fill="url(#'+gid+')"/>';
      });
      s+='<path d="'+d.trim()+'" fill="none" stroke="'+col+'" stroke-width="2" '+
         'stroke-linejoin="round" stroke-linecap="round"'+
         (which===2?' stroke-dasharray="6 4"':'')+'/>';
    });
  });
  $('gdefs').innerHTML=defs;
  $('areas').innerHTML=ar;
  $('series').innerHTML=s;
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------- legend ----------
   Present whenever anything is plotted, and every chip names its device and its
   parameter - identity never rests on colour alone. Clicking one drops that
   line; the others keep their colours, because the colour belongs to the device
   and not to its position in what is left. */
function renderLegend(){
  const b2=y2(), out=[];
  plotted().forEach(function(id){
    [1,2].forEach(function(which){
      if(which===2&&!b2) return;
      const p=which===1?y1():y2();
      /* A device is only paired with a parameter it actually reports. Listing
         "INV06 POA" greyed out was meant to be honest about the gap, but it reads
         as the inverter having an irradiance channel that is merely offline - and
         with two categories chosen the strip fills with those phantom pairs
         faster than with the real ones. What a device cannot measure is not a
         series that is switched off; it is not a series. */
      if(!reports(id,p)) return;
      const off=!!OFF[id+'|'+which];
      out.push('<span class="lg'+(off?' off':'')+'" '+
        'onclick="legToggle(\''+id+'\','+which+')">'+
        '<i class="'+(which===1?'solid':'dash')+'" style="border-top-color:'+colorOf(id)+'"></i>'+
        '<span class="n">'+id+'</span><span class="p">'+esc(p)+'</span></span>');
    });
  });
  /* what is selected but not plotted is SAID, in the strip that would have
     carried it. A chart that silently drops the fifth device is a chart that
     lies about what it was asked for. */
  if(SEL.length>PLOTCAP)
    out.push('<span class="lg" style="cursor:default" title="Colour cannot keep more than four series apart in one frame for a colour-blind reader. The rest are in the table below.">'+
      '<span class="p">+'+(SEL.length-PLOTCAP)+' more in table</span></span>');
  $('legend').innerHTML=out.join('');
}
window.legToggle=function(id,which){
  const k=id+'|'+which;
  OFF[k]=!OFF[k];
  renderLegend(); drawChart();
};

/* ---------- hover: crosshair + tooltip ---------- */
const tip=$('tip'), xh=$('xh'), wrapEl=$('chartwrap');
$('chart').addEventListener('mousemove',function(e){
  const svg=$('chart'), r=svg.getBoundingClientRect();
  const vx=(e.clientX-r.left)/r.width*W, vy=(e.clientY-r.top)/r.height*H;
  if(!ROWS.length||vx<ML||vx>W-MR||vy<MT||vy>MT+PH){ hideTip(); return; }
  const w=winRange(); if(!w){ hideTip(); return; }
  /* snap to a sampled instant: the value between two samples was never measured */
  const frac=(vx-ML)/PW;
  let i=Math.round(frac*(ROWS.length-1));
  i=Math.max(0,Math.min(ROWS.length-1,i));
  const row=ROWS[i], x=xOf(row.t);
  const b2=y2();

  let html='', n=0;
  plotted().forEach(function(id){
    [1,2].forEach(function(which){
      if(which===2&&!b2) return;
      if(OFF[id+'|'+which]) return;
      const v=(which===1?row.v1:row.v2)[id];
      if(v==null||!isFinite(v)) return;
      const p=which===1?y1():y2();
      html+='<div class="tr"><i class="'+(which===1?'solid':'dash')+'" style="border-top-color:'+colorOf(id)+'"></i>'+
            id+' <span style="opacity:.7">'+esc(p)+'</span><b>'+fmtNum(v)+(unitOf(p)?' '+unitOf(p):'')+'</b></div>';
      n++;
    });
  });
  if(!n){ hideTip(); return; }

  xh.setAttribute('x1',x); xh.setAttribute('x2',x);
  xh.setAttribute('y1',MT);
  xh.setAttribute('y2',MT+PH);
  xh.style.opacity=.25;
  tip.innerHTML='<div class="tt">'+stamp(row.t)+'</div>'+html;
  const wr=wrapEl.getBoundingClientRect();
  let lx=(x/W)*r.width+(r.left-wr.left)+14;
  if(lx+190>wr.width) lx-=214;
  tip.style.left=Math.max(4,lx)+'px';
  tip.style.top=Math.max(6,(e.clientY-wr.top)-18)+'px';
  tip.style.opacity=1;
});
$('chart').addEventListener('mouseleave',hideTip);
function hideTip(){ tip.style.opacity=0; xh.style.opacity=0; }

/* =======================================================================
   TABLE  ·  the monitoring history layout
   Device names across the top, the parameter each one reports beneath, time
   stamps down the side. With a second axis chosen each device spans two
   columns - Y1 then Y2 - so the pairing stays structural rather than being
   spelled out in a column name.
   ======================================================================= */
let COLS=[];                            /* devices shown in the table */
const PH_COLS=3;

function syncCols(){
  /* a device dropped from the query cannot stay a column; one added arrives
     shown, because ticking it in the bar is already the request to see it */
  COLS=COLS.filter(id=>SEL.indexOf(id)>=0);
  SEL.forEach(id=>{ if(COLS.indexOf(id)<0) COLS.push(id); });
  COLS.sort((a,b)=>DEVICES.indexOf(a)-DEVICES.indexOf(b));
}

/* The table is the chart's data, so it carries the same pairs the chart draws and
   no others: a device gets a column for each parameter IT reports, which is one
   for an inverter asked for power and irradiance, one for the weather station,
   and none at all for a device that reports neither. Columns of dashes were a
   truthful answer to a question nobody asked - "what would POA be on INV06" -
   and they cost half the table's width to say "not applicable". */
function plan(){
  const b2=y2(), out=[];
  COLS.forEach(function(id){
    const cells=[];
    if(reports(id,y1())) cells.push({which:1,p:y1()});
    if(b2&&reports(id,y2())) cells.push({which:2,p:y2()});
    if(cells.length) out.push({id:id,cells:cells});
  });
  return out;
}

function renderTable(){
  const cols=plan();
  const blank=!cols.length||!ROWS.length;
  const ph=n=>Array.from({length:PH_COLS},()=>'<th class="ph">'+n+'</th>').join('');

  $('thead').innerHTML=
    '<tr class="grp"><th class="ts" rowspan="2" style="vertical-align:bottom;border-bottom:1px solid var(--line-soft)">Time Stamp</th>'+
    (blank?ph('Device Name')
          :cols.map(d=>'<th class="dev sep" colspan="'+d.cells.length+'">'+d.id+'</th>').join(''))+
    '</tr><tr>'+
    (blank?ph('Variable Name')
          :cols.map(d=>d.cells.map((c,i)=>'<th'+(i?'':' class="sep"')+'>'+esc(labelOf(c.p))+'</th>').join('')).join(''))+
    '</tr>';

  if(blank){
    $('tbody').innerHTML='<tr><td colspan="'+(PH_COLS+1)+'"><div class="empty-note tall">'+
      (!ROWS.length?'No data':!COLS.length?'No columns selected'
        :'None of these devices reports '+[y1(),y2()].filter(Boolean).join(' or '))+
      '</div></td></tr>';
    $('range').textContent='0-0 of 0';
    $('prev').disabled=true; $('next').disabled=true;
    return;
  }

  const pages=Math.max(1,Math.ceil(ROWS.length/PER));
  if(PAGE>=pages) PAGE=pages-1;
  if(PAGE<0) PAGE=0;
  const from=PAGE*PER, slice=ROWS.slice(from,from+PER);

  $('tbody').innerHTML=slice.map(function(r){
    return '<tr><td class="ts">'+stamp(r.t)+'</td>'+
      cols.map(d=>d.cells.map(function(c,i){
        const v=(c.which===1?r.v1:r.v2)[d.id];
        const nil=(v==null||!isFinite(v));
        const cl=[i?'':'sep',nil?'nil':''].filter(Boolean).join(' ');
        return '<td'+(cl?' class="'+cl+'"':'')+'>'+(nil?'—':fmtNum(v))+'</td>';
      }).join('')).join('')+'</tr>';
  }).join('');

  $('range').textContent=(from+1)+'-'+Math.min(from+PER,ROWS.length)+' of '+ROWS.length;
  $('prev').disabled=PAGE<=0;
  $('next').disabled=from+PER>=ROWS.length;
}

/* ---------- export ----------
   The file carries the same two header rows the table shows, for EVERY row the
   query resolves to - not just the page on screen. A real file, not a toast, so
   the choice can actually be checked. */
window.exportCsv=function(){
  /* the same plan the table is drawn from, so the file and the page cannot
     disagree about which device reports what */
  const cols=plan(), q=s=>/[",\r\n]/.test(s)?'"'+String(s).replace(/"/g,'""')+'"':String(s);
  const devRow=[''].concat(cols.map(d=>d.cells.map(()=>d.id)).flat()).map(q).join(',');
  const varRow=['Time Stamp'].concat(cols.map(d=>d.cells.map(c=>labelOf(c.p))).flat()).map(q).join(',');
  const body=ROWS.map(function(r){
    const cells=[stamp(r.t)];
    cols.forEach(function(d){
      d.cells.forEach(function(c){
        const v=(c.which===1?r.v1:r.v2)[d.id];
        cells.push((v==null||!isFinite(v))?'':fmtNum(v));
      });
    });
    return cells.map(q).join(',');
  });
  const csv=[devRow,varRow].concat(body).join('\r\n');
  /* leading BOM: without it Excel reads the file in the system codepage and any
     non-ASCII in a unit - the ° in °C, the ² in W/m² - comes out as mojibake */
  const url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');
  /* named for the window it covers, so two exports an hour apart do not
     overwrite each other in the downloads folder */
  a.href=url; a.download='Analysis_'+$('f-from-d').value+'_'+$('f-to-d').value+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),0);
  T('Exported '+body.length+' rows · '+cols.length+' device'+(cols.length===1?'':'s'));
};
