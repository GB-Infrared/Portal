/* ---------- single-choice dropdown (radio rows) ---------- */
function singleSelect(o){
  const el=$(o.value), mount=$(o.mount);
  const btn=document.createElement('button');
  btn.type='button'; btn.className='mbtn'; btn.setAttribute('aria-expanded','false');
  if(o.title) btn.title=o.title;
  const lab=document.createElement('span'); lab.className='mlab'; btn.appendChild(lab);
  const pan=document.createElement('div'); pan.className='colpanel mpanel'; pan.hidden=true;
  mount.appendChild(btn); mount.appendChild(pan);

  const api={
    close:function(){ if(!pan.hidden) open(false); },
    set:function(v){ el.value=v; paint(); },
    /* the value list is rebuilt when its category changes - that is the whole
       point of the pair */
    options:function(list,keep){
      o.options=list;
      if(list.indexOf(el.value)<0) el.value=keep&&list.length?list[0]:(list[0]||'');
      paint();
    }
  };
  function paint(){
    const empty=!o.options.length;
    btn.disabled=empty;
    lab.textContent=empty?'—':(o.render?o.render(el.value):el.value);
    /* `dim` is a value that is a STATE rather than a choice - the header's Off -
       and it reads dimmed for the same reason an empty list reads as a dash */
    lab.className='mlab'+(empty?' any':'')+(o.dim&&o.dim(el.value)?' off':'');
  }
  function draw(){
    pan.innerHTML='<div class="colhead">'+o.head+'</div>'+
      o.options.map(function(v){
        return '<label class="colrow"><input type="radio" name="'+o.value+'-r" value="'+esc(v)+'"'+
          (v===el.value?' checked':'')+'>'+esc(o.render?o.render(v):v)+
          (o.unit&&unitOf(v)?'<span class="unit">'+esc(unitOf(v))+'</span>':'')+'</label>';
      }).join('');
  }
  function open(on){
    if(on){ pickClose(api); draw(); }
    pan.hidden=!on; mount.classList.toggle('open',on);
    btn.setAttribute('aria-expanded',on?'true':'false');
  }
  btn.addEventListener('click',function(e){ e.stopPropagation(); if(!btn.disabled) open(pan.hidden); });
  pan.addEventListener('click',function(e){ e.stopPropagation(); });
  pan.addEventListener('change',function(e){
    const r=e.target; if(r.type!=='radio') return;
    el.value=r.value; paint();
    open(false);                        /* one choice, so the panel is done */
    el.dispatchEvent(new Event('change',{bubbles:true}));
  });
  PICKS.push(api); paint();
  return api;
}

/* =======================================================================
   SAVED VIEWS
   A view is the query minus the window - see the note in the bar above. Held in
   localStorage beside the site the portal is on, because it is the same kind of
   fact: something this reader chose that should still be true tomorrow. A
   backend replaces vwRead/vwWrite and nothing else here changes.
   ======================================================================= */
const VKEY='enerops-analysis-views';
function vwRead(){
  try{ const v=JSON.parse(localStorage.getItem(VKEY)); return Array.isArray(v)?v:[]; }
  catch(e){ return []; }
}
function vwWrite(){ try{ localStorage.setItem(VKEY,JSON.stringify(VIEWS)); }catch(e){} }
let VIEWS=vwRead();
let vwCur='';                          /* the NAME of the view on screen, or '' */

/* the whole query, and only the query */
function vwSnap(){
  return {dev:SEL.slice(), y1c:$('y1c-sel').value, y1v:$('y1v-sel').value,
          y2c:$('y2c-sel').value, y2v:$('y2v-sel').value};
}
const vwSame=(a,b)=> !!a && !!b
  && a.y1c===b.y1c && a.y1v===b.y1v && a.y2c===b.y2c && a.y2v===b.y2v
  && a.dev.length===b.dev.length && a.dev.every(function(d,i){ return d===b.dev[i]; });
const vwBy=n=>VIEWS.filter(function(x){ return x.n===n; })[0];
/* what a row is, in the row - so the list can be read without opening each one */
function vwSay(q){
  const y=q.y2c===NONE ? q.y1v : q.y1v+' / '+q.y2v;
  return q.dev.length+(q.dev.length===1?' device':' devices')+' \u00b7 '+y;
}

/* setting the bar from a view: every control is told, then the query runs once */
function vwApply(q){
  SEL=q.dev.slice();
  if(DEVPICK) DEVPICK.refresh();
  Y1C.set(q.y1c);
  Y1V.options(catOf(q.y1c).vals.map(function(v){ return v[0]; }),false);
  Y1V.set(q.y1v);
  Y2C.set(q.y2c);
  if(q.y2c===NONE){ Y2V.options([],false); }
  else { Y2V.options(catOf(q.y2c).vals.map(function(v){ return v[0]; }),false); Y2V.set(q.y2v); }
}

/* EDITED, said out loud. A view that has been changed since it was opened is
   not that view any more, and a button still claiming to be it is the one way
   this control could mislead. */
function vwPaint(){
  const lab=$('vw-lab'), box=$('vw');
  const v=vwBy(vwCur);
  const dirty=v && !vwSame(v.q,vwSnap());
  lab.textContent = v ? v.n : 'Unsaved view';
  lab.classList.toggle('none',!v);
  box.classList.toggle('on',!!v);
  const old=$('vw-btn').querySelector('.edit'); if(old) old.remove();
  if(dirty){
    const e=document.createElement('span'); e.className='edit'; e.textContent='EDITED';
    $('vw-btn').appendChild(e);
  }
}

function vwList(){
  const wrap=$('vw-list');

    return '<div class="vwrow'+(v.n===vwCur?' on':'')+'" data-i="'+i+'" role="button" tabindex="0">'
      +'<span class="n">'+esc(v.n)+'</span>'
      +'<span class="q">'+esc(vwSay(v.q))+'</span>'
      +'<button class="vwx" type="button" data-del="'+i+'" title="Delete this view"'
      +' aria-label="Delete '+esc(v.n)+'">'
      +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      +' stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'
      +'<path d="M4.5 6.5h15M9.5 6.5V5a1.4 1.4 0 0 1 1.4-1.4h2.2A1.4 1.4 0 0 1 14.5 5v1.5"/>'
      +'<path d="M6.6 6.5 7.4 19a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5l.8-12.5"/></svg>'
      +'</button></div>';
  }).join('');
}

function vwOpen(on){

$('vw-go').addEventListener('click',function(){
  const n=$('vw-name').value.trim();
  if(!n){ vwErr('A view needs a name.'); $('vw-name').focus(); return; }
  /* Saving over a name REPLACES it, because that is what somebody who typed the
     same name again meant. Two views called the same thing is a list you cannot
     read. */
  const had=vwBy(n);
  if(had) had.q=vwSnap();
  else VIEWS.push({n:n, q:vwSnap()});
  VIEWS.sort(function(a,b){ return a.n.toLowerCase()<b.n.toLowerCase()?-1:1; });

});

/* ================= WHICH SITE THE PORTAL IS ON =================
   ONE site, chosen ONCE, on the Sites screen.

   This page used to choose its own, from a picker in the bar below, and so did
   three others. Four pickers is four answers to a question that has one, and
   nothing kept them in step - the site overview already exists to answer "which
   site", and answering it a second time is how a portal ends up disagreeing
   with itself.

   So the pickers are gone, and this is the whole of what replaced them:
   ?plant= wins, because a link that names a site is explicit; otherwise the
   last choice stands, which is what carries the choice from page to page;
   otherwise the first site there is. The answer is printed in the bar, so no
   page is ever showing a site it has not named. */
function siteNow(ids){
  const q=new URLSearchParams(location.search).get('plant');
  let last=null; try{ last=localStorage.getItem('enerops-plant'); }catch(e){}
  const id = ids.indexOf(q)>=0 ? q : (ids.indexOf(last)>=0 ? last : ids[0]);
  try{ localStorage.setItem('enerops-plant',id); }catch(e){}
  const el=document.getElementById('site-now'); if(el) el.textContent=id;
  return id;
}

/* ---------- time dropdowns ----------
   The hidden input is the value: everything else on the page asks the field for
   "HH:MM" and gets it, exactly as it did when this was a time input, so the
   query wiring never learns that the control changed. */
function wireTimePicks(){
  document.querySelectorAll('.tpick').forEach(function(box){
    const el=$(box.dataset.time);
    const bits={};
    function parts(){
      const m=/^(\d{1,2}):(\d{2})/.exec(el.value||'');
      return m?[+m[1],+m[2]]:[0,0];
    }
    function bit(k,n){
      const b=document.createElement('button');
      b.type='button'; b.className='tbit'; b.dataset.part=k;
      b.setAttribute('aria-label',k==='h'?'Hour':'Minute');
      const list=document.createElement('div'); list.className='tlist'; list.hidden=true;
      b.appendChild(list); box.appendChild(b);
      bits[k]={b:b,list:list,n:n};
      const api={close:function(){ if(!list.hidden){ list.hidden=true; b.classList.remove('open'); } }};
      b.addEventListener('click',function(e){
        e.stopPropagation();
        if(!list.hidden){ api.close(); return; }
        pickClose(api);
        const now=parts()[k==='h'?0:1];
        let h='';
        for(let i=0;i<n;i++) h+='<button type="button" value="'+i+'"'+(i===now?' class="on"':'')+'>'+pad(i)+'</button>';
        list.innerHTML=h; list.hidden=false; b.classList.add('open');
        const on=list.querySelector('button.on');
        /* snapped to whole rows: a list resting part way into one reads as a
           misprint even when nothing is beside it to be out of step with */
        if(on){
          const rows=list.querySelectorAll('button');
          const step=rows.length>1?(rows[1].offsetTop-rows[0].offsetTop):on.offsetHeight;
          list.scrollTop=Math.max(0,Math.round((on.offsetTop-list.clientHeight/2)/step)*step);
        }
      });
      list.addEventListener('click',function(e){
        e.stopPropagation();
        const t=e.target.closest('button'); if(!t) return;
        const p=parts();
        el.value=pad(k==='h'?+t.value:p[0])+':'+pad(k==='m'?+t.value:p[1]);
        paint(); api.close();
        el.dispatchEvent(new Event('change',{bubbles:true}));
      });
      PICKS.push(api);
    }
    function paint(){
      const p=parts();
      bits.h.b.firstChild.nodeValue=pad(p[0]);
      bits.m.b.firstChild.nodeValue=pad(p[1]);
    }
    bit('h',24);
    box.insertBefore(Object.assign(document.createElement('span'),
      {className:'tsep',textContent:':'}),bits.h.b.nextSibling);
    bit('m',60);
    /* the label text has to exist before paint() can rewrite it in place */
    bits.h.b.insertBefore(document.createTextNode(''),bits.h.list);
    bits.m.b.insertBefore(document.createTextNode(''),bits.m.list);
    paint();
  });
}
wireTimePicks();

/* The whole date field is the button that opens the calendar.
   A date input only reacts to a click on its 12px indicator glyph, so a click on
   the number - which is most of the control, and where anyone aims - did
   nothing. Three things have to be true for that to feel like a button: it
   TOGGLES (showPicker has no close, so the second click blurs); no text select
   (preventDefault on mousedown, focus given back deliberately); and the open
   flag is honest, because the popup can close without us. */
function wireDatePickers(root){
  (root||document).querySelectorAll('input[type=date]').forEach(function(el){
    if(el.dataset.picker) return;
    el.dataset.picker='1';
    let open=false;
    const shut=function(){open=false;};
    el.addEventListener('blur',shut);
    el.addEventListener('change',shut);
    document.addEventListener('mousedown',function(e){ if(e.target!==el) shut(); },true);
    el.addEventListener('mousedown',function(e){
      if(e.offsetX>=el.clientWidth-26) return;   /* the indicator toggles itself */
      e.preventDefault();
      if(open){ el.blur(); open=false; return; }
      el.focus({preventScroll:true});
      if(el.showPicker){ try{ el.showPicker(); open=true; }catch(_){} }
    });
    el.addEventListener('keydown',function(e){
      if(e.key!=='Enter'&&e.key!==' ') return;
      e.preventDefault();
      if(open){ el.blur(); open=false; return; }
      if(el.showPicker){ try{ el.showPicker(); open=true; }catch(_){} }
    });
  });
}
wireDatePickers();

<!-- ======================= THE ROW, IN FULL =======================
     Hover a row and the whole of it is lifted out beside the pointer, so a table
     wider than the screen does not have to be read in two swipes. The labels are
     taken from the table's OWN header every time it opens - including the
     two-deck device/variable header, where a column is named by both decks - so
     a page that re-renders its columns can never label a value wrongly here. -->
<script>
(function(){
  const wrap=document.querySelector('.tablewrap');
  if(!wrap) return;
  const table=wrap.querySelector('table'), tbody=table&&table.tBodies[0];
  if(!tbody) return;

  const pop=document.createElement('div');
  pop.className='rowpop';
  document.body.appendChild(pop);

  /* Column names, read off the header as it stands. A header cell can span rows
     and columns, so the deck is laid out into a grid first and each column then
     reads down its own line - which is what turns "INV06" over "P_AC (kW)" into
     one name for one column. */
  function headerLabels(){
    const head=table.tHead; if(!head) return [];
    const grid=[];
    [].forEach.call(head.rows,function(tr,r){
      grid[r]=grid[r]||[];
      let c=0;
      [].forEach.call(tr.cells,function(cell){
        while(grid[r][c]!==undefined) c++;
        const rs=cell.rowSpan||1, cs=cell.colSpan||1;
        /* the sort arrow is a control, not part of the column's name */
        const txt=cell.textContent.replace(/[\u25b2\u25bc]/g,'').trim();
        for(let i=0;i<rs;i++){
          grid[r+i]=grid[r+i]||[];
          for(let j=0;j<cs;j++) grid[r+i][c+j]=txt;
        }
        c+=cs;
      });
    });
    const n=grid.reduce((m,g)=>Math.max(m,g.length),0), out=[];
    for(let c=0;c<n;c++){
      const parts=[];
      for(let r=0;r<grid.length;r++){
        const t=(grid[r]||[])[c];
        if(t&&parts[parts.length-1]!==t) parts.push(t);
      }
      out.push(parts.join(' \u00b7 '));
    }
    return out;
  }

  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let row=null;

  function hide(){ pop.classList.remove('on'); row=null; }

  function fill(tr){
    const labels=headerLabels();
    const cells=[].slice.call(tr.cells);
    /* the "nothing here" row is one cell spanning the table - there is no
       reading to spell out */
    if(cells.length<2) return false;
    let body='';
    cells.forEach(function(td,i){
      const v=td.textContent.trim();
      body+='<span class="rp-k">'+esc(labels[i]||('Column '+(i+1)))+'</span>'+
            '<span class="rp-v'+(v==='\u2014'||v===''?' nil':'')+'">'+esc(v||'\u2014')+'</span>';
    });
    /* the first cell is the row's identity - its time stamp - so it heads the
       card rather than sitting in the list as one field among many */
    pop.innerHTML='<div class="rp-h">'+esc(cells[0].textContent.trim())+'</div>'+
      '<div class="rp-g'+(cells.length>9?' two':'')+'">'+body+'</div>';
    return true;
  }

  function place(e){
    const w=pop.offsetWidth, h=pop.offsetHeight;
    let x=e.clientX+20, y=e.clientY+18;
    if(x+w>window.innerWidth-10) x=e.clientX-w-20;   /* flip rather than overflow */
    if(y+h>window.innerHeight-10) y=Math.max(10,e.clientY-h-14);
    pop.style.left=x+'px';
    pop.style.top=y+'px';
  }

  tbody.addEventListener('mousemove',function(e){
    const tr=e.target.closest&&e.target.closest('tr');
    if(!tr||!tbody.contains(tr)){ hide(); return; }
    if(tr!==row){
      if(!fill(tr)){ hide(); return; }
      row=tr;
      pop.classList.add('on');
    }
    place(e);
  });
  tbody.addEventListener('mouseleave',hide);
  /* it is pinned to the pointer, so anything that moves the page under it makes
     it a lie */
  window.addEventListener('scroll',hide,true);
  window.addEventListener('resize',hide);
})();
</script>
</body>
</html>
